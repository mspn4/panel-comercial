<!-- ════════════════════════════════════════════════════════════════════
     CONFIGURACIÓN  —  editá solo este bloque
     ════════════════════════════════════════════════════════════════════ -->
<script>
const CONFIG = {
  // Pegá acá la URL del Apps Script (VacacionesBackend.gs) que termina en /exec.
  // Sin esto, el panel funciona igual pero solo guarda en este navegador (localStorage).
  APPSSCRIPT_URL: "https://script.google.com/macros/s/AKfycbyifMhkiT78o_ZrdpLI7T3Kn3qHiYNk4jfI-9OFHNUZUJ4dX2HjsPkeI2foi8IFxs7S/exec",
  // Tiene que coincidir con VAC_EDIT_KEY de VacacionesBackend.gs.
  EDIT_KEY: "MAeditor2026",
  // La MISMA URL que ya tenés pegada en CONFIG.APPSSCRIPT_URL de nomina-produccion.html
  // (el backend es NominaBackend.gs). Con esto puesto, la nómina se trae sola al abrir
  // el panel y con el botón "Sincronizar nómina" — no hace falta cargar el mismo excel
  // dos veces. Sin URL, el botón "Cargar Excel nómina" de abajo sigue funcionando igual.
  NOMINA_URL: "https://script.google.com/macros/s/AKfycbwoFPJv2DMHyT_hG6j3jVh8fro6P-u6KbpwJzsbjgKwq-pchrRUsWPeiCbOsh7O-LTffg/exec",
};

// Sucursales — mismo set y mismo orden que control-agendas.html.
const SUCURSALES = [
  "Jujuy","Salta","Catamarca","Norte Centro (Metán)","Tucumán Capital",
  "Tucumán Interior (Concepción)","Santiago del Estero","Norte Interior (Orán)","Córdoba","La Rioja","CRM"
];
// Alias con los que puede venir la sucursal en un excel/pdf (nómina o vacaciones) → nombre canónico de arriba.
// Incluye las abreviaturas reales vistas en los planos de RRHH (ccosto/area), ej. "TUC. INT.", "N. CENTRO".
const SUCURSAL_ALIAS = {
  "jujuy":"Jujuy", "salta":"Salta", "catamarca":"Catamarca",
  "norte centro":"Norte Centro (Metán)","norte centro metan":"Norte Centro (Metán)","metan":"Norte Centro (Metán)","n centro":"Norte Centro (Metán)",
  // "norte centr" (sin la "o" final) es el valor real y textual que trae la columna "area" del plano
  // de RRHH (empleados_produccion_22sept.xlsx) — no es un typo de acá, así viene la data de origen
  // (mismo valor que ya reconocía nomina-produccion.html en su AREA_PRETTY, pero acá faltaba el alias).
  // Sin esto, esa gente quedaba fuera de SUCURSALES y aparecía como "sin sucursal asignada".
  "norte centr":"Norte Centro (Metán)",
  "tuc capital":"Tucumán Capital","tucuman capital":"Tucumán Capital","tucuman":"Tucumán Capital","tuc cap":"Tucumán Capital",
  "tuc interior":"Tucumán Interior (Concepción)","tucuman interior":"Tucumán Interior (Concepción)","concepcion":"Tucumán Interior (Concepción)","tuc int":"Tucumán Interior (Concepción)",
  "santiago":"Santiago del Estero","santiago del estero":"Santiago del Estero",
  "norte interior":"Norte Interior (Orán)","oran":"Norte Interior (Orán)","n interior":"Norte Interior (Orán)",
  "cordoba":"Córdoba","la rioja":"La Rioja",
  "crm":"CRM",
};
// Un color por sucursal (no por fuerza) — lo usa la vista "Gerente + Líder" > "Todo agrupado" para que
// el Gerente y el Líder Comercial de la MISMA sucursal se vean del mismo color entre sí, aunque sus
// filas queden separadas en la lista (a diferencia de FUERZA_COLOR, que distingue rol, no sucursal).
const SUCURSAL_COLOR_PALETA=["#0075DE","#DD5B00","#1AAE39","#8E44AD","#D7484B","#B7950B","#16A085","#6C3483","#5C6B7E","#C0392B","#3396F0","#E67E22"];
function colorDeSucursal(suc){ const i=SUCURSALES.indexOf(suc); return SUCURSAL_COLOR_PALETA[(i<0?0:i)%SUCURSAL_COLOR_PALETA.length]; }

// Fuerza/puesto — categorías de fuerza de venta (nomina-produccion.html, CAT_ORDER) + roles de staff que
// también piden vacaciones (visto en los planos combinados nómina+vacaciones de RRHH, ej. Catamarca/Concepción).
const FUERZAS = ["Gerente de Área","Líder Comercial","Vendedor Senior","Vendedor Junior","Vendedor Cobrador",
  "Vendedor de Showroom","Vendedor Redes","Vendedor Redes Jr","Líder Redes","Líder CRM","Vendedor CRM",
  "Administrativo de Área","Encargado de Depósito","Líder Operativo","Maestranza","Oficial de Crédito","Supervisor","Maestro Especial"];
// "Producción" = las categorías que existen en la nómina real (nomina-produccion.html CAT_ORDER, mismo
// set que trae el excel/backup de nómina). El resto de FUERZAS (arriba) son roles de staff que solo
// aparecen al importar un plano de vacaciones de RRHH (nunca vienen de la nómina) — se pueden ocultar
// con el toggle "Ocultar staff" del panel para ver solo fuerza de venta.
const FUERZAS_PRODUCCION = new Set(["Gerente de Área","Líder Comercial","Vendedor Senior","Vendedor Junior","Vendedor Cobrador",
  "Vendedor de Showroom","Vendedor Redes","Vendedor Redes Jr","Líder Redes","Líder CRM","Vendedor CRM"]);

// ═══ Reglas fijas de la empresa (comunicadas por Sebastian, no editables desde el panel) ═══
// Se muestran de solo lectura en el modal "Reglas" y las aplica calcularConflictos() sin que haga
// falta configurar nada — a diferencia de "Máximo por defecto"/excepciones, que sí son ajustables ahí.
// 1) Gerente de Área, Líder Comercial y Líder Operativo de una misma sucursal: uno por período (nunca
//    coinciden entre sí, aunque sean de fuerzas distintas — el máximo "por fuerza" de más arriba no
//    alcanza a cubrir esto porque compara puestos iguales, no un grupo de puestos distintos).
const GRUPO_GERENCIAL_EXCLUSIVO = ["Gerente de Área","Líder Comercial","Líder Operativo"];
// 2) Staff de área (Administrativo/Depósito/Crédito/Supervisor/Maestranza) de una misma sucursal: uno
//    por período — EXCEPTO Tucumán Capital y Salta, que tienen más de dos personas en cada puesto y
//    ahí alcanza con que cada puesto rote por separado (ya cubierto por el máximo normal de 1 por
//    fuerza). Los puestos de Administrativo de Área y Oficial de Crédito fueron definidos junto a las
//    jefaturas departamentales para poder cubrirse entre sucursales — no se deben reasignar a mano.
const GRUPO_STAFF_AREA = ["Administrativo de Área","Encargado de Depósito","Oficial de Crédito","Supervisor","Maestranza"];
const SUCURSALES_STAFF_SIN_AGRUPAR = new Set(["Tucumán Capital","Salta"]);
// 3) Vendedor de Showroom: uno por período EN TODA LA EMPRESA (no por sucursal — a diferencia de todo
//    lo demás, este puesto se coordina de forma centralizada entre las 11 sucursales).
// 4) Vendedor Senior + Vendedor Junior + Vendedor Cobrador (terreno) de una misma sucursal: se cubren
//    entre ellos, uno por período.
const GRUPO_TERRENO_COBRADOR = ["Vendedor Senior","Vendedor Junior","Vendedor Cobrador"];
// 5) Vendedor Redes: sin regla fija — a criterio del gerente y del departamento comercial.
// * Quien tenga ≤14 días de vacaciones al año (dato "diasEntitlement", viene de un plano de RRHH
//   importado) no puede fraccionar ese período en varias veces — tiene que salir de una sola vez.
const FUERZA_ALIAS = {
  "gerente":"Gerente de Área","gerente de area":"Gerente de Área",
  "lider comercial":"Líder Comercial",
  "vendedor senior":"Vendedor Senior","senior":"Vendedor Senior",
  "vendedor junior":"Vendedor Junior","junior":"Vendedor Junior",
  "cobrador":"Vendedor Cobrador","vendedor cobrador":"Vendedor Cobrador",
  "showroom":"Vendedor de Showroom","vendedor de showroom":"Vendedor de Showroom","vendedor de show r":"Vendedor de Showroom",
  "vendedor redes":"Vendedor Redes","redes":"Vendedor Redes",
  "vendedor redes jr":"Vendedor Redes Jr",
  "lider por redes":"Líder Redes","lider redes":"Líder Redes",
  "lider crm":"Líder CRM","vendedor crm":"Vendedor CRM",
  "administ de area":"Administrativo de Área","admin de area":"Administrativo de Área","administrativo de area":"Administrativo de Área",
  "encarg deposito":"Encargado de Depósito","encargado deposito":"Encargado de Depósito","encarg de deposito":"Encargado de Depósito",
  "lider operativo":"Líder Operativo",
  "maestranza":"Maestranza",
  "oficial de credito":"Oficial de Crédito",
  "supervisor":"Supervisor",
  "maest especial":"Maestro Especial","maestro especial":"Maestro Especial",
};
const FUERZA_COLOR = {
  "Gerente de Área":"#213183","Líder Comercial":"#5C6B7E","Vendedor Senior":"#0075DE","Vendedor Junior":"#3396F0",
  "Vendedor Cobrador":"#DD5B00","Vendedor de Showroom":"#1AAE39","Vendedor Redes":"#8E44AD","Vendedor Redes Jr":"#AF7AC5",
  "Líder Redes":"#6C3483","Líder CRM":"#B7950B","Vendedor CRM":"#D4AC0D",
  "Administrativo de Área":"#7F8C8D","Encargado de Depósito":"#A0522D","Líder Operativo":"#34495E","Maestranza":"#95A5A6",
  "Oficial de Crédito":"#16A085","Supervisor":"#C0392B","Maestro Especial":"#8E7CC3","_DEFAULT":"#615D59"
};

// Feriados nacionales 2026 (semilla) — los trasladables/por decreto cambian año a año,
// revisalos y ajustalos vos mismo acá abajo (hay editor en el panel "Feriados").
const FERIADOS_SEED = [
  {fecha:"2026-01-01", nombre:"Año Nuevo"},
  {fecha:"2026-02-16", nombre:"Carnaval"},
  {fecha:"2026-02-17", nombre:"Carnaval"},
  {fecha:"2026-03-23", nombre:"Puente turístico"},
  {fecha:"2026-03-24", nombre:"Día de la Memoria"},
  {fecha:"2026-04-02", nombre:"Malvinas / Jueves Santo"},
  {fecha:"2026-04-03", nombre:"Viernes Santo"},
  {fecha:"2026-05-01", nombre:"Día del Trabajador"},
  {fecha:"2026-05-25", nombre:"Revolución de Mayo"},
  {fecha:"2026-06-20", nombre:"Paso a la Inmortalidad de Belgrano"},
  {fecha:"2026-07-09", nombre:"Día de la Independencia"},
  {fecha:"2026-07-10", nombre:"Puente turístico"},
  {fecha:"2026-08-17", nombre:"Paso a la Inmortalidad de San Martín"},
  {fecha:"2026-10-12", nombre:"Día del Respeto a la Diversidad Cultural"},
  {fecha:"2026-11-23", nombre:"Día de la Soberanía Nacional"},
  {fecha:"2026-12-08", nombre:"Inmaculada Concepción"},
  {fecha:"2026-12-25", nombre:"Navidad"},
];
</script>

<style>
:root{
  --navy:#213183; --navy-active:#182666; --blue:#0075DE; --blue-tint:#EAF2FC; --blue-tint-2:#D6E9FA;
  --orange:#DD5B00; --orange-tint:#FBE7D9;
  --page:#F6F5F4; --surface:#FFFFFF; --border:#E6E6E6; --border-strong:#C9C4BE;
  --text:#000000; --muted:#615D59; --muted-2:#A39E98;
  --ok:#1AAE39; --ok-tint:#E6F7EA; --err:#D7484B; --err-tint:#FBE7E7;
  --warn:#C77B12; --warn-tint:#FCF1DC;
  --blue-active:#0E3F7E; --danger-active:#B93A3D;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
}
html[data-theme="dark"]{
  --navy:#2C42A8; --navy-active:#213183; --blue:#3396F0; --blue-tint:rgba(51,150,240,.16); --blue-tint-2:rgba(51,150,240,.24);
  --orange:#FF7A26; --orange-tint:rgba(221,91,0,.18);
  --page:#191919; --surface:#242424; --border:#3A3A3A; --border-strong:#4A4A4A;
  --text:#EDECE9; --muted:#9B968F; --muted-2:#6E6A64;
  --ok:#2ECC58; --ok-tint:rgba(46,204,88,.16); --err:#FF6B6E; --err-tint:rgba(255,107,110,.14);
  --warn:#E0983C; --warn-tint:rgba(224,152,60,.16);
  --blue-active:#62AEF0; --danger-active:#FF8A8D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Inter",system-ui,sans-serif;background:var(--page);color:var(--text);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button{font-family:inherit}

/* Topbar */
.topbar{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
  border-bottom:3px solid var(--orange);padding:13px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:inherit}
.brand img{height:32px;width:auto;flex:none;display:none}
.brand .brand-logo-light{display:block}
html[data-theme="dark"] .brand .brand-logo-light{display:none}
html[data-theme="dark"] .brand .brand-logo-dark{display:block}
.brand .t{font-weight:600;font-size:17px}
.brand .t small{display:block;font-weight:400;font-size:12px;color:#9FB2C9}
.btn{font-family:inherit;font-size:13px;font-weight:600;border:none;border-radius:9px;
  padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--orange);color:var(--navy)}
.btn-primary:hover{background:#ff8a2a}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.2)}
.btn-theme{background:rgba(255,255,255,.12);color:#fff;width:34px;justify-content:center;padding:8px}
.btn-theme:hover{background:rgba(255,255,255,.2)}

/* Controls */
.controls{position:sticky;top:63px;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--page);padding:4px;border-radius:11px}
.tab{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;
  color:var(--muted);padding:7px 15px;border-radius:8px;cursor:pointer;transition:.15s}
.tab.active{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm)}
select,.sel{font-family:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:9px;padding:7px 10px;cursor:pointer}
select:focus{outline:none;border-color:var(--blue)}
.search{position:relative}
.search input{font-family:inherit;font-size:14px;width:200px;border:1px solid var(--border-strong);
  border-radius:9px;padding:8px 12px 8px 32px;color:var(--text);background:var(--surface)}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.spacer{flex:1}

/* Resumen */
main{padding:16px 22px 60px}
.summary{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow-sm)}
.sum-card .sv{font-size:22px;font-weight:700;line-height:1.1}
.sum-card .sl{font-size:11.5px;color:var(--muted);margin-top:3px}
.sum-card.err .sv{color:var(--err)}
.sum-card.warn .sv{color:var(--warn)}
.sum-card.ok .sv{color:var(--ok)}

.notice{background:var(--warn-tint);border:1px solid #EBCF94;color:#7A551A;border-radius:11px;
  padding:11px 15px;margin-bottom:16px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.notice.err{background:var(--err-tint);border-color:#F0B6B7;color:#8A2C2E}
.notice button{margin-left:auto;flex:none}
html[data-theme="dark"] .notice{color:#F0C089}
html[data-theme="dark"] .notice.err{color:#FF8A8D}

/* Leyenda */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* Acordeón por grupo (sucursal o fuerza) */
.acc{background:var(--surface);border:1px solid var(--border);border-radius:13px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.acc-head{width:100%;background:none;border:none;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:11px;padding:14px 18px;text-align:left}
.acc-head:hover{background:var(--blue-tint)}
.acc .chev{display:flex;color:var(--muted-2);transition:transform .2s;flex:none}
.acc.open .chev{transform:rotate(90deg);color:var(--blue)}
.acc-title{font-size:15.5px;font-weight:700;letter-spacing:.2px;color:var(--text)}
.acc-head .badge{font-size:11px;font-weight:600;background:var(--blue-tint-2);color:var(--blue);padding:2px 9px;border-radius:7px;white-space:nowrap}
.acc-head .badge.err{background:var(--err-tint);color:var(--err)}
.acc-line{flex:1;height:1px;background:var(--border)}
.acc-body{padding:2px 18px 16px;display:none}
.acc.open .acc-body{display:block}
.subhead{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.subhead .ln{flex:1;height:1px;background:var(--border)}

/* Timeline (Gantt) — ancho fijo (más grande que la pantalla) adentro de un contenedor con scroll
   horizontal propio, en vez de achicar los 12 meses por porcentaje para que "entren" — así los
   días se pueden leer y hay dónde desplazarse. La columna de nombre queda fija (sticky) al scrollear. */
.tl-scroll{overflow-x:auto;border-radius:10px}
.tl{position:relative;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-width:1900px}
.tl-months{position:relative;height:26px;background:var(--page);border-bottom:1px solid var(--border);margin-left:200px}
.tl-months span{position:absolute;top:0;height:100%;display:flex;align-items:center;padding-left:5px;
  font-size:10.5px;font-weight:700;color:var(--muted);border-left:1px solid var(--border);white-space:nowrap}
.tl-months span:hover{background:var(--blue-tint);color:var(--blue)}
.tl-gridlines{position:absolute;top:26px;bottom:0;left:200px;right:0;pointer-events:none}
.tl-gridlines i{position:absolute;top:0;bottom:0;width:1px;background:var(--border)}
.tl-row{display:flex;align-items:center;min-height:38px;border-bottom:1px solid var(--border);position:relative}
.tl-row:last-child{border-bottom:none}
.tl-row:hover{background:var(--blue-tint)}
.tl-row:hover .tl-label{background:var(--blue-tint)}
.tl-label{width:200px;flex:none;padding:6px 10px;font-size:12.5px;overflow:hidden;
  position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--border)}
.tl-label .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-label .rl{font-size:10.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;flex:1;height:32px;margin:3px 0}
.tl-bar{position:absolute;top:2px;height:24px;border-radius:6px;color:#fff;font-size:10.5px;font-weight:600;
  display:flex;align-items:center;padding:0 7px;white-space:nowrap;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.25);min-width:6px;transition:filter .1s}
.tl-bar:hover{filter:brightness(1.08)}
.tl-bar.conflict{outline:2px solid var(--err);outline-offset:1px;box-shadow:0 0 0 1px var(--err),0 1px 3px rgba(0,0,0,.3)}
.tl-bar.revisar{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 6px,#B8850C 6px,#B8850C 12px)}
.tl-today{position:absolute;top:26px;bottom:0;width:2px;background:var(--orange);z-index:2}
.tl-empty{padding:16px;color:var(--muted-2);font-size:13px;font-style:italic}

/* Pendientes de asignar */
.pending-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:7px;background:var(--page)}
.pending-row .nm{font-weight:600;font-size:13px;flex:1}
.pending-row select{font-size:12.5px;padding:5px 8px}

/* Modales */
.modal-bg{position:fixed;inset:0;background:rgba(15,27,45,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:min(720px,96vw);max-height:90vh;
  display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,27,45,.35);overflow:hidden}
.modal.wide{width:min(1040px,97vw)}
.modal-head{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex:none}
.modal-head h2{margin:0;font-size:16.5px;font-weight:700;flex:1}
.modal-head .x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}

<script>
/* ═══════════════════════════ Utilidades base ═══════════════════════════ */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Saca acentos y puntuación (los planos reales de RRHH traen cosas como "TUC. INT." o "ENCARG./ DEPOSITO")
// para que matcheen igual contra los alias sin puntos.
const norm=s=>(s==null?"":String(s)).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[./\\]/g," ").replace(/\s+/g," ").trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(msg,isErr){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(isErr?" err":""); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),3200); }

/* ───────── Motor de fechas ─────────
   Regla de negocio: los períodos duran 15 días corridos y solo pueden ARRANCAR
   un lunes. Si ese lunes es feriado, el inicio efectivo corre al próximo día
   hábil (no domingo, no feriado) — puede correr más de un día si hay feriados
   consecutivos. El fin siempre es inicio_efectivo + 14 días corridos. */
function pad2(n){return String(n).padStart(2,"0");}
function isoDe(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function dDe(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d);}
function addDias(iso,n){const d=dDe(iso);d.setDate(d.getDate()+n);return isoDe(d);}
function diaSemana(iso){return dDe(iso).getDay();} // 0=domingo..6=sábado
function esLunes(iso){return diaSemana(iso)===1;}
function ddmmyyyy(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return `${d}/${m}/${y}`;}
function ddmm(iso){if(!iso)return "";const [,m,d]=iso.split("-");return `${d}/${m}`;}
function esFeriado(iso){return state.feriados.some(f=>f.fecha===iso);}
function nombreFeriado(iso){const f=state.feriados.find(f=>f.fecha===iso);return f?f.nombre:"";}
function siguienteHabil(iso){
  let d=iso;
  while(esFeriado(d)||diaSemana(d)===0) d=addDias(d,1);
  return d;
}
// A partir del lunes elegido, calcula {inicioEfectivo, fin, corrido}
function calcularPeriodo(lunesISO){
  const efectivo=siguienteHabil(lunesISO);
  return { inicioSolicitado:lunesISO, inicioEfectivo:efectivo, fin:addDias(efectivo,14), corrido:efectivo!==lunesISO };
}
function solapan(aIni,aFin,bIni,bFin){ return aIni<=bFin && bIni<=aFin; }
const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

/* ═══════════════════════════ Estado ═══════════════════════════ */
const state = {
  roster:[],       // {id,legajo,nombre,sucursal,fuerza,activo}
  periodos:[],     // {id,personaId,inicioSolicitado,inicioEfectivo,fin,origen,estado,notas,creadoEn,creadoPor,actualizadoEn,actualizadoPor}
  feriados:FERIADOS_SEED.slice(),
  reglas:{ defaultMax:1, maxPorFuerza:{}, excluyentes:[] }, // maxPorFuerza key: "Sucursal|Fuerza" -> N
  log:[],          // {ts,usuario,accion,detalle}
  vista:"sucursal", coberturaModo:"porSucursal", filtroSucursal:"", anio:new Date().getFullYear(), query:"", ocultarStaff:false,
  abiertos:{},     // key de acordeón -> bool
  _gruposActuales:{}, // key de acordeón -> {personas,nombreGrupo} del último render (ver abrirDetalleMes)
};
const HOY=isoDe(new Date());

function usuarioActual(){
  let u=localStorage.getItem("vacUsuario");
  if(!u){ u=(prompt("¿Cómo te llamás? (queda registrado en el historial de cambios)")||"").trim()||"Sin nombre"; localStorage.setItem("vacUsuario",u); }
  return u;
}
// automatico=true: para acciones que corre el sistema solo (ej. sync silenciosa al abrir la página) —
// nunca debe interrumpir con el prompt() de "¿Cómo te llamás?" bloqueando una carga sin que nadie clickeó nada.
function registrar(accion,detalle,automatico){
  const usuario = automatico ? (localStorage.getItem("vacUsuario")||"Sistema (auto)") : usuarioActual();
  state.log.unshift({ts:new Date().toISOString(),usuario,accion,detalle});
  guardarEstado();
}

/* ═══════════════════════════ Persistencia ═══════════════════════════ */
const LS_KEY="vacacionesEstado";
let guardarTimer=null;
function guardarEstado(){
  localStorage.setItem(LS_KEY, JSON.stringify({roster:state.roster,periodos:state.periodos,feriados:state.feriados,reglas:state.reglas,log:state.log}));
  if(!CONFIG.APPSSCRIPT_URL) return;
  clearTimeout(guardarTimer);
  guardarTimer=setTimeout(async ()=>{
    try{
      await fetch(CONFIG.APPSSCRIPT_URL,{method:"POST",body:JSON.stringify({
        key:CONFIG.EDIT_KEY, roster:state.roster, periodos:state.periodos, feriados:state.feriados, reglas:state.reglas, log:state.log
      })});
    }catch(e){ toast("No se pudo guardar en el servidor: "+e.message,true); }
  },500);
}
async function cargarEstado(){
  if(CONFIG.APPSSCRIPT_URL){
    try{
      const r=await fetch(CONFIG.APPSSCRIPT_URL+"?accion=leer",{cache:"no-store"});
      const d=await r.json();
      if(d && !d.error && d.roster){
        state.roster=d.roster||[]; state.periodos=d.periodos||[]; state.feriados=d.feriados&&d.feriados.length?d.feriados:FERIADOS_SEED.slice();
        state.reglas=d.reglas||state.reglas; state.log=d.log||[];
        return;
      }
    }catch(e){ /* sigue con localStorage */ }
  }
  const raw=localStorage.getItem(LS_KEY);
  if(raw){
    try{
      const d=JSON.parse(raw);
      state.roster=d.roster||[]; state.periodos=d.periodos||[]; state.feriados=(d.feriados&&d.feriados.length)?d.feriados:FERIADOS_SEED.slice();
      state.reglas=d.reglas||state.reglas; state.log=d.log||[];
    }catch(e){}
  }
}

/* ═══════════════════════════ Roster: helpers ═══════════════════════════ */
function personaById(id){ return state.roster.find(p=>p.id===id); }
function personaNombre(id){ const p=personaById(id); return p?p.nombre:"(persona eliminada)"; }
function resolverAlias(valor,dict,lista){
  const n=norm(valor);
  if(dict[n]) return dict[n];
  const directo=lista.find(x=>norm(x)===n);
  return directo||"";
}
function buscarPersonaPorNombre(nombre){
  const n=norm(nombre);
  return state.roster.find(p=>norm(p.nombre)===n) ||
         state.roster.find(p=>norm(p.nombre).includes(n)||n.includes(norm(p.nombre)));
}

/* ═══════════════════════════ Sincronización directa con nomina-produccion.html ═══════════════════════════
   nomina-produccion.html persiste su nómina completa (allRecs) en NominaBackend.gs. En vez de pedir que
   se re-cargue el mismo excel acá, si CONFIG.NOMINA_URL apunta a ese mismo backend, la traemos directo.
   Forma de cada registro (ver buildFromRaw() en nomina-produccion.html): {areaKey,areaName,legajo,apellido,
   nombre,cat,alta,ingreso,tarea,tipodven,activo} — "cat" ya usa las mismas 11 categorías que FUERZAS acá,
   así que no hace falta mapearlas (solo la sucursal, vía SUCURSAL_ALIAS/areaName). */
// Upsert compartido: recibe records con la forma de nomina-produccion.html (buildFromRaw()) — vengan de
// su backend en vivo (NominaBackend.gs ?accion=leer) o de su backup estático en GitHub (nomina-backup.json)
// — y los mergea al roster acá. Match por legajo si existe, si no por nombre normalizado.
function aplicarRecsNomina(recs){
  let nuevos=0, actualizados=0;
  recs.forEach(rec=>{
    const nombre=`${rec.apellido||""} ${rec.nombre||""}`.trim(); if(!nombre) return;
    const legajo=rec.legajo!=null?String(rec.legajo):"";
    const sucursal=resolverAlias(rec.areaName||rec.areaKey,SUCURSAL_ALIAS,SUCURSALES)||rec.areaName||"";
    const fuerza=FUERZAS.includes(rec.cat)?rec.cat:(resolverAlias(rec.cat,FUERZA_ALIAS,FUERZAS)||rec.cat||"");
    const activo=rec.activo!==false;
    let p = (legajo && state.roster.find(x=>x.legajo===legajo)) || buscarPersonaPorNombre(nombre);
    if(p){
      const cambio = p.nombre!==nombre||p.sucursal!==sucursal||p.fuerza!==fuerza||p.legajo!==legajo||p.activo!==activo;
      p.nombre=nombre; p.sucursal=sucursal; p.fuerza=fuerza; p.legajo=legajo; p.activo=activo;
      if(cambio) actualizados++;
    }else{
      state.roster.push({id:uid(),legajo,nombre,sucursal,fuerza,activo});
      nuevos++;
    }
  });
  return {nuevos,actualizados};
}
async function sincronizarNomina(manual){
  if(!CONFIG.NOMINA_URL){
    if(manual) toast("Falta pegar CONFIG.NOMINA_URL (la misma URL de nomina-produccion.html) arriba del archivo",true);
    return;
  }
  try{
    const r=await fetch(CONFIG.NOMINA_URL+"?accion=leer",{cache:"no-store"});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    if(!d.recs || !d.recs.length){ if(manual) toast("El backend de nómina todavía no tiene datos guardados",true); return; }
    const {nuevos,actualizados}=aplicarRecsNomina(d.recs);
    if(nuevos||actualizados){
      registrar("sync_nomina",`Sincronizado en vivo desde NominaBackend.gs: ${nuevos} nuevas, ${actualizados} actualizadas`,!manual);
      renderAll();
    }
    if(manual) toast(nuevos||actualizados ? `Nómina sincronizada: ${nuevos} nuevas, ${actualizados} actualizadas` : "Nómina ya estaba al día");
  }catch(e){
    if(manual) toast("No se pudo sincronizar la nómina: "+e.message,true);
  }
}
$("#btnSyncNomina").addEventListener("click",()=>sincronizarNomina(true));

// Backup estático (nomina-backup.json, en la raíz del repo, publicado por GitHub Pages) — lo sube
// nomina-produccion.html con su botón "Backup a GitHub". Más simple/rápido que el backend en vivo
// (fetch directo, sin cold-start de Apps Script) pero solo tan fresco como el último push manual.
async function cargarBackupNominaGithub(manual){
  try{
    const r=await fetch("nomina-backup.json",{cache:"no-store"});
    if(!r.ok){ if(manual) toast("Todavía no existe nomina-backup.json en el repo — subilo desde nomina-produccion.html",true); return; }
    const d=await r.json();
    if(!d.recs || !d.recs.length){ if(manual) toast("El backup de GitHub está vacío",true); return; }
    const {nuevos,actualizados}=aplicarRecsNomina(d.recs);
    if(nuevos||actualizados){
      registrar("backup_nomina_github",`Backup de GitHub (${d.exportado?ddmmyyyy(d.exportado.slice(0,10)):"?"}): ${nuevos} nuevas, ${actualizados} actualizadas`,!manual);
      renderAll();
    }
    if(manual) toast(nuevos||actualizados ? `Backup cargado: ${nuevos} nuevas, ${actualizados} actualizadas` : "Nómina ya estaba al día con el backup");
  }catch(e){
    if(manual) toast("No se pudo leer nomina-backup.json: "+e.message,true);
  }
}
$("#btnBackupNomina").addEventListener("click",()=>cargarBackupNominaGithub(true));

/* ═══════════════════════════ Import: lectura de archivo → filas crudas (excel o pdf) ═══════════════════════════
   Los planos reales de RRHH vienen a veces en .xlsx, a veces en .pdf (export de una tabla ancha, a veces
   partida en varias páginas). Ambos caminos terminan en el mismo formato — array de filas, cada fila un
   array de celdas — para reusar el mismo reconocimiento de columnas sin duplicar lógica. */
function findCol(headers,names){
  const H=headers.map(h=>norm(h));
  for(const n of names){ const i=H.indexOf(norm(n)); if(i>=0) return i; }
  return -1;
}
// Fallback para PDFs donde nombre y tarea llegaron pegados en la misma celda (columnas mal separadas
// por posición) — si la celda de tarea vino vacía, se intenta arrancar un puesto conocido del final
// del texto de nombre. No hace nada si no reconoce ninguno (deja el texto tal cual llegó).
const TAREA_PATRONES=["ADMINIST\\.?\\s*DE\\s*AREA","ENCARG\\.?\\s*/?\\s*DEPOSITO","GERENTE\\s*DE\\s*AREA",
  "LIDER\\s*COMERCIAL","LIDER\\s*OPERATIVO","MAESTRANZA","MAEST\\.?\\s*ESPECIAL","OFICIAL\\s*DE\\s*CREDITO",
  "SUPERVISOR","VENDEDOR\\s*COBRADOR","VENDEDOR\\s*REDES\\s*JR","VENDEDOR\\s*REDES","VENDEDOR\\s*JUNIOR",
  "VENDEDOR\\s*DE\\s*SHOW\\s*R\\w*","VENDEDOR\\s*SENIOR","VENDEDOR\\s*CRM","LIDER\\s*POR\\s*REDES","LIDER\\s*REDES","LIDER\\s*CRM"];
const TAREA_REGEX=new RegExp("("+TAREA_PATRONES.join("|")+")\\s*$","i");
function separarNombreDeTarea(texto){
  const m=(texto||"").match(TAREA_REGEX);
  if(!m) return {nombre:(texto||"").trim(), tarea:""};
  return {nombre:texto.slice(0,m.index).trim(), tarea:m[0].trim()};
}
function extraerFilasXLSX(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true,cellDates:true}));
      }catch(err){ reject(err); }
    };
    reader.onerror=()=>reject(new Error("No se pudo leer el archivo"));
    reader.readAsArrayBuffer(file);
  });
}
/* Reconstruye filas/celdas de un PDF a partir de la posición (x,y) de cada fragmento de texto — un PDF no
   tiene "celdas" reales, así que se agrupa por Y (misma fila) y se corta en columna nueva cuando el hueco
   horizontal entre dos fragmentos es grande. Si la tabla venía tan ancha que se imprimió partida en varias
   páginas (mismas filas, más columnas en la página siguiente — visto en un plano real de RRHH), se detecta
   porque esa página tiene la MISMA cantidad de filas que la primera y se pegan lado a lado en vez de
   agregarse como filas nuevas. Es una heurística por posición, no un parser real de tablas — por eso todo
   lo importado que no cae lunes queda marcado "revisar" en vez de aceptarse a ciegas (ver más abajo). */
async function extraerFilasPDF(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const paginas=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    const items=content.items.filter(it=>it.str && it.str.trim());
    if(!items.length) continue;
    const porY=[];
    items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      let grupo=porY.find(g=>Math.abs(g.y-y)<=3);
      if(!grupo){ grupo={y,items:[]}; porY.push(grupo); }
      grupo.items.push(it);
    });
    porY.sort((a,b)=>b.y-a.y); // en PDF, Y crece hacia arriba de la página
    porY.forEach(g=>g.items.sort((a,b)=>a.transform[4]-b.transform[4]));
    if(!porY.length) continue;
    // pdf.js ya entrega un "item" de texto por cada tramo que el PDF escribió por separado — en una
    // tabla real eso coincide con una celda cada uno (confirmado contra un plano real: "GUSTAVO ADOLFO"
    // y "ADMINIST. DE AREA" ya llegan como dos ítems distintos, no hay que re-pegarlos por cercanía).
    // Lo que SÍ hay que resolver: si una celda viene vacía (ej. "obs." sin dato en esa fila), no hay
    // ítem para esa columna y todo lo siguiente corre una posición — desalinea la fila entera contra el
    // header. Por eso cada ítem de las filas de datos se ancla a la columna del header cuyo arranque en
    // X le quede más cerca por la izquierda (no al orden secuencial), y las columnas sin ítem quedan "".
    const headerX=porY[0].items.map(it=>it.transform[4]);
    // El texto de datos suele arrancar unos px a la izquierda del label del header (padding/fuente
    // distinta) — la tolerancia de anclaje se calcula como fracción del espacio MÍNIMO entre columnas
    // vecinas (no un valor fijo), así cubre ese corrimiento sin llegar a invadir la columna anterior.
    const gaps=headerX.slice(1).map((x,i)=>x-headerX[i]).filter(g=>g>0);
    const tol=gaps.length?Math.max(6,Math.min(...gaps)*0.3):6;
    const filas=porY.map((g,i)=>{
      if(i===0) return g.items.map(it=>it.str.trim());
      const celdas=new Array(headerX.length).fill("");
      g.items.forEach(it=>{
        const x=it.transform[4];
        let col=0;
        for(let c=0;c<headerX.length;c++){ if(x>=headerX[c]-tol) col=c; else break; }
        celdas[col]=celdas[col]?celdas[col]+" "+it.str:it.str;
      });
      return celdas;
    });
    paginas.push(filas);
  }
  if(!paginas.length) throw new Error("Ese PDF no tiene texto seleccionable (parece ser una imagen/captura escaneada) — no lo puedo leer automáticamente. Convertilo a Excel o pasame un PDF exportado directo de la planilla (con texto real, no una foto/captura).");
  let filas=paginas[0].slice();
  for(let p=1;p<paginas.length;p++){
    const pageRows=paginas[p];
    if(pageRows.length===filas.length){
      for(let i=0;i<filas.length;i++) filas[i]=filas[i].concat(pageRows[i]||[]);
    }else{
      pageRows.forEach(r=>filas.push(r));
    }
  }
  return filas;
}
function extraerFilasDeArchivo(file){
  return file.name.toLowerCase().endsWith(".pdf") ? extraerFilasPDF(file) : extraerFilasXLSX(file);
}
// Excel a veces entrega la fecha como serial numérico en vez de Date (según cómo esté formateada la celda
// de origen) — 25569 = días entre el epoch de Excel (1899-12-30) y el epoch de JS (1970-01-01).
function excelFechaAISO(v){
  if(v==null||v==="") return "";
  if(v instanceof Date) return isoDe(v);
  if(typeof v==="number" && v>59){ return isoDe(new Date(Math.round((v-25569)*86400*1000))); }
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let [,d,mo,y]=m; if(y.length===2) y="20"+y; return `${y}-${pad2(+mo)}-${pad2(+d)}`; }
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){ const [,y,mo,d]=m; return `${y}-${pad2(+mo)}-${pad2(+d)}`; }
  return "";
}
// Algunos planos reales no traen una fecha de inicio sola sino un RANGO en texto libre en esa misma
// celda ("18/01 AL 13/02", "04 AL 23/01" sin mes, "07 AL 19/12/26", a veces sin espacio "01/02AL 13/02",
// y a veces ni siquiera es una fecha: "PREGUNTAR A COMERCIAL"). anioArchivo sale del nombre del archivo
// (ej. "...2027.xlsx" → 2027) y se usa para completar el año cuando falta: visto en los datos reales,
// diciembre cae en el año ANTERIOR al del archivo y el resto de los meses en el año del archivo (temporada
// dic-nov: "21/12/26 AL 02/01/27" en un archivo "...2027.xlsx").
function inferirAnioRango(mes,anioArchivo){ return mes===12?anioArchivo-1:anioArchivo; }
function parseParteFechaRango(txt){
  const m=(txt||"").trim().match(/^(\d{1,2})(?:[\/\-.](\d{1,2}))?(?:[\/\-.](\d{2,4}))?$/);
  if(!m) return null;
  const dia=+m[1], mes=m[2]?+m[2]:null;
  let anio=m[3]?+m[3]:null;
  if(anio!=null && anio<100) anio+=2000;
  if(dia<1||dia>31||(mes!=null&&(mes<1||mes>12))) return null;
  return {dia,mes,anio};
}
function parseRangoFechas(texto,anioArchivo){
  if(!texto) return null;
  // "AL" como palabra suelta — no debe matchear dentro de "COMERCIAL", sí debe matchear pegado a
  // dígitos sin espacio ("01/02AL 13/02", visto en un archivo real).
  const partes=texto.split(/(?<![A-Za-zÁ-ÚÑá-úñ])AL(?![A-Za-zÁ-ÚÑá-úñ])/i);
  if(partes.length!==2) return null;
  const pIni=parseParteFechaRango(partes[0]), pFin=parseParteFechaRango(partes[1]);
  if(!pIni||!pFin) return null;
  let mesIni=pIni.mes, mesFin=pFin.mes;
  if(mesIni==null && mesFin!=null) mesIni=mesFin;
  if(mesFin==null && mesIni!=null) mesFin=mesIni;
  if(mesIni==null||mesFin==null) return null; // ningún lado tiene mes explícito, no se puede inferir nada
  let anioIni=pIni.anio!=null?pIni.anio:inferirAnioRango(mesIni,anioArchivo);
  const anioFin=pFin.anio!=null?pFin.anio:inferirAnioRango(mesFin,anioArchivo);
  const iso=(a,m,d)=>`${a}-${pad2(m)}-${pad2(d)}`;
  let inicioISO=iso(anioIni,mesIni,pIni.dia);
  const finISO=iso(anioFin,mesFin,pFin.dia);
  // Si el mes "prestado" de fin deja el inicio DESPUÉS del fin (ej. "21 AL 02/01": día 21 sin mes
  // propio, tomar el mes de fin (enero) da 21/01 > 02/01) es porque en realidad cruza de mes/año —
  // el mes real de inicio es el anterior al de fin, no el mismo.
  if(pIni.mes==null && inicioISO>finISO){
    let m2=mesIni-1, a2=anioIni;
    if(m2<1){ m2=12; a2--; }
    anioIni=pIni.anio!=null?pIni.anio:inferirAnioRango(m2,anioArchivo);
    inicioISO=iso(anioIni,m2,pIni.dia);
  }
  return {inicioISO,finISO};
}
// "pte." en los planos reales a veces es un número solo, a veces "7 p/julio" (días + nota de cuándo).
function parsePte(v){
  if(v==null||v==="") return {dias:null,nota:""};
  const s=String(v).trim();
  const m=s.match(/^(\d+)\s*(.*)$/);
  return m ? {dias:+m[1], nota:m[2].trim()} : {dias:null, nota:s};
}

/* ═══════════════════════════ Import: nómina (excel/pdf manual, fallback si no hay NOMINA_URL) ═══════════════════════════ */
$("#btnCargarNomina").onclick=()=>$("#fileNomina").click();
$("#fileNomina").onchange=async function(ev){
  const file=ev.target.files[0]; if(!file) return;
  try{
    const rows=await extraerFilasDeArchivo(file);
    if(!rows.length){ toast("El archivo está vacío o no pude leer ninguna fila",true); return; }
    const headers=rows[0];
    const ci={
      legajo:findCol(headers,["Nro Vend.","Nro Vend","Legajo","Nro. Vendedor"]),
      nombre:findCol(headers,["Vendedor","Nombre","Apellido y Nombre","Empleado","Colaborador"]),
      apellido:findCol(headers,["Apellido","Apellidos"]),
      nombreSolo:findCol(headers,["Nombres","Nombre/s"]),
      sucursal:findCol(headers,["Sucursal","Sede","Area","Área"]),
      fuerza:findCol(headers,["Fuerza de venta","Fuerza Venta","Fuerza","Categoria","Categoría","Tarea","Puesto"]),
    };
    // Si hay columna de apellido, siempre armamos el nombre apellido+nombre por separado — más
    // confiable que confiar en una sola columna "Nombre": vimos un archivo real donde la columna
    // se llamaba justo "nombre" pero solo traía el nombre de pila (el apellido estaba aparte), y
    // tratarla como nombre completo pisaba el apellido y generaba fusiones falsas por nombre corto
    // parecido (ver CLAUDE.md, bug real 2026-09-22). Si no hay "Nombres" propia, usamos la que haya
    // matcheado como "nombre" — en ese caso es, en la práctica, el nombre de pila igual.
    const nombreCombo = ci.apellido>=0;
    const colNombreParte = ci.nombreSolo>=0 ? ci.nombreSolo : ci.nombre;
    if(!nombreCombo && ci.nombre<0){ toast("No encontré la columna de nombre",true); return; }
    let nuevos=0, actualizados=0;
    rows.slice(1).forEach(r=>{
      let tareaSuelta="";
      let nombre;
      if(nombreCombo){
        let nombreSoloTxt=colNombreParte>=0?String(r[colNombreParte]||"").trim():"";
        if(ci.fuerza>=0 && !String(r[ci.fuerza]||"").trim()){
          const sep=separarNombreDeTarea(nombreSoloTxt);
          if(sep.tarea){ nombreSoloTxt=sep.nombre; tareaSuelta=sep.tarea; }
        }
        nombre=`${String(r[ci.apellido]||"").trim()} ${nombreSoloTxt}`.trim();
      }else{
        nombre=String(r[ci.nombre]||"").trim();
      }
      if(!nombre) return;
      const legajo=ci.legajo>=0?String(r[ci.legajo]||"").trim():"";
      const sucursal=ci.sucursal>=0?(resolverAlias(r[ci.sucursal],SUCURSAL_ALIAS,SUCURSALES)||String(r[ci.sucursal]||"").trim()):"";
      const fuerzaCelda=ci.fuerza>=0?String(r[ci.fuerza]||"").trim():"";
      const fuerza=resolverAlias(fuerzaCelda,FUERZA_ALIAS,FUERZAS)||fuerzaCelda||resolverAlias(tareaSuelta,FUERZA_ALIAS,FUERZAS)||tareaSuelta;
      let p=buscarPersonaPorNombre(nombre);
      if(p){
        if(sucursal) p.sucursal=sucursal;
        if(fuerza) p.fuerza=fuerza;
        if(legajo) p.legajo=legajo;
        p.activo=true;
        actualizados++;
      }else{
        state.roster.push({id:uid(),legajo,nombre,sucursal,fuerza,activo:true});
        nuevos++;
      }
    });
    registrar("import_nomina",`${file.name}: ${nuevos} personas nuevas, ${actualizados} actualizadas`);
    toast(`Nómina cargada: ${nuevos} nuevas, ${actualizados} actualizadas`);
    renderAll();
  }catch(err){ console.error(err); toast("No pude leer "+file.name+": "+err.message,true); }
  ev.target.value="";
};

/* ═══════════════════════════ Import: vacaciones (formato libre, excel o pdf) ═══════════════════════════ */
$("#btnCargarVacaciones").onclick=()=>$("#fileVacaciones").click();
$("#fileVacaciones").onchange=async function(ev){
  const file=ev.target.files[0]; if(!file) return;
  try{
    const rows=await extraerFilasDeArchivo(file);
    if(!rows.length){ toast("El archivo está vacío o no pude leer ninguna fila",true); return; }
    const headers=rows[0];
    const ci={
      nombre:findCol(headers,["Nombre","Apellido y Nombre","Vendedor","Colaborador","Empleado","Apellido Nombre"]),
      apellido:findCol(headers,["Apellido","Apellidos"]),
      nombreSolo:findCol(headers,["Nombres","Nombre/s"]),
      sucursal:findCol(headers,["Sucursal","Sede","Area","Área"]),
      fuerza:findCol(headers,["Fuerza de venta","Fuerza Venta","Fuerza","Categoria","Categoría","Tarea","Puesto"]),
      inicio:findCol(headers,["Fecha Inicio","Inicio","Desde","Fecha de Inicio","Inicio Vacaciones","Fecha inicio vacaciones"]),
      fin:findCol(headers,["Fecha Fin","Fin","Hasta","Fecha de Fin","Fin Vacaciones","Reintegro","Fecha Reintegro"]),
      diasVacac:findCol(headers,["Días Vacac.","Dias Vacac","Días Vaca","Dias Vaca","Días de Vacaciones","Dias de Vacaciones"]),
      pte:findCol(headers,["pte.","Pte","Pendiente","Días Pendientes","Dias Pendientes"]),
      notas:findCol(headers,["Notas","Observaciones","Comentario","obs.","Obs"]),
    };
    // Ver el comentario largo en el importador de nómina más arriba — misma regla: si hay columna
    // de apellido, siempre se arma apellido+nombre por separado en vez de confiar en una sola
    // columna "Nombre" que puede en realidad traer solo el nombre de pila.
    const nombreCombo = ci.apellido>=0;
    const colNombreParte = ci.nombreSolo>=0 ? ci.nombreSolo : ci.nombre;
    if((!nombreCombo && ci.nombre<0) || ci.inicio<0){
      toast("No reconocí las columnas de nombre y/o fecha de inicio en "+file.name,true); return;
    }
    // Año de referencia para completar fechas de rango sin año propio (ver parseRangoFechas) —
    // sale del nombre del archivo (ej. "VACACIONES LA RIOJA 2027.xlsx" → 2027), si no encuentra
    // uno de 4 dígitos ahí cae al año seleccionado en el calendario.
    const anioArchivoM=file.name.match(/(20\d{2})/);
    const anioArchivo=anioArchivoM?+anioArchivoM[1]:state.anio;
    let cargados=0, revisar=0, pendientesAsignar=0, sinFecha=0;
    const aniosImportados=[]; // para saltar solo el calendario al año donde cayó la mayoría de estos períodos
    rows.slice(1).forEach(r=>{
      let tareaSuelta=""; // "tarea" recuperada de una celda de nombre pegada, si hace falta (ver separarNombreDeTarea)
      let nombre;
      if(nombreCombo){
        let nombreSoloTxt=colNombreParte>=0?String(r[colNombreParte]||"").trim():"";
        if(ci.fuerza>=0 && !String(r[ci.fuerza]||"").trim()){
          const sep=separarNombreDeTarea(nombreSoloTxt);
          if(sep.tarea){ nombreSoloTxt=sep.nombre; tareaSuelta=sep.tarea; }
        }
        nombre=`${String(r[ci.apellido]||"").trim()} ${nombreSoloTxt}`.trim();
      }else{
        nombre=String(r[ci.nombre]||"").trim();
      }
      if(!nombre) return;
      // Persona primero, sin importar si la fecha se pudo leer — si no, igual queda cargada en
      // la nómina (antes se perdía la fila entera si la celda de fecha no era una fecha reconocible,
      // ej. "PREGUNTAR A COMERCIAL").
      let persona=buscarPersonaPorNombre(nombre);
      if(!persona){
        const sucursal=ci.sucursal>=0?(resolverAlias(r[ci.sucursal],SUCURSAL_ALIAS,SUCURSALES)||String(r[ci.sucursal]||"").trim()):"";
        const fuerzaCelda=ci.fuerza>=0?String(r[ci.fuerza]||"").trim():"";
        const fuerza=resolverAlias(fuerzaCelda,FUERZA_ALIAS,FUERZAS)||fuerzaCelda||resolverAlias(tareaSuelta,FUERZA_ALIAS,FUERZAS)||tareaSuelta;
        persona={id:uid(),legajo:"",nombre,sucursal,fuerza,activo:true};
        state.roster.push(persona);
        if(!sucursal||!fuerza) pendientesAsignar++;
      }
      // Algunos planos traen un rango completo ("18/01 AL 13/02") en la misma celda de inicio en vez
      // de una fecha sola — se prueba primero (una fecha simple nunca matchea el patrón "X AL Y").
      const celdaInicio=r[ci.inicio];
      const rango=typeof celdaInicio==="string"?parseRangoFechas(celdaInicio.trim(),anioArchivo):null;
      const inicioISO=rango?rango.inicioISO:excelFechaAISO(celdaInicio);
      if(!inicioISO){ sinFecha++; return; }
      const esLun=esLunes(inicioISO);
      const diasEntitlement=ci.diasVacac>=0 ? (parseInt(String(r[ci.diasVacac]).replace(/\D/g,""),10)||null) : null;
      const pte=ci.pte>=0 ? parsePte(r[ci.pte]) : {dias:null,nota:""};
      const obsTxt=ci.notas>=0?String(r[ci.notas]||"").trim():"";
      const notasFinal=[obsTxt, pte.nota?`Pendiente: ${pte.nota}`:""].filter(Boolean).join(" · ")
        || (esLun?"":"Fecha de inicio importada no cae lunes — revisar a mano.");
      let inicioEfectivo, fin;
      if(rango){
        // Rango explícito en el archivo — se usa tal cual, no se recalcula por feriado (el dato real
        // ya dice cuándo arranca y termina de verdad, aunque no sea lunes ni dure exactamente 15 días).
        inicioEfectivo=rango.inicioISO; fin=rango.finISO;
      }else{
        const finExcel=ci.fin>=0?excelFechaAISO(r[ci.fin]):"";
        const calc=calcularPeriodo(inicioISO);
        inicioEfectivo=esLun?calc.inicioEfectivo:inicioISO;
        fin=finExcel || (esLun?calc.fin:addDias(inicioISO,14));
      }
      const periodo={
        id:uid(), personaId:persona.id,
        inicioSolicitado:inicioISO, inicioEfectivo, fin,
        origen:"excel", estado: esLun?"ok":"revisar",
        diasEntitlement, diasPendientes: pte.dias,
        notas: notasFinal,
        creadoEn:new Date().toISOString(), creadoPor:usuarioActual(), actualizadoEn:null, actualizadoPor:null,
      };
      state.periodos.push(periodo);
      cargados++; if(!esLun) revisar++;
      aniosImportados.push(+inicioEfectivo.slice(0,4));
    });
    // El calendario solo muestra el año elegido en #anioSel (ver periodoVisibleEnAnio) — si el archivo
    // importado cae mayormente en otro año (ej. "VACACIONES ... 2027.xlsx" con la temporada dic-nov
    // arrancando en enero de 2027), los períodos quedaban cargados pero invisibles hasta que alguien
    // cambiara el selector a mano, sin ningún aviso de que eso hiciera falta. Ahora salta solo al año
    // donde cayó la mayoría de los períodos recién importados.
    let avisoAnio="";
    if(aniosImportados.length){
      const conteo={}; aniosImportados.forEach(a=>conteo[a]=(conteo[a]||0)+1);
      const anioPredom=+Object.keys(conteo).sort((a,b)=>conteo[b]-conteo[a])[0];
      if(anioPredom!==state.anio){
        state.anio=anioPredom;
        pintarSelectorAnio();
        avisoAnio=` · calendario cambiado a ${anioPredom} (la mayoría de estos períodos caen ahí)`;
      }
    }
    registrar("import_vacaciones",`${file.name}: ${cargados} períodos cargados (${revisar} a revisar, ${pendientesAsignar} personas nuevas sin sucursal/fuerza, ${sinFecha} sin fecha reconocible)`);
    toast(`Importado: ${cargados} períodos` + (revisar?` · ${revisar} a revisar (no arrancan lunes)`:"") + (pendientesAsignar?` · ${pendientesAsignar} personas sin sucursal/fuerza`:"") + (sinFecha?` · ${sinFecha} sin fecha reconocible`:"") + avisoAnio);
    renderAll();
  }catch(err){ console.error(err); toast("No pude leer "+file.name+": "+err.message,true); }
  ev.target.value="";
};

/* ═══════════════════════════ Motor de conflictos ═══════════════════════════ */
function maxPermitido(sucursal,fuerza){
  const k1=sucursal+"|"+fuerza;
  if(state.reglas.maxPorFuerza[k1]!=null) return state.reglas.maxPorFuerza[k1];
  const k2="_TODAS|"+fuerza;
  if(state.reglas.maxPorFuerza[k2]!=null) return state.reglas.maxPorFuerza[k2];
  return state.reglas.defaultMax;
}
function calcularConflictos(){
  const conflicto={}; // periodoId -> [{tipo,detalle}]
  const marcar=(id,tipo,detalle)=>{
    const arr=conflicto[id]=conflicto[id]||[];
    if(!arr.some(c=>c.tipo===tipo&&c.detalle===detalle)) arr.push({tipo,detalle});
  };
  // Sweep-line genérico: marca en conflicto a todos los períodos que en algún momento superan `max`
  // simultáneos dentro de la lista `periodos` dada — lo reusan tanto el máximo configurable por
  // sucursal+fuerza como las reglas fijas de grupos combinados (gerencial/staff/showroom/terreno).
  function sweepMax(periodos,max,tipo,detalle){
    if(!periodos.length||!max||max<1) return;
    const eventos=[];
    periodos.forEach(p=>{ eventos.push([p.inicioEfectivo,1,p]); eventos.push([addDias(p.fin,1),-1,p]); });
    eventos.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
    let activos=new Set();
    eventos.forEach(([,delta,p])=>{
      if(delta===1) activos.add(p);
      if(activos.size>max) activos.forEach(pp=>marcar(pp.id,tipo,detalle));
      if(delta===-1) activos.delete(p);
    });
  }

  // 1) máximo simultáneo por sucursal+fuerza (configurable en el modal "Reglas")
  const grupos={};
  state.periodos.forEach(p=>{
    const per=personaById(p.personaId); if(!per) return;
    const key=per.sucursal+"|"+per.fuerza;
    (grupos[key]=grupos[key]||[]).push(p);
  });
  Object.entries(grupos).forEach(([key,arr])=>{
    const [sucursal,fuerza]=key.split("|");
    const max=maxPermitido(sucursal,fuerza);
    sweepMax(arr,max,"max_fuerza",`Más de ${max} de "${fuerza}" en ${sucursal} coinciden en fechas`);
  });

  // 1b) reglas fijas de la empresa (ver constantes GRUPO_* más arriba, no configurables desde el panel)
  SUCURSALES.forEach(suc=>{
    const deLaSucursal=fza=>state.periodos.filter(p=>{ const pe=personaById(p.personaId); return pe&&pe.sucursal===suc&&fza.includes(pe.fuerza); });
    sweepMax(deLaSucursal(GRUPO_GERENCIAL_EXCLUSIVO),1,"grupo_gerencial",
      `${suc}: Gerente de Área, Líder Comercial y Líder Operativo tienen que salir de vacaciones de uno en uno`);
    if(!SUCURSALES_STAFF_SIN_AGRUPAR.has(suc)){
      sweepMax(deLaSucursal(GRUPO_STAFF_AREA),1,"grupo_staff",
        `${suc}: el staff de área (administrativo/depósito/crédito/supervisor/maestranza) tiene que salir de uno en uno`);
    }
    sweepMax(deLaSucursal(GRUPO_TERRENO_COBRADOR),1,"grupo_terreno",
      `${suc}: vendedores de terreno y cobradores se cubren entre ellos, uno por período`);
  });
  sweepMax(state.periodos.filter(p=>{ const pe=personaById(p.personaId); return pe&&pe.fuerza==="Vendedor de Showroom"; }),1,"showroom_global",
    `Vendedor de Showroom: solo puede haber uno de vacaciones a la vez en toda la empresa`);

  // 1c) no fraccionar el período si el entitlement anual es ≤14 días (dato importado de un plano de RRHH)
  const periodosPorPersona={};
  state.periodos.forEach(p=>{ (periodosPorPersona[p.personaId]=periodosPorPersona[p.personaId]||[]).push(p); });
  Object.values(periodosPorPersona).forEach(arr=>{
    if(arr.length<2) return;
    if(!arr.some(p=>p.diasEntitlement!=null&&p.diasEntitlement<=14)) return;
    arr.forEach(p=>marcar(p.id,"fraccionado",`Tiene ≤14 días de vacaciones al año — no puede fraccionar el período en varias veces`));
  });

  // 2) pares/grupos excluyentes explícitos
  (state.reglas.excluyentes||[]).forEach(grupo=>{
    for(let i=0;i<grupo.length;i++) for(let j=i+1;j<grupo.length;j++){
      const pidA=grupo[i], pidB=grupo[j];
      state.periodos.filter(p=>p.personaId===pidA).forEach(pa=>{
        state.periodos.filter(p=>p.personaId===pidB).forEach(pb=>{
          if(solapan(pa.inicioEfectivo,pa.fin,pb.inicioEfectivo,pb.fin)){
            marcar(pa.id,"excluyente",`No puede coincidir con ${personaNombre(pidB)}`);
            marcar(pb.id,"excluyente",`No puede coincidir con ${personaNombre(pidA)}`);
          }
        });
      });
    }
  });
  return conflicto;
}

/* ═══════════════════════════ Timeline (Gantt) ═══════════════════════════ */
function diasDelAnio(anio){ return (new Date(anio,11,31)-new Date(anio,0,1))/86400000+1; }
function offsetPct(iso,anio){
  const d=dDe(iso); const inicioAnio=new Date(anio,0,1);
  const total=diasDelAnio(anio);
  let dias=(d-inicioAnio)/86400000;
  dias=Math.max(0,Math.min(total,dias));
  return dias/total*100;
}
function timelineHeaderHtml(anio,key){
  const total=diasDelAnio(anio);
  let acc=0, spans=[];
  for(let m=0;m<12;m++){
    const dim=new Date(anio,m+1,0).getDate();
    spans.push(`<span data-mes="${m}" data-acckey="${esc(key)}" style="left:${(acc/total*100).toFixed(3)}%;width:${(dim/total*100).toFixed(3)}%;cursor:pointer" title="Ver el desglose de ${MESES[m]}">${MESES[m]}</span>`);
    acc+=dim;
  }
  return spans.join("");
}
function timelineGridlinesHtml(anio){
  const total=diasDelAnio(anio);
  let acc=0, out=[];
  for(let m=0;m<12;m++){
    out.push(`<i style="left:${(acc/total*100).toFixed(3)}%"></i>`);
    acc+=new Date(anio,m+1,0).getDate();
  }
  return out.join("");
}
function periodoVisibleEnAnio(p,anio){
  const ini=anio+"-01-01", fin=anio+"-12-31";
  return solapan(p.inicioEfectivo,p.fin,ini,fin);
}
function barraHtml(p,anio,conflictos,colorOverride){
  const total=diasDelAnio(anio);
  const anioIni=anio+"-01-01", anioFin=anio+"-12-31";
  const ini=p.inicioEfectivo<anioIni?anioIni:p.inicioEfectivo;
  const fin=p.fin>anioFin?anioFin:p.fin;
  const left=offsetPct(ini,anio), right=offsetPct(addDias(fin,1),anio);
  const width=Math.max(right-left,0.4);
  const per=personaById(p.personaId);
  const color=colorOverride||FUERZA_COLOR[per?per.fuerza:""]||FUERZA_COLOR._DEFAULT;
  const conf=conflictos[p.id];
  const cls="tl-bar"+(conf?" conflict":"")+(p.estado==="revisar"?" revisar":"");
  const entitlement = p.diasEntitlement!=null ? ` · ${p.diasEntitlement} días/año${p.diasPendientes!=null?` (${p.diasPendientes} pendientes)`:""}` : "";
  const titulo=`${ddmmyyyy(p.inicioEfectivo)} → ${ddmmyyyy(p.fin)}`+(p.corrido?" (corrido por feriado)":"")+(p.finAjustado?" (fin ajustado a mano)":"")+entitlement+(p.notas?" · "+p.notas:"")+(conf?" · ⚠ "+conf.map(c=>c.detalle).join(" / "):"");
  return `<div class="${cls}" style="left:${left.toFixed(3)}%;width:${width.toFixed(3)}%;background:${color}" data-id="${p.id}" title="${esc(titulo)}">${esc(titulo)}</div>`;
}

function accKey(prefix,name){ return prefix+"|"+name; }
function renderTimelineGrupo(prefix, nombreGrupo, personas, anio, conflictos, colorFn){
  const key=accKey(prefix,nombreGrupo);
  // Guardado para que el click en un mes (ver abrirDetalleMes) sepa de qué grupo de personas se trata
  // sin tener que volver a recorrer roster/vista — se resetea entero al arrancar cada renderVista().
  state._gruposActuales[key]={personas,nombreGrupo};
  const abierto=state.abiertos[key]!==false; // abierto por defecto
  const periodosGrupo=[];
  personas.forEach(per=>state.periodos.forEach(p=>{ if(p.personaId===per.id) periodosGrupo.push(p); }));
  const enConflicto=periodosGrupo.filter(p=>conflictos[p.id]).length;
  const activosHoy=periodosGrupo.filter(p=>p.inicioEfectivo<=HOY&&HOY<=p.fin).length;

  const filas = personas.map(per=>{
    const propios=state.periodos.filter(p=>p.personaId===per.id && periodoVisibleEnAnio(p,anio));
    const colorPer=colorFn?colorFn(per):null;
    const barras=propios.map(p=>barraHtml(p,anio,conflictos,colorPer)).join("");
    return `<div class="tl-row" data-persona="${esc(per.id)}">
      <div class="tl-label"><div class="nm">${esc(per.nombre)}</div><div class="rl">${esc(prefix==="suc"?per.fuerza:per.sucursal)||"—"}</div></div>
      <div class="tl-track">${barras}</div>
    </div>`;
  }).join("");

  return `<div class="acc ${abierto?"open":""}" data-acckey="${esc(key)}">
    <button class="acc-head">
      <span class="chev">▶</span>
      <span class="acc-title">${esc(nombreGrupo)}</span>
      <span class="acc-line"></span>
      <span class="badge">${personas.length} persona${personas.length===1?"":"s"} · ${activosHoy} hoy</span>
      ${enConflicto?`<span class="badge err">⚠ ${enConflicto} en conflicto</span>`:""}
    </button>
    <div class="acc-body">
      <div class="tl-scroll"><div class="tl">
        <div class="tl-months">${timelineHeaderHtml(anio,key)}</div>
        <div class="tl-gridlines">${timelineGridlinesHtml(anio)}</div>
        ${personas.length?filas:'<div class="tl-empty">Nadie cargado en este grupo todavía.</div>'}
        ${anio===new Date().getFullYear()?`<div class="tl-today" style="left:${offsetPct(HOY,anio).toFixed(3)}%"></div>`:""}
      </div></div>
    </div>
  </div>`;
}

function renderVista(){
  state._gruposActuales={};
  const conflictos=calcularConflictos();
  const q=norm(state.query);
  const rosterActivo=state.roster.filter(p=>p.activo!==false && (!q||norm(p.nombre).includes(q))
    && (!state.ocultarStaff || FUERZAS_PRODUCCION.has(p.fuerza)));
  const view=$("#view");

  $("#chkOcultarStaffWrap").style.display=state.vista==="cobertura"?"none":"flex";
  if(state.vista==="sucursal"){
    $("#filtroSucursal").style.display="none";
    $("#irASucursal").style.display="";
    $("#coberturaSubtabs").style.display="none";
    const html=SUCURSALES.map(suc=>{
      const personas=rosterActivo.filter(p=>p.sucursal===suc).sort((a,b)=>a.nombre.localeCompare(b.nombre));
      if(!personas.length && q) return "";
      return renderTimelineGrupo("suc",suc,personas,state.anio,conflictos);
    }).join("");
    const sinAsignar=rosterActivo.filter(p=>!SUCURSALES.includes(p.sucursal));
    view.innerHTML=html + (sinAsignar.length?renderTimelineGrupo("suc","Sin sucursal asignada",sinAsignar,state.anio,conflictos):"");
  }else if(state.vista==="cobertura"){
    // Gerente de Área + Líder Comercial de cada sucursal, uno al lado del otro — se cubren entre
    // sus vacaciones, así que acá importa verlos juntos y no mezclados con el resto del personal.
    // Dos sub-vistas (coberturaModo, botones #coberturaSubtabs): "porSucursal" (un bloque por sucursal,
    // como antes) o "agrupado" (un solo bloque con todos, mismo color para el par Gerente+Líder de una
    // misma sucursal — mismo patrón visual que "Por fuerza de venta" pero sin separar por rol).
    $("#filtroSucursal").style.display="none";
    $("#irASucursal").style.display=state.coberturaModo==="porSucursal"?"":"none";
    $("#coberturaSubtabs").style.display="";
    const ordenRol={"Gerente de Área":0,"Líder Comercial":1};
    if(state.coberturaModo==="agrupado"){
      const personas=rosterActivo.filter(p=>p.fuerza in ordenRol)
        .sort((a,b)=>a.sucursal.localeCompare(b.sucursal)||ordenRol[a.fuerza]-ordenRol[b.fuerza]||a.nombre.localeCompare(b.nombre));
      view.innerHTML=renderTimelineGrupo("cobAll","Gerentes y Líderes — todas las sucursales",personas,state.anio,conflictos,per=>colorDeSucursal(per.sucursal));
    }else{
      const html=SUCURSALES.map(suc=>{
        const personas=rosterActivo.filter(p=>p.sucursal===suc && p.fuerza in ordenRol)
          .sort((a,b)=>ordenRol[a.fuerza]-ordenRol[b.fuerza]||a.nombre.localeCompare(b.nombre));
        if(!personas.length && q) return "";
        return renderTimelineGrupo("cob",suc,personas,state.anio,conflictos);
      }).join("");
      view.innerHTML=html;
    }
  }else{
    $("#filtroSucursal").style.display="";
    $("#irASucursal").style.display="none";
    $("#coberturaSubtabs").style.display="none";
    const filtro=state.filtroSucursal;
    const listaFuerzas=state.ocultarStaff?FUERZAS.filter(f=>FUERZAS_PRODUCCION.has(f)):FUERZAS;
    const html=listaFuerzas.map(f=>{
      let personas=rosterActivo.filter(p=>p.fuerza===f);
      if(filtro) personas=personas.filter(p=>p.sucursal===filtro);
      personas.sort((a,b)=>a.sucursal.localeCompare(b.sucursal)||a.nombre.localeCompare(b.nombre));
      if(!personas.length && q) return "";
      return renderTimelineGrupo("fza",f,personas,state.anio,conflictos);
    }).join("");
    view.innerHTML=html;
  }
  $$(".acc-head").forEach(h=>h.addEventListener("click",()=>{
    const acc=h.closest(".acc"); const key=acc.dataset.acckey;
    state.abiertos[key]=!acc.classList.contains("open");
    acc.classList.toggle("open");
  }));
  $$(".tl-bar").forEach(b=>b.addEventListener("click",()=>abrirEdicionPeriodo(b.dataset.id)));
  renderLegend();
  $$(".tl-months span").forEach(sp=>sp.addEventListener("click",e=>{
    e.stopPropagation(); // no abrir/cerrar el acordeón al clickear el mes
    abrirDetalleMes(sp.dataset.acckey,+sp.dataset.mes);
  }));
}

/* ═══════════════════════════ Modal: detalle de un mes (día por día) ═══════════════════════════
   Pedido del usuario: clickeando un mes del timeline, ver los días de ese mes y quién tiene vacaciones
   ahí (con su fecha real de inicio/fin, aunque el período empiece o termine en otro mes), pudiendo
   elegir una o varias personas y marcarlas en el calendario cada una con su propio color. */
const DM_PALETA=["#0075DE","#DD5B00","#1AAE39","#8E44AD","#D7484B","#B7950B","#16A085","#6C3483","#5C6B7E","#C0392B","#3396F0","#E67E22"];
function abrirDetalleMes(key,mes){
  const grupo=state._gruposActuales[key]; if(!grupo) return;
  const anio=state.anio;
  const inicioMes=`${anio}-${pad2(mes+1)}-01`;
  const dim=new Date(anio,mes+1,0).getDate();
  const finMes=`${anio}-${pad2(mes+1)}-${pad2(dim)}`;
  // Un período puede haber arrancado o terminar en otro mes (ej. cruza fin de mes/año) — se lista igual
  // acá si SOLAPA este mes, mostrando su rango real completo (no recortado al mes).
  const filas=[];
  grupo.personas.forEach(per=>state.periodos.forEach(p=>{
    if(p.personaId===per.id && solapan(p.inicioEfectivo,p.fin,inicioMes,finMes)) filas.push({per,p});
  }));
  filas.sort((a,b)=>a.p.inicioEfectivo.localeCompare(b.p.inicioEfectivo));
  filas.forEach((f,i)=>{ f.color=DM_PALETA[i%DM_PALETA.length]; });
  const seleccionados=new Set(filas.map(f=>f.p.id)); // todas marcadas de entrada, se puede desmarcar

  function pintarCalendario(){
    const offsetLunes=(dDe(inicioMes).getDay()+6)%7; // semana arranca lunes, igual que el resto del panel
    const celdas=[];
    for(let i=0;i<offsetLunes;i++) celdas.push('<div class="dm-day dm-empty"></div>');
    for(let d=1;d<=dim;d++){
      const iso=`${anio}-${pad2(mes+1)}-${pad2(d)}`;
      const activos=filas.filter(f=>seleccionados.has(f.p.id) && f.p.inicioEfectivo<=iso && iso<=f.p.fin);
      const dots=activos.map(f=>`<i style="background:${f.color}" title="${esc(f.per.nombre)}"></i>`).join("");
      celdas.push(`<div class="dm-day${iso===HOY?" dm-hoy":""}"><div class="dm-daynum">${d}</div><div class="dm-dots">${dots}</div></div>`);
    }
    $("#dmCalGrid").innerHTML=celdas.join("");
  }
  function filaListaHtml(f){
    return `<label class="dm-persona" style="border-left:4px solid ${f.color}">
      <input type="checkbox" data-pid="${esc(f.p.id)}" checked>
      <span class="dm-nm">${esc(f.per.nombre)}</span>
      <span class="dm-suc">${esc(key.startsWith("suc|")||key.startsWith("cob|")?(f.per.fuerza||""):(f.per.sucursal||""))}</span>
      <span class="dm-rango">${ddmmyyyy(f.p.inicioEfectivo)} → ${ddmmyyyy(f.p.fin)}</span>
    </label>`;
  }

  abrirModal(`
    <div class="modal-head"><h2>${MESES[mes]} ${anio} · ${esc(grupo.nombreGrupo)}</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      ${filas.length?`
      <div class="dm-wrap">
        <div class="dm-cal">
          <div class="dm-caldow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
          <div class="dm-calgrid" id="dmCalGrid"></div>
        </div>
        <div class="dm-lista" id="dmLista">${filas.map(filaListaHtml).join("")}</div>
      </div>`:`<div class="empty">Nadie de ${esc(grupo.nombreGrupo)} tiene vacaciones cargadas en ${MESES[mes]} de ${anio}.</div>`}
    </div>
    <div class="modal-actions">
      ${filas.length?`<button class="btn" style="background:var(--page);color:var(--text);border:1px solid var(--border-strong)" id="dmTodos">Marcar todos</button>
      <button class="btn" style="background:var(--page);color:var(--text);border:1px solid var(--border-strong)" id="dmNinguno">Desmarcar todos</button>`:""}
      <button class="btn btn-primary" data-close>Cerrar</button>
    </div>`, true);

  if(!filas.length) return;
  pintarCalendario();
  $("#dmLista").querySelectorAll("input[type=checkbox]").forEach(cb=>cb.addEventListener("change",e=>{
    const pid=e.target.dataset.pid;
    if(e.target.checked) seleccionados.add(pid); else seleccionados.delete(pid);
    e.target.closest(".dm-persona").classList.toggle("off",!e.target.checked);
    pintarCalendario();
  }));
  $("#dmTodos").addEventListener("click",()=>{
    filas.forEach(f=>seleccionados.add(f.p.id));
    $("#dmLista").querySelectorAll("input[type=checkbox]").forEach(cb=>{ cb.checked=true; cb.closest(".dm-persona").classList.remove("off"); });
    pintarCalendario();
  });
  $("#dmNinguno").addEventListener("click",()=>{
    seleccionados.clear();
    $("#dmLista").querySelectorAll("input[type=checkbox]").forEach(cb=>{ cb.checked=false; cb.closest(".dm-persona").classList.add("off"); });
    pintarCalendario();
  });
}

function renderResumen(){
  const conflictos=calcularConflictos();
  const activos=state.periodos.filter(p=>p.inicioEfectivo<=HOY&&HOY<=p.fin);
  const revisar=state.periodos.filter(p=>p.estado==="revisar");
  const sinAsignar=state.roster.filter(p=>p.activo!==false && (!p.sucursal||!p.fuerza));
  $("#summary").innerHTML=`
    <div class="sum-card"><div class="sv">${state.roster.filter(p=>p.activo!==false).length}</div><div class="sl">Personas en nómina</div></div>
    <div class="sum-card"><div class="sv">${state.periodos.length}</div><div class="sl">Períodos cargados</div></div>
    <div class="sum-card ok"><div class="sv">${activos.length}</div><div class="sl">De vacaciones hoy</div></div>
    <div class="sum-card ${Object.keys(conflictos).length?"err":""}"><div class="sv">${Object.keys(conflictos).length}</div><div class="sl">Períodos en conflicto</div></div>
    <div class="sum-card ${revisar.length?"warn":""}"><div class="sv">${revisar.length}</div><div class="sl">A revisar (no arranca lunes)</div></div>
    <div class="sum-card ${sinAsignar.length?"warn":""}"><div class="sv">${sinAsignar.length}</div><div class="sl">Sin sucursal/fuerza</div></div>`;
  renderLegend();
}
// Separada de renderResumen porque depende de vista/coberturaModo (cambia solo, ver renderVista) —
// si viviera adentro de renderResumen quedaría desactualizada al cambiar de sub-vista sin pasar por ahí.
function renderLegend(){
  // En "Gerente + Líder > Todo agrupado" las barras se colorean por sucursal (ver colorDeSucursal),
  // no por fuerza — la leyenda tiene que reflejar eso o los colores no dirían nada.
  const fuerzasLegend=state.ocultarStaff?FUERZAS.filter(f=>FUERZAS_PRODUCCION.has(f)):FUERZAS;
  const leyendaBase = (state.vista==="cobertura"&&state.coberturaModo==="agrupado")
    ? SUCURSALES.map(s=>`<span><i style="background:${colorDeSucursal(s)}"></i>${esc(s)}</span>`).join("")
    : fuerzasLegend.map(f=>`<span><i style="background:${FUERZA_COLOR[f]}"></i>${esc(f)}</span>`).join("");
  $("#legend").innerHTML = leyendaBase
    + `<span><i style="background:var(--warn);background-image:repeating-linear-gradient(45deg,var(--warn),var(--warn) 3px,#B8850C 3px,#B8850C 6px)"></i>A revisar</span>
       <span><i style="border:2px solid var(--err);background:transparent"></i>Conflicto</span>`;
}

function renderPendientes(){
  const pend=state.roster.filter(p=>p.activo!==false && (!p.sucursal||!p.fuerza));
  const box=$("#pendientes");
  if(!pend.length){ box.innerHTML=""; return; }
  box.innerHTML=`<div class="notice">⚠️ <div><b>${pend.length} persona${pend.length===1?"":"s"} sin sucursal y/o fuerza de venta asignada</b> — se creó al importar un excel de vacaciones que no la traía en la nómina. Completá los datos para que aparezca en el calendario y en las reglas de solape.
    <div style="margin-top:8px">${pend.map(p=>`
      <div class="pending-row">
        <span class="nm">${esc(p.nombre)}</span>
        <select data-id="${esc(p.id)}" data-campo="sucursal"><option value="">Sucursal…</option>${SUCURSALES.map(s=>`<option value="${esc(s)}" ${p.sucursal===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
        <select data-id="${esc(p.id)}" data-campo="fuerza"><option value="">Fuerza de venta…</option>${FUERZAS.map(f=>`<option value="${esc(f)}" ${p.fuerza===f?"selected":""}>${esc(f)}</option>`).join("")}</select>
      </div>`).join("")}</div>
    </div>`;
  box.querySelectorAll("select").forEach(s=>s.addEventListener("change",()=>{
    const per=personaById(s.dataset.id); if(!per) return;
    const antes=per[s.dataset.campo];
    per[s.dataset.campo]=s.value;
    registrar("editar_persona",`${per.nombre}: ${s.dataset.campo} "${antes||"—"}" → "${s.value||"—"}"`);
    renderAll();
  }));
}

function renderAll(){ renderResumen(); renderPendientes(); renderVista(); guardarEstado(); }

/* ═══════════════════════════ Controles superiores ═══════════════════════════ */
// ".tab" ahora también lo usan los sub-botones de #coberturaSubtabs (Por sucursal/Todo agrupado)
// dentro de "Gerente + Líder" — cada grupo de tabs se activa/desactiva solo entre sus hermanos
// (data-vista para las pestañas principales, data-modo para las de cobertura), para no pisarse.
$$(".tabs > .tab").forEach(t=>{
  if(t.dataset.vista) t.addEventListener("click",()=>{
    $$(".tabs > .tab").forEach(x=>{ if(x.dataset.vista) x.classList.remove("active"); }); t.classList.add("active");
    state.vista=t.dataset.vista; renderVista();
  });
  if(t.dataset.modo) t.addEventListener("click",()=>{
    $$("#coberturaSubtabs .tab").forEach(x=>x.classList.remove("active")); t.classList.add("active");
    state.coberturaModo=t.dataset.modo; renderVista();
  });
});
$("#search").addEventListener("input",e=>{ state.query=e.target.value; renderVista(); });
$("#filtroSucursal").addEventListener("change",e=>{ state.filtroSucursal=e.target.value; renderVista(); });
$("#chkOcultarStaff").addEventListener("change",e=>{ state.ocultarStaff=e.target.checked; renderVista(); });
$("#irASucursal").innerHTML += SUCURSALES.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")+`<option value="Sin sucursal asignada">Sin sucursal asignada</option>`;
// "Por sucursal"/"Gerente + Líder" muestran un acordeón por cada una de las 11 sucursales — para ver
// una puntual había que ir colapsando el resto a mano, una por una. Este selector cierra todas las
// demás y abre + hace scroll directo a la elegida (mismo state.abiertos que ya usa el click manual).
$("#irASucursal").addEventListener("change",e=>{
  const suc=e.target.value; if(!suc) return;
  const prefix=state.vista==="cobertura"?"cob":"suc";
  [...SUCURSALES,"Sin sucursal asignada"].forEach(s=>{ state.abiertos[accKey(prefix,s)]=(s===suc); });
  renderVista();
  const acc=$(`.acc[data-acckey="${accKey(prefix,suc)}"]`);
  if(acc) acc.scrollIntoView({behavior:"smooth",block:"start"});
  e.target.value="";
});
function pintarSelectorAnio(){
  const sel=$("#anioSel"); const actual=new Date().getFullYear();
  // El año predominante de un import (ver fileVacaciones.onchange) puede caer fuera del rango
  // "normal" actual-1..actual+2 (ej. un archivo cargado con mucha anticipación) — se agrega a mano
  // para que el selector siempre pueda mostrar el año que se acaba de importar.
  const anios=new Set([actual-1,actual,actual+1,actual+2,state.anio]);
  sel.innerHTML=[...anios].sort((a,b)=>a-b).map(a=>`<option value="${a}" ${a===state.anio?"selected":""}>${a}</option>`).join("");
}
$("#anioSel").addEventListener("change",e=>{ state.anio=+e.target.value; renderVista(); });
$("#filtroSucursal").innerHTML += SUCURSALES.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");

function aplicarTema(t){

  $("#btnTheme").textContent = t==="dark"?"☀️":"🌙";
