/* ═══════════════════════════ Modal: nuevo / editar período ═══════════════════════════ */
function formularioPeriodoHtml(p){
  const per=p?personaById(p.personaId):null;
  const opcionesPersonas=state.roster.filter(x=>x.activo!==false).sort((a,b)=>a.nombre.localeCompare(b.nombre))
    .map(x=>`<option value="${esc(x.id)}" ${per&&per.id===x.id?"selected":""}>${esc(x.nombre)} — ${esc(x.sucursal||"sin sucursal")}</option>`).join("");
  const lunes=p?p.inicioSolicitado:"";
  return `
  <div class="modal-head"><h2>${p?"Editar":"Nueva"} vacación</h2><button class="x" data-close>&times;</button></div>
  <div class="modal-body">
    <div class="field"><label>Persona</label>
      <select id="fPersona">${opcionesPersonas || '<option value="">— no hay nómina cargada —</option>'}</select>
    </div>
    <div class="row2">
      <div class="field"><label>Lunes de inicio</label>
        <input type="date" id="fInicio" value="${lunes}">
        <div class="hint" id="fInicioHint"></div>
      </div>
      <div class="field"><label>Fecha de fin</label>
        <input type="date" id="fFin" value="${p?p.fin:""}">
        <div class="hint" id="fFinHint">Se calcula sola (15 días corridos) — cambiala acá si el período real termina otro día.</div>
      </div>
    </div>
    <div class="field"><label>Notas (opcional)</label><textarea id="fNotas">${esc(p?p.notas:"")}</textarea></div>
    ${p&&p.diasEntitlement!=null?`<div class="field hint">Entitlement anual importado: <b>${p.diasEntitlement} días</b>${p.diasPendientes!=null?` · <b>${p.diasPendientes}</b> pendientes de tomar`:""}</div>`:""}
    <input type="hidden" id="fId" value="${p?p.id:""}">
  </div>
  <div class="modal-actions">
    ${p?'<button class="btn" style="background:var(--err-tint);color:var(--err)" id="fEliminar">Eliminar</button>':""}
    <button class="btn" style="background:var(--page);color:var(--text);border:1px solid var(--border-strong)" data-close>Cancelar</button>
    <button class="btn btn-primary" id="fGuardar">Guardar</button>
  </div>`;
}
function actualizarHintFecha(){
  const iso=$("#fInicio").value; const hint=$("#fInicioHint");
  if(!iso){ hint.textContent=""; return; }
  if(!esLunes(iso)){ hint.className="hint err"; hint.textContent="Esa fecha no es lunes — elegí un lunes."; return; }
  const calc=calcularPeriodo(iso);
  if(calc.corrido){
    hint.className="hint err";
    hint.textContent=`${ddmmyyyy(iso)} es feriado (${nombreFeriado(iso)||"día no laborable"}) → arranca el ${ddmmyyyy(calc.inicioEfectivo)}.`;
  }else{
    hint.className="hint ok";
    hint.textContent=`Arranca el ${ddmmyyyy(calc.inicioEfectivo)}.`;
  }
}
function abrirNuevoPeriodo(){
  if(!state.roster.length){ toast("Cargá primero la nómina (botón 'Cargar nómina')",true); return; }
  abrirModal(formularioPeriodoHtml(null));
  wireFormularioPeriodo();
}
function abrirEdicionPeriodo(id){
  const p=state.periodos.find(x=>x.id===id); if(!p) return;
  abrirModal(formularioPeriodoHtml(p));
  wireFormularioPeriodo();
}
function wireFormularioPeriodo(){
  const idExistente=$("#fId").value;
  const pExistente=idExistente?state.periodos.find(x=>x.id===idExistente):null;
  // Mientras el usuario no haya tocado "Fecha de fin" a mano, cambiar el inicio recalcula el fin
  // sugerido (15 días corridos) — apenas la toca, dejamos de pisarla para no perder el ajuste manual.
  let finTocado=!!(pExistente&&pExistente.finAjustado);
  $("#fFin").addEventListener("input",()=>{ finTocado=true; });
  $("#fInicio").addEventListener("input",()=>{
    actualizarHintFecha();
    const iso=$("#fInicio").value;
    if(!finTocado&&iso&&esLunes(iso)) $("#fFin").value=calcularPeriodo(iso).fin;
  });
  actualizarHintFecha();
  const del=$("#fEliminar");
  if(del) del.addEventListener("click",()=>{
    const id=$("#fId").value; const p=state.periodos.find(x=>x.id===id);
    if(!p) return;
    if(!confirm("¿Eliminar este período de vacaciones?")) return;
    state.periodos=state.periodos.filter(x=>x.id!==id);
    registrar("eliminar_periodo",`${personaNombre(p.personaId)}: ${ddmmyyyy(p.inicioEfectivo)} → ${ddmmyyyy(p.fin)}`);
    cerrarModal(); renderAll(); toast("Período eliminado");
  });
  $("#fGuardar").addEventListener("click",()=>{
    const id=$("#fId").value;
    const personaId=$("#fPersona").value;
    const iso=$("#fInicio").value;
    const finInput=$("#fFin").value;
    const notas=$("#fNotas").value.trim();
    if(!personaId){ toast("Elegí una persona",true); return; }
    if(!iso || !esLunes(iso)){ toast("La fecha de inicio tiene que ser un lunes",true); return; }
    const calc=calcularPeriodo(iso);
    const fin=finInput||calc.fin;
    if(fin<calc.inicioEfectivo){ toast("La fecha de fin no puede ser anterior al inicio",true); return; }
    const finAjustado=fin!==calc.fin;
    if(id){
      const p=state.periodos.find(x=>x.id===id);
      const cambios=[];
      if(p.personaId!==personaId) cambios.push("persona");
      if(p.inicioSolicitado!==iso) cambios.push("fecha de inicio");
      if(p.fin!==fin) cambios.push("fecha de fin");
      p.personaId=personaId; p.inicioSolicitado=iso; p.inicioEfectivo=calc.inicioEfectivo; p.fin=fin; p.corrido=calc.corrido; p.finAjustado=finAjustado;
      p.estado="ok"; p.notas=notas; p.actualizadoEn=new Date().toISOString(); p.actualizadoPor=usuarioActual();
      registrar("editar_periodo",`${personaNombre(personaId)}: ${ddmmyyyy(p.inicioEfectivo)} → ${ddmmyyyy(p.fin)}${cambios.length?" ("+cambios.join(", ")+" modificado/s)":""}`);
      toast("Período actualizado");
    }else{
      const nuevo={id:uid(),personaId,inicioSolicitado:iso,inicioEfectivo:calc.inicioEfectivo,fin,corrido:calc.corrido,finAjustado,
        origen:"manual",estado:"ok",notas,creadoEn:new Date().toISOString(),creadoPor:usuarioActual(),actualizadoEn:null,actualizadoPor:null};
      state.periodos.push(nuevo);
      registrar("nuevo_periodo",`${personaNombre(personaId)}: ${ddmmyyyy(nuevo.inicioEfectivo)} → ${ddmmyyyy(nuevo.fin)}`);
      toast("Período cargado");
    }
    cerrarModal(); renderAll();
  });
}
$("#btnNuevoPeriodo").addEventListener("click",abrirNuevoPeriodo);
$("#btnBorrarTodasVac").addEventListener("click",()=>{
  const n=state.periodos.length;
  if(!n){ toast("No hay vacaciones cargadas"); return; }
  if(!confirm(`¿Borrar los ${n} período${n===1?"":"s"} de vacaciones cargados (de todas las sucursales)? La nómina no se toca. Esta acción no se puede deshacer.`)) return;
  state.periodos=[];
  registrar("borrar_todas_vacaciones",`${n} período${n===1?"":"s"} borrado${n===1?"":"s"}`);
  renderAll();
  toast(`${n} período${n===1?"":"s"} de vacaciones borrado${n===1?"":"s"}`);
});

/* ═══════════════════════════ Modal: Nómina (ver/editar roster) ═══════════════════════════ */
// Clave de agrupamiento por sucursal para el modal de Nómina — "__sin__" junta a quien no tiene
// una sucursal reconocida (SUCURSALES incluye ahora "CRM" como una más, ver más abajo).
function claveSucursalNomina(p){ return SUCURSALES.includes(p.sucursal) ? p.sucursal : "__sin__"; }
function idsDeGrupoNomina(key){
  const gente = key==="__sin__" ? state.roster.filter(p=>!SUCURSALES.includes(p.sucursal)) : state.roster.filter(p=>p.sucursal===key);
  return new Set(gente.map(p=>p.id));
}
function periodosDePersona(id){ return state.periodos.filter(p=>p.personaId===id).length; }

function abrirNomina(){
  const bySuc={}; SUCURSALES.forEach(s=>bySuc[s]=[]); bySuc.__sin__=[];
  state.roster.forEach(p=>bySuc[claveSucursalNomina(p)].push(p));
  Object.values(bySuc).forEach(arr=>arr.sort((a,b)=>a.nombre.localeCompare(b.nombre)));

  const resumenHtml=[...SUCURSALES.map(s=>[s,bySuc[s]]), ["Sin sucursal",bySuc.__sin__]]
    .filter(([,arr])=>arr.length)
    .map(([nombre,arr])=>`<span class="chip" style="background:var(--blue-tint);color:var(--blue)">${esc(nombre)}: <b>${arr.length}</b></span>`).join("");

  function filaPersona(p){
    const nPer=periodosDePersona(p.id);
    return `<tr data-id="${esc(p.id)}">
      <td>${esc(p.nombre)}${nPer?` <span style="color:var(--muted-2);font-size:11px">(${nPer} período${nPer===1?"":"s"})</span>`:""}</td>
      <td><select data-campo="sucursal"><option value="">—</option>${SUCURSALES.map(s=>`<option ${p.sucursal===s?"selected":""}>${esc(s)}</option>`).join("")}</select></td>
      <td><select data-campo="fuerza"><option value="">—</option>${FUERZAS.map(f=>`<option ${p.fuerza===f?"selected":""}>${esc(f)}</option>`).join("")}</select></td>
      <td>${esc(p.legajo||"")}</td>
      <td><label style="display:flex;align-items:center;gap:5px;font-size:12px"><input type="checkbox" data-campo="activo" ${p.activo!==false?"checked":""}> activo</label></td>
      <td style="white-space:nowrap">
        <button class="iconbtn" data-borrar-vac title="Borrar las vacaciones cargadas de esta persona" ${nPer?"":"disabled"}>🧹</button>
        <button class="iconbtn" data-eliminar title="Quitar de la nómina">🗑️</button>
      </td>
    </tr>`;
  }
  function grupoHtml(nombreGrupo,key,personas){
    if(!personas.length) return "";
    const nPeriodos=personas.reduce((s,p)=>s+periodosDePersona(p.id),0);
    return `<div class="subhead" style="margin-top:18px">
        <span>${esc(nombreGrupo)} · ${personas.length} persona${personas.length===1?"":"s"}</span>
        <span class="ln"></span>
        ${nPeriodos?`<button class="btn" data-borrar-vac-suc="${esc(key)}" style="background:var(--err-tint);color:var(--err);padding:4px 10px;font-size:11px;font-weight:600;text-transform:none;letter-spacing:0">🗑️ Vacaciones (${nPeriodos})</button>`:""}
      </div>
      <table class="simple"><thead><tr><th>Nombre</th><th>Sucursal</th><th>Fuerza de venta</th><th>Legajo</th><th>Estado</th><th></th></tr></thead>
      <tbody>${personas.map(filaPersona).join("")}</tbody></table>`;
  }
  const gruposHtml=SUCURSALES.map(s=>grupoHtml(s,s,bySuc[s])).join("")+grupoHtml("Sin sucursal asignada","__sin__",bySuc.__sin__);

  abrirModal(`
    <div class="modal-head"><h2>Nómina (${state.roster.length})</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      <p style="font-size:12.5px;color:var(--muted);margin-top:0">Se completa importando el excel de nómina (o sincronizando), y también podés corregir cualquier campo acá a mano.</p>
      ${resumenHtml?`<div style="display:flex;flex-wrap:wrap;gap:6px">${resumenHtml}</div>`:""}
      <div style="overflow:auto;max-height:52vh">${gruposHtml||'<div class="empty">Sin nómina cargada</div>'}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn" style="background:var(--page);color:var(--text);border:1px solid var(--border-strong)" id="btnAgregarPersona">+ Agregar persona a mano</button>
        <button class="btn" style="background:var(--err-tint);color:var(--err)" id="btnBorrarNomina" ${state.roster.length?"":"disabled"}>🗑️ Borrar toda la nómina</button>
      </div>
    </div>
    <div class="modal-actions"><button class="btn btn-primary" data-close>Cerrar</button></div>`, true);
  $("#modal").querySelectorAll("select,input[type=checkbox]").forEach(el=>el.addEventListener("change",e=>{
    const tr=e.target.closest("tr"); const per=personaById(tr.dataset.id); if(!per) return;
    const campo=e.target.dataset.campo;
    const valorAntes=per[campo];
    per[campo]= campo==="activo"?e.target.checked:e.target.value;
    registrar("editar_persona",`${per.nombre}: ${campo} "${valorAntes}" → "${per[campo]}"`);
    renderAll();
  }));
  $("#modal").querySelectorAll("[data-eliminar]").forEach(b=>b.addEventListener("click",e=>{
    const tr=e.target.closest("tr"); const per=personaById(tr.dataset.id); if(!per) return;
    if(!confirm(`¿Quitar a ${per.nombre} de la nómina? (sus períodos de vacaciones cargados se mantienen)`)) return;
    state.roster=state.roster.filter(x=>x.id!==per.id);
    registrar("eliminar_persona",per.nombre);
    cerrarModal(); abrirNomina(); renderAll();
  }));
  $("#modal").querySelectorAll("[data-borrar-vac]").forEach(b=>b.addEventListener("click",e=>{
    const tr=e.target.closest("tr"); const per=personaById(tr.dataset.id); if(!per) return;
    const n=periodosDePersona(per.id); if(!n) return;
    if(!confirm(`¿Borrar los ${n} período${n===1?"":"s"} de vacaciones de ${per.nombre}? Esta acción no se puede deshacer.`)) return;
    state.periodos=state.periodos.filter(p=>p.personaId!==per.id);
    registrar("borrar_vacaciones_persona",`${per.nombre}: ${n} período${n===1?"":"s"} borrado${n===1?"":"s"}`);
    cerrarModal(); abrirNomina(); renderAll();
    toast(`Vacaciones de ${per.nombre} borradas (${n})`);
  }));
  $("#modal").querySelectorAll("[data-borrar-vac-suc]").forEach(b=>b.addEventListener("click",e=>{
    const key=e.target.dataset.borrarVacSuc;
    const ids=idsDeGrupoNomina(key);
    const n=state.periodos.filter(p=>ids.has(p.personaId)).length; if(!n) return;
    const nombreGrupo=key==="__sin__"?"Sin sucursal asignada":key;
    if(!confirm(`¿Borrar los ${n} período${n===1?"":"s"} de vacaciones cargados en ${nombreGrupo}? Esta acción no se puede deshacer.`)) return;
    state.periodos=state.periodos.filter(p=>!ids.has(p.personaId));
    registrar("borrar_vacaciones_sucursal",`${nombreGrupo}: ${n} período${n===1?"":"s"} borrado${n===1?"":"s"}`);
    cerrarModal(); abrirNomina(); renderAll();
    toast(`Vacaciones de ${nombreGrupo} borradas (${n})`);
  }));
  $("#btnBorrarNomina").addEventListener("click",()=>{
    const n=state.roster.length;
    if(!n) return;
    if(!confirm(`¿Borrar toda la nómina (${n} personas)? Los períodos de vacaciones ya cargados NO se borran, pero van a quedar sin sucursal/fuerza asociada hasta que vuelvas a cargar o sincronizar la nómina. Esta acción no se puede deshacer.`)) return;
    state.roster=[];
    registrar("borrar_nomina",`Nómina completa borrada (${n} personas)`);
    cerrarModal(); abrirNomina(); renderAll();
    toast(`Nómina borrada (${n} personas)`);
  });
  $("#btnAgregarPersona").addEventListener("click",()=>{
    const nombre=prompt("Nombre completo:"); if(!nombre) return;
    state.roster.push({id:uid(),legajo:"",nombre:nombre.trim(),sucursal:"",fuerza:"",activo:true});
    registrar("nueva_persona",nombre.trim());
    cerrarModal(); abrirNomina(); renderAll();
  });
}
$("#btnNomina").addEventListener("click",abrirNomina);

/* ═══════════════════════════ Modal: Reglas de solape ═══════════════════════════ */
function abrirReglas(){
  const filasMax=SUCURSALES.map(suc=>FUERZAS.map(f=>{
    const key=suc+"|"+f; const v=state.reglas.maxPorFuerza[key];
    if(v==null) return "";
    return `<tr data-key="${esc(key)}"><td>${esc(suc)}</td><td>${esc(f)}</td><td><input type="number" min="0" value="${v}" style="width:70px"></td><td><button class="iconbtn" data-quitar>🗑️</button></td></tr>`;
  }).join("")).join("");
  const excluyentesHtml=(state.reglas.excluyentes||[]).map((grupo,i)=>`
    <div class="chip" style="background:var(--err-tint);color:var(--err)" data-grupo="${i}">
      ${grupo.map(pid=>esc(personaNombre(pid))).join(" ⇄ ")}
      <span class="rm" data-quitar-grupo="${i}">✕</span>
    </div>`).join("");
  abrirModal(`
    <div class="modal-head"><h2>Reglas de solapamiento</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      <div class="notice" style="margin-bottom:18px">📋 <div>
        <b>Reglas fijas de la empresa</b> (se aplican solas, no se editan desde acá):
        <ul style="margin:6px 0 0;padding-left:18px;line-height:1.6">
          <li>Gerente de Área, Líder Comercial y Líder Operativo de una misma sucursal: uno por período.</li>
          <li>Staff de área (Administrativo/Depósito/Crédito/Supervisor/Maestranza) de una misma sucursal: uno por período — excepto Tucumán Capital y Salta, donde cada puesto rota por separado.</li>
          <li>Vendedor de Showroom: uno por período en toda la empresa (no por sucursal).</li>
          <li>Vendedores de terreno (Senior/Junior) y Cobradores de una misma sucursal: se cubren entre ellos, uno por período.</li>
          <li>Vendedor Redes: sin regla fija, a criterio del gerente y del departamento comercial.</li>
          <li>Quien tenga ≤14 días de vacaciones al año no puede fraccionar el período en varias veces.</li>
        </ul>
      </div></div>
      <div class="field">
        <label>Máximo por defecto de personas de la misma fuerza de venta, de la misma sucursal, de vacaciones a la vez</label>
        <input type="number" id="rDefault" min="0" value="${state.reglas.defaultMax}" style="width:100px">
      </div>

      <div class="subhead">Excepciones por sucursal / fuerza de venta<span class="ln"></span></div>
      <table class="simple"><thead><tr><th>Sucursal</th><th>Fuerza</th><th>Máx.</th><th></th></tr></thead>
        <tbody id="tblMax">${filasMax||'<tr><td colspan="4" class="empty">Sin excepciones — se usa el máximo por defecto</td></tr>'}</tbody></table>
      <div class="row2" style="margin-top:10px">
        <select id="rSuc">${SUCURSALES.map(s=>`<option>${esc(s)}</option>`).join("")}</select>
        <select id="rFza">${FUERZAS.map(f=>`<option>${esc(f)}</option>`).join("")}</select>
      </div>
      <div class="row2" style="margin-top:8px;align-items:end">
        <div class="field" style="margin:0"><label>Máximo simultáneo</label><input type="number" id="rMax" min="0" value="1"></div>
        <button class="btn btn-primary" id="rAgregarMax">+ Agregar excepción</button>
      </div>

      <div class="subhead" style="margin-top:22px">Personas que nunca pueden coincidir<span class="ln"></span></div>
      <div id="excGrupos">${excluyentesHtml||'<div class="empty">Sin restricciones cargadas</div>'}</div>
      <div class="row2" style="margin-top:10px">
        <select id="excA">${state.roster.map(p=>`<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join("")}</select>
        <select id="excB">${state.roster.map(p=>`<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join("")}</select>
      </div>
      <button class="btn" style="background:var(--page);color:var(--text);border:1px solid var(--border-strong);margin-top:8px" id="excAgregar">+ Agregar restricción</button>
    </div>
    <div class="modal-actions"><button class="btn btn-primary" data-close>Cerrar</button></div>`, true);

  $("#rDefault").addEventListener("change",e=>{ state.reglas.defaultMax=+e.target.value||0; registrar("editar_reglas",`Máximo por defecto → ${state.reglas.defaultMax}`); renderAll(); });
  $("#rAgregarMax").addEventListener("click",()=>{
    const key=$("#rSuc").value+"|"+$("#rFza").value;
    state.reglas.maxPorFuerza[key]=+$("#rMax").value||0;
    registrar("editar_reglas",`Excepción ${key} → máx. ${state.reglas.maxPorFuerza[key]}`);
    cerrarModal(); abrirReglas(); renderAll();
  });
  $("#modal").querySelectorAll("#tblMax input").forEach(inp=>inp.addEventListener("change",e=>{
    const key=e.target.closest("tr").dataset.key; state.reglas.maxPorFuerza[key]=+e.target.value||0;
    registrar("editar_reglas",`Excepción ${key} → máx. ${state.reglas.maxPorFuerza[key]}`); renderAll();
  }));
  $("#modal").querySelectorAll("#tblMax [data-quitar]").forEach(b=>b.addEventListener("click",e=>{
    const key=e.target.closest("tr").dataset.key; delete state.reglas.maxPorFuerza[key];
    registrar("editar_reglas",`Excepción ${key} eliminada`);
    cerrarModal(); abrirReglas(); renderAll();
  }));
  $("#excAgregar").addEventListener("click",()=>{
    const a=$("#excA").value,b=$("#excB").value;
    if(!a||!b||a===b){ toast("Elegí dos personas distintas",true); return; }
    state.reglas.excluyentes=state.reglas.excluyentes||[];
    state.reglas.excluyentes.push([a,b]);
    registrar("editar_reglas",`Restricción: ${personaNombre(a)} ⇄ ${personaNombre(b)}`);
    cerrarModal(); abrirReglas(); renderAll();
  });
  $("#modal").querySelectorAll("[data-quitar-grupo]").forEach(b=>b.addEventListener("click",e=>{
    const i=+e.target.dataset.quitarGrupo;
    const g=state.reglas.excluyentes[i];
    state.reglas.excluyentes.splice(i,1);
    registrar("editar_reglas",`Restricción eliminada: ${g.map(personaNombre).join(" ⇄ ")}`);
    cerrarModal(); abrirReglas(); renderAll();
  }));
}
$("#btnReglas").addEventListener("click",abrirReglas);

/* ═══════════════════════════ Modal: Feriados ═══════════════════════════ */
function abrirFeriados(){
  const filas=state.feriados.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(f=>`
    <tr data-fecha="${esc(f.fecha)}"><td>${esc(ddmmyyyy(f.fecha))}</td><td>${esc(f.nombre)}</td><td><button class="iconbtn" data-quitar>🗑️</button></td></tr>`).join("");
  abrirModal(`
    <div class="modal-head"><h2>Feriados</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      <p style="font-size:12.5px;color:var(--muted);margin-top:0">Se usan para correr al próximo día hábil el inicio de una vacación cuando el lunes elegido es feriado. Los movibles/por decreto cambian cada año — revisalos vos.</p>
      <table class="simple"><thead><tr><th>Fecha</th><th>Nombre</th><th></th></tr></thead><tbody id="tblFer">${filas}</tbody></table>
      <div class="row2" style="margin-top:12px">
        <input type="date" id="ferFecha">
        <input type="text" id="ferNombre" placeholder="Nombre del feriado">
      </div>
      <button class="btn btn-primary" id="ferAgregar" style="margin-top:8px">+ Agregar feriado</button>
    </div>
    <div class="modal-actions"><button class="btn btn-primary" data-close>Cerrar</button></div>`);
  $("#ferAgregar").addEventListener("click",()=>{
    const fecha=$("#ferFecha").value, nombre=$("#ferNombre").value.trim();
    if(!fecha||!nombre){ toast("Completá fecha y nombre",true); return; }
    state.feriados.push({fecha,nombre});
    registrar("editar_feriados",`+ ${ddmmyyyy(fecha)} ${nombre}`);
    cerrarModal(); abrirFeriados(); renderAll();
  });
  $("#modal").querySelectorAll("[data-quitar]").forEach(b=>b.addEventListener("click",e=>{
    const fecha=e.target.closest("tr").dataset.fecha;
    const f=state.feriados.find(x=>x.fecha===fecha);
    state.feriados=state.feriados.filter(x=>x.fecha!==fecha);
    registrar("editar_feriados",`- ${ddmmyyyy(fecha)} ${f?f.nombre:""}`);
    cerrarModal(); abrirFeriados(); renderAll();
  }));
}
$("#btnFeriados").addEventListener("click",abrirFeriados);

/* ═══════════════════════════ Modal: Historial ═══════════════════════════ */
function abrirHistorial(){
  const filas=state.log.slice(0,300).map(l=>`
    <tr><td class="mono" style="white-space:nowrap">${esc(new Date(l.ts).toLocaleString("es-AR"))}</td><td>${esc(l.usuario)}</td><td>${esc(l.accion)}</td><td>${esc(l.detalle)}</td></tr>`).join("");
  abrirModal(`
    <div class="modal-head"><h2>Historial de cambios</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body"><div style="overflow:auto;max-height:65vh">
      <table class="simple"><thead><tr><th>Cuándo</th><th>Quién</th><th>Acción</th><th>Detalle</th></tr></thead>
      <tbody>${filas||'<tr><td colspan="4" class="empty">Sin cambios registrados todavía</td></tr>'}</tbody></table>
    </div></div>
    <div class="modal-actions"><button class="btn btn-primary" data-close>Cerrar</button></div>`, true);
}
$("#btnHistorial").addEventListener("click",abrirHistorial);

/* ═══════════════════════════ Arranque ═══════════════════════════ */
(async function init(){
  pintarSelectorAnio();
  await cargarEstado();
  renderAll();
  sincronizarNomina(false); // silenciosa: si hay novedades las trae solas y actualiza; si no hay URL, no hace nada
  cargarBackupNominaGithub(false); // idem con el backup estático — no pisa nada, solo hace upsert
})();
</script>
</body>
</html>
