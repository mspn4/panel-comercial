<style>
/* Paleta y tipografía: design-system/panel-comercial/MASTER.md (lectura de diseño Notion) */
:root{
  --ink:#000000; --ink2:#31302E; --muted:#615D59; --muted-2:#A39E98;
  --canvas:#FFFFFF; --page:#F6F5F4; --border:#E6E6E6; --border-strong:#C9C4BE;
  --text:#000000;
  --blue:#0075DE; --blue-active:#005BAB; --blue-tint:#E8F2FC; --blue-tint-2:#D6E9FA;
  --navy:#213183; --navy-active:#182666;
  --orange:#DD5B00; --orange-tint:#FBE7D9;
  --ok:#1AAE39; --ok-tint:#E6F7EA; --err:#D7484B; --warn:#C77B12; --err-tint:#FBE7E7;
  --radius-xs:4px; --radius-sm:5px; --radius-md:8px; --radius-lg:12px;
  --shadow:0 1px 1px rgba(0,0,0,.02),0 3px 8px rgba(0,0,0,.04);
  --shadow-hover:0 8px 24px rgba(0,0,0,.09);
  color-scheme:light;
}
/* Modo oscuro — solo el chrome propio (sidebar/modales/KB/Gerente Regional); cada app en el iframe tiene su propio CSS y no se ve afectada */
html[data-theme="dark"]{
  --ink:#EDECE9; --ink2:#C9C6C2; --muted:#9B968F; --muted-2:#6E6A64;
  --canvas:#242424; --page:#191919; --border:#3A3A3A; --border-strong:#4A4A4A;
  --text:#EDECE9;
  --blue:#3396F0; --blue-active:#1F7FD1; --blue-tint:rgba(51,150,240,.16); --blue-tint-2:rgba(51,150,240,.24);
  --navy:#2C42A8; --navy-active:#213183;
  --orange:#FF7A26; --orange-tint:rgba(221,91,0,.18);
  --ok:#2ECC58; --ok-tint:rgba(46,204,88,.15); --err:#FF6B6E; --warn:#E0983C; --err-tint:rgba(215,72,75,.15);
  --shadow:0 1px 1px rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.3);
  --shadow-hover:0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
html[data-theme="dark"] .editbar{color:#F3D9BC}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
.shell{display:flex;height:100vh;overflow:hidden}
body{font-family:"Inter",system-ui,sans-serif;background:var(--page);color:var(--text);
  -webkit-font-smoothing:antialiased;line-height:1.45}
button{font-family:inherit}

/* Sidebar izquierda (lista de apps) + panel central (iframe) */
.sidebar{width:280px;flex:none;background:var(--canvas);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:width .15s ease}
.sidebar.collapsed{width:64px}

.sidebar-brand{display:flex;align-items:center;gap:11px;padding:17px 18px;border-bottom:1px solid var(--border);flex:none}
.sidebar-brand .brand-logo-img{height:32px;width:auto;flex:none;display:none}
.sidebar-brand .brand-logo-light{display:block}
html[data-theme="dark"] .sidebar-brand .brand-logo-light{display:none}
html[data-theme="dark"] .sidebar-brand .brand-logo-dark{display:block}
.sidebar-brand .ttl{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.sidebar-brand .ttl b{font-weight:700;font-size:16px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-brand .ttl span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:normal;line-height:1.3;margin-top:2px}
.sidebar.collapsed .sidebar-brand .ttl{display:none}
.collapse-btn{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;padding:5px;
  border-radius:var(--radius-sm);flex:none;display:flex}
.collapse-btn:hover{background:var(--page);color:var(--text)}
.collapse-btn svg{transition:transform .15s}
.sidebar.collapsed .collapse-btn svg{transform:rotate(180deg)}
/* Colapsado: badge + botón no entran en una fila de 64px, se apilan centrados */
.sidebar.collapsed .sidebar-brand{flex-direction:column;gap:8px;padding:12px 6px}
.sidebar.collapsed .sidebar-brand .brand-logo-img{height:22px}
.sidebar.collapsed .collapse-btn{margin-left:0}

.sidebar-search{display:flex;align-items:center;gap:8px;margin:14px 14px 0;padding:8px 11px;
  background:var(--page);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--muted-2);flex:none;transition:border-color .12s}
.sidebar-search:focus-within{border-color:var(--blue);color:var(--blue)}
.sidebar-search input{border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;color:var(--text);width:100%}
.sidebar.collapsed .sidebar-search{display:none}
#count{display:block;font-size:11px;color:var(--muted-2);padding:5px 16px 0;min-height:14px;flex:none}
.sidebar.collapsed #count{display:none}

.editbar{display:none;flex-direction:column;gap:8px;background:var(--orange-tint);border:1px solid #F0CBA8;
  color:#7A3610;border-radius:var(--radius-md);padding:10px 12px;margin:10px 14px 0;font-size:12px;flex:none}
.editbar.show{display:flex}
.editbar b{font-weight:600}
.editbar .ghostbtn{background:var(--canvas);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:6px 10px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text);align-self:flex-start}
.sidebar.collapsed .editbar{display:none !important}

.sidebar-list{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
/* Colapsado: el scrollbar nativo descentra los íconos en la columna de 64px — se oculta (la rueda sigue andando) */
.sidebar.collapsed .sidebar-list{scrollbar-width:none;-ms-overflow-style:none}
.sidebar.collapsed .sidebar-list::-webkit-scrollbar{display:none}

.sidebar-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:none}
.foot-actions{display:flex;gap:6px}
.foot-note{font-size:10.5px;color:var(--muted-2);line-height:1.3}
.sidebar.collapsed .foot-note{display:none}
.sidebar.collapsed .foot-actions{flex-direction:column}
.sidebar.collapsed .btn-edit{padding:8px;justify-content:center}
.sidebar.collapsed .btn-edit .btn-edit-label{display:none}

.content{flex:1;min-width:0;display:flex;background:var(--page)}
.content iframe{flex:1;width:100%;height:100%;border:none;background:var(--canvas)}

.btn-edit{flex:1;background:var(--page);border:1px solid var(--border-strong);color:var(--text);
  border-radius:var(--radius-md);padding:8px 13px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-edit:hover{background:var(--blue-tint);border-color:var(--blue)}
.btn-edit.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.btn-theme{flex:none;width:34px;background:var(--page);border:1px solid var(--border-strong);color:var(--muted);
  border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-theme:hover{background:var(--blue-tint);border-color:var(--blue);color:var(--text)}

/* Filas de la lista de apps — rounded.sm es literalmente "menu items, list rows" en el sistema Notion */
.tool{display:flex;flex-direction:column;flex-shrink:0;background:transparent;border:1px solid transparent;
  border-radius:var(--radius-md);padding:9px 10px;position:relative;overflow:hidden;
  text-decoration:none;color:inherit;cursor:pointer;transition:background .12s,transform .12s}
.tool::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:transparent;transition:background .12s}
.tool:hover{background:var(--page)}
.tool:hover::before{background:color-mix(in srgb, var(--accent,var(--blue)) 35%, transparent)}
.tool.active{background:var(--blue-tint)}
.tool.active::before{background:var(--accent,var(--blue))}
.tool.dragging{opacity:.4}
.tool.hidden-card{opacity:.45}
.tool-top{display:flex;align-items:center;gap:11px}
.ico{width:33px;height:33px;border-radius:var(--radius-sm);flex:none;display:grid;place-items:center;font-size:15px;
  background:color-mix(in srgb, var(--accent,var(--blue)) 14%, white);border:1px solid color-mix(in srgb, var(--accent,var(--blue)) 26%, white)}
.tool h3{margin:0;font-size:13.5px;font-weight:500;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool.active h3{color:var(--accent,var(--blue));font-weight:600}
.estado{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:1px}
.estado .d{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.tool p{display:none}
.sidebar.collapsed .tool h3,.sidebar.collapsed .estado,.sidebar.collapsed .edit-controls{display:none}
.sidebar.collapsed .tool-top{justify-content:center;gap:0}
.sidebar.collapsed .tool{padding:8px 4px}

/* Controles de edición sobre la fila */
.edit-controls{display:none;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.tool.editing .edit-controls{display:flex}
.swatch{width:15px;height:15px;border-radius:50%;border:2px solid var(--canvas);box-shadow:0 0 0 1px var(--border-strong);cursor:pointer}
.swatch.sel{box-shadow:0 0 0 2px var(--text)}
.iconbtn{margin-left:auto;background:var(--canvas);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  width:24px;height:24px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--blue)}
.draghandle{cursor:grab;color:var(--muted-2)}
.tool.editing{cursor:grab}
.dropzone-card{outline:2px dashed var(--blue);outline-offset:2px}

/* Drop sobre la fila de Base de Conocimiento (drag&drop directo) */
.tool.dropready{outline:2px dashed var(--ok);outline-offset:2px;background:var(--ok-tint)}

.addcard{display:flex;align-items:center;justify-content:center;gap:6px;
  border:1.5px dashed var(--border-strong);border-radius:var(--radius-md);color:var(--muted);cursor:pointer;
  padding:10px;background:transparent;font-size:12.5px}
.addcard:hover{border-color:var(--blue);color:var(--blue)}

/* ───────── Modales (Base de Conocimiento / Recursos Gráficos) ───────── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;
  align-items:center;justify-content:center;padding:18px}
.modal-bg.open{display:flex}
.modal{background:var(--canvas);border-radius:var(--radius-lg);width:min(1080px,97vw);height:min(720px,92vh);
  display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.05),0 23px 52px rgba(0,0,0,.10);overflow:hidden}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex:none}
.modal-head .mico{width:36px;height:36px;border-radius:var(--radius-md);background:var(--blue-tint);display:grid;place-items:center;font-size:18px}
.modal-head h2{margin:0;font-size:17px;font-weight:600;flex:1}
.modal-head .x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.modal-toolbar{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap}
.viewtoggle{display:flex;gap:3px;background:var(--page);padding:3px;border-radius:var(--radius-md)}
.viewtoggle button{border:none;background:transparent;border-radius:var(--radius-sm);padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
.viewtoggle button.active{background:var(--canvas);color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.crumb{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumb a{color:var(--blue);cursor:pointer;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.modal-body{flex:1;min-height:0;overflow:auto;padding:16px 20px}
.btn-sm{font-size:12.5px;font-weight:500;border:1px solid var(--border-strong);background:var(--canvas);
  border-radius:var(--radius-md);padding:7px 12px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn-sm:hover{background:var(--blue-tint)}
.btn-sm.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-sm.primary:hover{background:var(--blue-active)}

/* Base de Conocimiento — lista/grilla de docs */
.kb-cat{margin-bottom:20px}
.kb-cat-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.kb-cat-h .ln{flex:1;height:1px;background:var(--border)}
.kb-grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.kb-list .kb-grid{grid-template-columns:1fr}
.doc{background:var(--page);border:1px solid var(--border);border-radius:11px;padding:12px;cursor:pointer;
  display:flex;gap:10px;align-items:flex-start;transition:.12s}
.doc:hover{border-color:var(--blue);background:var(--blue-tint)}
.kb-list .doc{align-items:center}
.doc .dico{font-size:20px;flex:none}
.doc .dnm{font-weight:600;font-size:13.5px;word-break:break-word}
.doc .dmeta{font-size:11.5px;color:var(--muted-2);margin-top:2px}
.dropzone{border:2px dashed var(--border-strong);border-radius:12px;padding:18px;text-align:center;
  color:var(--muted);font-size:13px;margin-bottom:16px;transition:.15s}
.dropzone.over{border-color:var(--ok);background:var(--ok-tint);color:var(--ok)}
.empty{padding:40px;text-align:center;color:var(--muted-2);font-style:italic}

/* Visor de documento */
.docview{display:flex;flex-direction:column;height:100%;gap:10px}
.docview textarea,.docview [contenteditable]{flex:1;width:100%;border:1px solid var(--border-strong);border-radius:10px;padding:12px;
  font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;resize:none;white-space:pre-wrap;word-wrap:break-word;overflow:auto;outline:none;color:var(--text)}
.docview [contenteditable]:empty:before,.gnotes [contenteditable]:empty:before{content:attr(data-placeholder);color:var(--muted-2)}
.docview iframe{flex:1;width:100%;border:1px solid var(--border-strong);border-radius:10px}
.docview .dvbar{display:flex;gap:8px;flex:none}

/* Gerente Regional — pestañas tipo navegador */
.modal-bg.full{padding:0}
.modal.modal-wide{width:100vw;height:100vh;max-width:none;border-radius:0}
.gtabbar{display:flex;align-items:flex-end;background:var(--navy);padding:8px 10px 0;flex:none}
.gtabbar-scroll{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;flex:1;min-width:0}
.gtab{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.07);color:#C7D3E3;
  border-radius:9px 9px 0 0;padding:8px 8px 8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  max-width:190px;min-width:110px;white-space:nowrap;flex:none;transition:.12s}
.gtab:hover{background:rgba(255,255,255,.13)}
.gtab.active{background:var(--canvas);color:var(--text)}
.gtab .gtico{font-size:13px;flex:none}
.gtab .gttxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.gtab .gtx{flex:none;opacity:.55;font-size:16px;line-height:1;padding:0 3px;border-radius:4px}
.gtab .gtx:hover{opacity:1;background:rgba(0,0,0,.15)}
.gtab.active .gtx:hover{background:var(--page)}
.gtab.plus{min-width:0;max-width:none;padding:8px 13px;color:#8DA0B8;font-weight:700;font-size:16px;background:transparent}
.gtab.plus:hover{color:#fff;background:rgba(255,255,255,.1)}
.gtab.pin{min-width:0;max-width:none}
.gtab.pin-end{border-right:1px solid rgba(255,255,255,.14);margin-right:5px;padding-right:15px}
.gtabbar .gx-close{flex:none;align-self:center;margin:0 4px 8px 8px;color:#C7D3E3;background:transparent;border:none;
  font-size:22px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:6px}
.gtabbar .gx-close:hover{color:#fff;background:rgba(255,255,255,.13)}
.gsplit{display:flex;flex:1;width:100%;height:100%;min-width:0}
.gsplit iframe{flex:1;border:none;border-right:1px solid var(--border);min-width:0}
.gnotes{flex:1;display:flex;flex-direction:column;background:var(--page);min-width:0}
.gnotes .gnbar{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex:none}
.gnotes textarea,.gnotes [contenteditable]{flex:1;border:none;background:transparent;resize:none;padding:14px;
  font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;outline:none;color:var(--text);
  white-space:pre-wrap;word-wrap:break-word;overflow:auto}

/* Notas ricas — imagen pegada, clickeable para seleccionar + handle visible para resizear */
.ger-img-wrap{display:inline-block;position:relative;vertical-align:top;max-width:100%;min-width:60px;min-height:40px;
  overflow:hidden;margin:4px 6px 4px 0;border:1px solid var(--border-strong);border-radius:6px;line-height:0;cursor:pointer}
.ger-img-wrap img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
.ger-img-wrap.selected{outline:2px solid var(--blue);outline-offset:1px}
.ger-img-handle{display:none;position:absolute;right:3px;bottom:3px;width:14px;height:14px;
  background:var(--blue);border:2px solid var(--page);border-radius:50%;cursor:nwse-resize;z-index:2;
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
.ger-img-wrap.selected .ger-img-handle{display:block}

/* Notas globales — vista agregada: solo lectura, sin handle de resize */
.gnotas-global{max-width:840px;margin:0 auto}
.gng-bloque{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;cursor:pointer;background:var(--canvas);transition:.12s}
.gng-bloque:hover{border-color:var(--blue);background:var(--blue-tint)}
.gng-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:8px}
.gng-h .gng-f{margin-left:auto;font-weight:500;font-size:11.5px;color:var(--muted-2)}

<script>
/* ═══════════════════════════ Utilidades ═══════════════════════════ */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }
function fmtFecha(iso){ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function fmtBytes(n){ if(!n) return ""; const u=["B","KB","MB","GB"]; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(n<10&&i>0?1:0)+" "+u[i]; }

async function api(action, params){
  const url=CONFIG.APPSSCRIPT_URL+"?action="+action+"&"+new URLSearchParams(params||{}).toString();
  const r=await fetch(url,{cache:"no-store"});
  const d=await r.json();
  if(d.error) throw new Error(d.error);
  return d;
}
async function apiPost(action, payload){
  const r=await fetch(CONFIG.APPSSCRIPT_URL,{method:"POST",body:JSON.stringify({action,key:state.editKey,...payload})});
  const d=await r.json();
  if(d.error) throw new Error(d.error);
  return d;
}

/* ═══════════════════════════ Estado y layout ═══════════════════════════ */
const state = {
  editMode:false, editKey:CONFIG.EDIT_KEY,
  layout:{ order:[], colors:{}, hidden:{}, custom:[] },
  query:"",
  activeKey:null,     // key de la app abierta actualmente en el panel central
  kbCache:null,       // último kb_list
  gxFolderStack:[],   // breadcrumb de carpetas abiertas en Recursos Gráficos
  gxCache:{},         // folderId -> {folders,images}
  gxIndex:[],         // [{folderId,folderNombre,img}] para búsqueda, se llena a medida que se navega
  lightbox:{items:[], idx:0},
  gerTabs:[],         // pestañas abiertas en Gerente Regional
  gerActive:null,     // id de la pestaña activa
};

function allCardDefs(){
  // Tarjetas fijas: TOOLS (links) + kb + graphics, más las "custom" agregadas en modo edición
  const fixed = TOOLS.map(t=>({...t, tipo:"link"}));
  const especiales = [
    {key:"kb", nombre:"Base de Conocimiento", desc:"Condiciones de venta, comisiones, políticas — todo buscable.", icono:"📚", tipo:"kb"},
    {key:"graphics", nombre:"Recursos Gráficos", desc:"Logos, banco de imágenes, catálogos y más.", icono:"🖼️", tipo:"graphics"},
    {key:"gerencial", nombre:"Gerente Regional", desc:"Manuales de gestión y tus notas de lectura, en pestañas.", icono:"🧭", tipo:"gerencial"},
  ];
  return [...fixed, ...especiales, ...(state.layout.custom||[])];
}
function orderedVisibleCards(){
  const defs=allCardDefs(); const byKey={}; defs.forEach(d=>byKey[d.key]=d);
  let order=state.layout.order&&state.layout.order.length?state.layout.order.slice():defs.map(d=>d.key);
  // por si se agregó una tarjeta nueva y el layout guardado es viejo
  defs.forEach(d=>{ if(order.indexOf(d.key)<0) order.push(d.key); });
  order=order.filter(k=>byKey[k]);
  return order.map(k=>byKey[k]);
}

async function cargarLayout(){
  try{
    const {layout}=await api("layout_get");
    if(layout) state.layout={order:[],colors:{},hidden:{},custom:[],...layout};
  }catch(e){ /* sin Apps Script todavía configurado: sigue con layout por defecto */ }
}
async function guardarLayout(){
  try{ await apiPost("layout_save",{layout:state.layout}); }
  catch(e){ toast("No se pudo guardar: "+e.message); }
}

/* ═══════════════════════════ Modo edición ═══════════════════════════ */
$("#btnEdit").addEventListener("click", async ()=>{
  state.editMode=!state.editMode;
  $("#btnEdit").classList.toggle("on", state.editMode);
  $("#editbar").classList.toggle("show", state.editMode);
  render();
});

$("#btnAddCard").addEventListener("click", async ()=>{
  const nombre=window.prompt("Nombre de la tarjeta:"); if(!nombre) return;
  const archivo=window.prompt("Nombre exacto del archivo .html (ej: mi-panel.html):"); if(!archivo) return;
  const desc=window.prompt("Descripción corta (opcional):")||"";
  const icono=window.prompt("Un emoji para el ícono (opcional):")||"📄";
  const key="custom-"+Date.now();
  state.layout.custom=state.layout.custom||[];
  state.layout.custom.push({key,nombre,archivo,desc,icono,tipo:"link"});
  state.layout.order.push(key);
  await guardarLayout(); render();
});

/* ═══════════════════════════ Render de tarjetas ═══════════════════════════ */
function cardMatchesQuery(c, q){
  if(!q) return true;
  return norm(c.nombre+" "+(c.desc||"")).includes(q);
}

function tarjeta(c, idx){
  const color=state.layout.colors[c.key]||PALETA[0].color;
  const oculta=!!state.layout.hidden[c.key];
  if(oculta && !state.editMode) return "";
  const swatches=PALETA.map(p=>`<span class="swatch ${p.color===color?"sel":""}" style="background:${p.color}" data-color="${p.color}" data-key="${esc(c.key)}" title="${esc(p.label)}"></span>`).join("");
  const activa=c.key===state.activeKey;
  const inner=`
    <div class="tool-top">
      <div class="ico">${esc(c.icono||"📄")}</div>
      <div>
        <h3>${esc(c.nombre)}</h3>
        ${c.vivo?`<span class="estado"><span class="d"></span>En vivo</span>`:""}
      </div>
    </div>
    <div class="edit-controls">
      <span class="draghandle" title="Arrastrar para reordenar">⠿⠿</span>
      ${swatches}
      <span class="iconbtn" data-action="toggle-hidden" data-key="${esc(c.key)}" title="${oculta?"Mostrar":"Ocultar"}">${oculta?"🙈":"👁️"}</span>
      ${c.tipo==="link" && c.key.startsWith("custom-") ? `<span class="iconbtn" data-action="delete-custom" data-key="${esc(c.key)}" title="Quitar">🗑️</span>` : ""}
    </div>`;
  const cls=`tool ${state.editMode?"editing":""} ${oculta?"hidden-card":""} ${activa?"active":""}`;
  const style=`style="--accent:${color}"`;
  const attrs=`class="${cls}" ${style} draggable="${state.editMode}" data-key="${esc(c.key)}" data-tipo="${c.tipo}" data-archivo="${esc(c.archivo||"")}" data-nombre="${esc(c.nombre||"")}" title="${esc(c.desc||"")}"`;
  // Tarjetas tipo "link" son <a href> de verdad: click normal abre en el iframe (SPA),
  // pero click con Ctrl/Cmd/Shift, click de rueda o click derecho los maneja el navegador solo
  // (pestaña nueva / ventana nueva / menú contextual), como cualquier link.
  if(c.tipo==="link" && c.archivo) return `<a href="${esc(c.archivo)}" ${attrs}>${inner}</a>`;
  return `<div ${attrs}>${inner}</div>`;
}

/* Marca la fila activa en la sidebar y (si es tipo link) carga el archivo en el iframe central */
function marcarActivo(key){
  state.activeKey=key;
  $$(".tool.active").forEach(el=>el.classList.remove("active"));
  const el=document.querySelector(`.tool[data-key="${CSS.escape(key)}"]`);
  if(el) el.classList.add("active");
}
const APP_TITLE_DEFAULT=document.title;
function abrirArchivo(key, archivo, nombre){
  marcarActivo(key);
  $("#contentFrame").src=archivo;
  document.title=nombre?`${nombre} · M&A`:APP_TITLE_DEFAULT;
}

function render(){
  const q=norm(state.query.trim());
  const cards=orderedVisibleCards();
  const visibles=cards.filter(c=>cardMatchesQuery(c,q));
  const grid=$("#grid");

  let html=visibles.map((c,i)=>tarjeta(c,i)).join("");
  if(state.editMode) html+=`<button class="addcard" id="addcardInline">+ Agregar tarjeta</button>`;
  grid.innerHTML=html || `<div class="empty">Sin resultados.</div>`;

  if(state.editMode){
    const ac=$("#addcardInline"); if(ac) ac.addEventListener("click",()=>$("#btnAddCard").click());
  }
  $("#count").textContent = q ? `${visibles.length} resultado${visibles.length===1?"":"s"}` : "";
  wireCardEvents();
  if(q) buscarEnSubcontenido(q);
}

function wireCardEvents(){
  $$(".tool[data-tipo]").forEach(el=>{
    el.addEventListener("click", e=>{
      const tipo=el.dataset.tipo, archivo=el.dataset.archivo, key=el.dataset.key, nombre=el.dataset.nombre;
      if(state.editMode){
        if(e.target.closest(".edit-controls")) return;
        if(tipo==="link") e.preventDefault(); // no navegar mientras se edita, es <a href> de verdad
        return;
      }
      if(tipo==="link"){
        if(e.ctrlKey||e.metaKey||e.shiftKey) return; // dejar que el navegador abra pestaña/ventana nueva
        e.preventDefault();
        if(archivo) abrirArchivo(key, archivo, nombre);
        return;
      }
      if(tipo==="kb"){ marcarActivo(key); abrirKB(); }
      else if(tipo==="graphics"){ marcarActivo(key); abrirGraphics(); }
      else if(tipo==="gerencial"){ marcarActivo(key); abrirGerencial(); }
    });
    // drag & drop de archivos directo sobre la card de Base de Conocimiento
    if(el.dataset.tipo==="kb"){
      el.addEventListener("dragover", e=>{ if(e.dataTransfer.types.includes("Files")){ e.preventDefault(); el.classList.add("dropready"); } });
      el.addEventListener("dragleave", ()=>el.classList.remove("dropready"));
      el.addEventListener("drop", async e=>{
        if(!e.dataTransfer.files.length) return;
        e.preventDefault(); el.classList.remove("dropready");
        for(const file of e.dataTransfer.files) await subirDocumento(file, "root");
        toast("Documento subido a Base de Conocimiento.");
      });
    }
  });
  // reordenar por drag (solo en modo edición)
  let dragKey=null;
  $$(".tool[draggable='true']").forEach(el=>{
    el.addEventListener("dragstart", e=>{ dragKey=el.dataset.key; el.classList.add("dragging"); });
    el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); });
    el.addEventListener("dragover", e=>{ if(dragKey) e.preventDefault(); });
    el.addEventListener("drop", e=>{
      if(!dragKey || e.dataTransfer.types.includes("Files")) return; // no interferir con drop de archivos
      e.preventDefault();
      const targetKey=el.dataset.key; if(targetKey===dragKey) return;
      const order=orderedVisibleCards().map(c=>c.key);
      const from=order.indexOf(dragKey), to=order.indexOf(targetKey);
      order.splice(from,1); order.splice(to,0,dragKey);
      state.layout.order=order; guardarLayout(); render();
    });
  });
  $$(".swatch").forEach(s=>s.addEventListener("click", e=>{
    e.stopPropagation();
    state.layout.colors[s.dataset.key]=s.dataset.color;
    guardarLayout(); render();
  }));
  $$('[data-action="toggle-hidden"]').forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const k=b.dataset.key; state.layout.hidden[k]=!state.layout.hidden[k];
    guardarLayout(); render();
  }));
  $$('[data-action="delete-custom"]').forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const k=b.dataset.key;
    if(!confirm("¿Quitar esta tarjeta del panel?")) return;
    state.layout.custom=(state.layout.custom||[]).filter(c=>c.key!==k);
    state.layout.order=(state.layout.order||[]).filter(x=>x!==k);
    guardarLayout(); render();
  }));
}

async function buscarEnSubcontenido(q){

  if(!state.kbCache){ try{ state.kbCache=await api("kb_list"); }catch(e){} }

function docIcon(mime){
  if(mime==="text/plain"||mime==="text/markdown") return "📝";
  if(mime===  "application/vnd.google-apps.document") return "📄";
  if((mime||"").includes("wordprocessingml")||mime==="application/msword") return "📘";
  if(mime==="application/pdf") return "📕";
  return "📄";
}

  const body=$("#kbBody"); const q=norm(($("#kbSearch")?.value||"").trim());

  body.className = "modal-body" + (kbView==="list" ? " kb-list" : "");
  const dropHtml=`<div class="dropzone" id="kbDrop">Arrastrá un documento aquí, o <label style="color:var(--blue);cursor:pointer;text-decoration:underline">elegí un archivo<input type="file" id="kbFileInput" style="display:none"></label></div>`;
  const filtrar=arr=>arr.filter(d=>!q||norm(d.nombre).includes(q));
  const renderDocs=arr=>`<div class="kb-grid">${arr.map(d=>`
    <div class="doc" data-id="${esc(d.id)}">

  if(sueltos.length) html+=`<div class="kb-cat"><div class="kb-cat-h">General<span class="ln"></span></div>${renderDocs(sueltos)}</div>`;
  (data.categorias||[]).forEach(cat=>{
    const docs=filtrar(cat.docs||[]);
    if(!docs.length && q) return;
    html+=`<div class="kb-cat"><div class="kb-cat-h">${esc(cat.nombre)}<span class="ln"></span></div>${docs.length?renderDocs(docs):'<div class="empty" style="padding:14px">Sin documentos</div>'}</div>`;
  });

  body.innerHTML=html;

  $$("#kbBody .doc").forEach(d=>d.addEventListener("click",()=>abrirDocKB(d.dataset.id)));

    e.preventDefault(); dz.classList.remove("over");

  });

/* ── Notas ricas: contenteditable + pegado de imágenes con resize ──
   El contenido se sigue guardando como string plano (kb_save no sabe de HTML),
   pero ahora ese string puede ser HTML envuelto en <div data-ger-rich="1">…</div>.
   Notas viejas (texto plano, sin ese wrapper) se siguen mostrando bien: se
   escapan y los saltos de línea se convierten a <br> al cargarlas. */
const GER_RICH_ATTR='data-ger-rich';
const GER_IMG_MAX_DIM=1100;   // px, tope al que se achica una imagen pegada antes de guardarla
const GER_IMG_INIT_W=420;     // px, ancho inicial visible (el usuario después la resizea a mano)

function gerIsRich(raw){ return /^\s*<div\s+data-ger-rich="1">/.test(raw||""); }

function gerContentToHtml(raw){
  if(!gerIsRich(raw)) return esc(raw||"").replace(/\n/g,"<br>");
  const tmp=document.createElement("div"); tmp.innerHTML=raw;
  const wrap=tmp.querySelector(`[${GER_RICH_ATTR}]`);
  return wrap?wrap.innerHTML:esc(raw).replace(/\n/g,"<br>");
}
function gerHtmlToContent(innerHtml){ return `<div ${GER_RICH_ATTR}="1">${innerHtml}</div>`; }

function gerDownscaleImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error);
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("No se pudo leer la imagen"));
      img.onload=()=>{
        let w=img.naturalWidth, h=img.naturalHeight;
        if(w>GER_IMG_MAX_DIM||h>GER_IMG_MAX_DIM){
          const r=Math.min(GER_IMG_MAX_DIM/w, GER_IMG_MAX_DIM/h);
          w=Math.round(w*r); h=Math.round(h*r);
        }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve({dataUrl:canvas.toDataURL("image/jpeg",0.85), w, h});
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function gerImgWrapHtml(dataUrl,w,h){
  const dispW=Math.min(w,GER_IMG_INIT_W), dispH=Math.round(dispW*h/Math.max(w,1));
  return `<span class="ger-img-wrap" contenteditable="false" style="width:${dispW}px;height:${dispH}px">`
       + `<img src="${dataUrl}" alt=""><span class="ger-img-handle" title="Arrastrar para cambiar el tamaño"></span></span>`;
}

function gerInsertHtmlAtCursor(el, html){
  el.focus();
  const sel=window.getSelection();
  let range;
  if(sel && sel.rangeCount && el.contains(sel.anchorNode)){
    range=sel.getRangeAt(0);
  } else {
    range=document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
  }
  range.deleteContents();
  const frag=range.createContextualFragment(html+"​"); // espacio de ancho cero, para poder seguir tipeando después de la imagen
  const lastNode=frag.lastChild;
  range.insertNode(frag);
  if(lastNode){
    const r2=document.createRange();
    r2.setStartAfter(lastNode); r2.collapse(true);
    sel.removeAllRanges(); sel.addRange(r2);
  }
}

// Click en una imagen pegada = seleccionarla (aparece el handle celeste). Click afuera = deseleccionar.
// Arrastrar el handle cambia el tamaño (mantiene proporción).
let __gerDeselectWired=false;
function gerWireDeselect(){
  if(__gerDeselectWired) return;
  __gerDeselectWired=true;
  document.addEventListener("click", ()=>{
    document.querySelectorAll(".ger-img-wrap.selected").forEach(w=>w.classList.remove("selected"));
  });
}

function gerWatchImages(el, onDirty){
  gerWireDeselect();
  el.querySelectorAll(".ger-img-wrap").forEach(wrap=>{
    if(wrap._gerObserved) return;
    wrap._gerObserved=true;
    wrap.addEventListener("click", e=>{
      e.stopPropagation();
      el.querySelectorAll(".ger-img-wrap.selected").forEach(w=>{ if(w!==wrap) w.classList.remove("selected"); });
      wrap.classList.toggle("selected");
    });
    const handle=wrap.querySelector(".ger-img-handle");
    if(!handle) return;
    handle.addEventListener("mousedown", e=>{
      e.preventDefault(); e.stopPropagation();
      const startX=e.clientX, rect=wrap.getBoundingClientRect();
      const startW=rect.width, aspect=rect.width/Math.max(rect.height,1);
      const maxW=Math.max(el.getBoundingClientRect().width-20, 120);
      function onMove(ev){
        let w=startW+(ev.clientX-startX);
        w=Math.max(60, Math.min(w, maxW));
        wrap.style.width=w+"px";
        wrap.style.height=Math.round(w/aspect)+"px";
      }
      function onUp(){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        onDirty();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  });
}

// Engancha paste-de-imagen + selección/resize + tipeo normal en un <div contenteditable>.
// onDirty() se llama cada vez que cambia algo (texto, imagen pegada, o imagen resizeada).
function gerInitRichEditor(el, onDirty){
  el.addEventListener("paste", async e=>{
    const items=Array.from((e.clipboardData&&e.clipboardData.items)||[]);
    const imgItem=items.find(it=>it.type&&it.type.indexOf("image/")===0);
    if(!imgItem) return; // texto normal: dejar que el navegador lo pegue solo
    e.preventDefault();
    const file=imgItem.getAsFile();
    if(!file) return;
    try{
      const {dataUrl,w,h}=await gerDownscaleImage(file);
      gerInsertHtmlAtCursor(el, gerImgWrapHtml(dataUrl,w,h));
      gerWatchImages(el, onDirty);
      onDirty();
    }catch(err){ toast("No se pudo pegar la imagen."); }
  });
  el.addEventListener("input", onDirty);
  gerWatchImages(el, onDirty);
}

  const idx=state.gerTabs.findIndex(t=>t.id===id);

async function renderGerNotasGlobales(){
  const body=$("#gerBody");

// Pestaña fija "Inicio": misma vista que "Nueva pestaña", pero nunca se transforma
// en un documento — cada click abre/activa una pestaña real aparte.
function renderGerHome(){
  const body=$("#gerBody");
  body.style.cssText="padding:22px 20px;overflow:auto;display:block";
  body.innerHTML=gerManualesGridHtml(gerFindCategoria());
  $("#gerBtnNota").onclick=nuevaNotaEnBlanco;
  $$("#gerBody .doc[data-id]").forEach(el=>el.addEventListener("click",()=>{
    abrirGerDoc(el.dataset.id, el.dataset.nombre, el.dataset.mime);
  }));
  $$("#gerBody .doc[data-note]").forEach(el=>el.addEventListener("click",()=>{
    abrirGerNotaSuelta(el.dataset.note, el.dataset.nombre.replace(/\.txt$/i,""));
  }));
}

function renderGerNuevaPestana(t){
  const body=$("#gerBody");
  body.style.cssText="padding:22px 20px;overflow:auto;display:block";
  body.innerHTML=gerManualesGridHtml(gerFindCategoria());
  $("#gerBtnNota").onclick=()=>{ t.kind="note"; t.content=""; t.noteId=null; t.title="Nueva pestaña"; renderGerencial(); };
  $$("#gerBody .doc[data-id]").forEach(el=>el.addEventListener("click",()=>{
    const id=el.dataset.id;
    const existente=state.gerTabs.find(x=>x.kind==="doc"&&x.docId===id);
    if(existente){ state.gerActive=existente.id; renderGerencial(); return; }
    t.kind="doc"; t.docId=id; t.title=el.dataset.nombre; t.mimeType=el.dataset.mime;
    t.noteId=null; t.noteContent=""; t.noteLoaded=false;
    renderGerencial();
  }));
  $$("#gerBody .doc[data-note]").forEach(el=>el.addEventListener("click", async ()=>{
    const id=el.dataset.note;
    const existente=state.gerTabs.find(x=>x.kind==="note"&&x.noteId===id);
    if(existente){ state.gerActive=existente.id; renderGerencial(); return; }
    t.kind="note"; t.noteId=id; t.title=el.dataset.nombre.replace(/\.txt$/i,""); t.content=""; t.loading=true;
    renderGerencial();
    try{ const doc=await api("kb_get",{id}); t.content=doc.texto||""; }catch(e){}
    t.loading=false;
    if(state.gerActive===t.id) renderGerencial();
  }));
}

async function renderGerDoc(t){
  const body=$("#gerBody");
  body.style.cssText="padding:0;overflow:hidden;display:flex";
  body.innerHTML=`<div class="gsplit">
    <iframe src="https://drive.google.com/file/d/${esc(t.docId)}/preview"></iframe>
    <div class="gnotes">
      <div class="gnbar"><span>📝 Notas — ${esc(t.title)}</span><span id="gnStatus" style="margin-left:auto;color:var(--muted-2)"></span>
        <button class="btn-sm" id="gnShare" title="Guardar y copiar link público de solo lectura">🔗</button>
        <button class="btn-sm" id="gnPdf" title="Exportar a PDF">📄 PDF</button>
        <button class="btn-sm" id="gnWord" title="Exportar a Word">📝 Word</button></div>
      <div id="gnText" contenteditable="true" data-placeholder="Escribí tus notas sobre este manual a medida que lo leés… (podés pegar imágenes)">${gerContentToHtml(t.noteContent||"")}</div>
    </div>
  </div>`;
  const ta=$("#gnText");
  if(!t.noteLoaded){
    ta.contentEditable="false"; $("#gnStatus").textContent="Cargando notas…";
    await gerCargarNotaDoc(t);
    if(gerTab(t.id)===t && state.gerActive===t.id){ ta.innerHTML=gerContentToHtml(t.noteContent||""); ta.contentEditable="true"; $("#gnStatus").textContent=""; }
  }
  let debounce;
  gerInitRichEditor(ta, ()=>{
    t.noteContent=gerHtmlToContent(ta.innerHTML);
    $("#gnStatus").textContent="Sin guardar";
    clearTimeout(debounce);
    debounce=setTimeout(()=>gerGuardarNotaGenerica(t, gerNombreNota(t), t.noteContent, "#gnStatus"), 1200);
  });
  $("#gnShare").onclick=()=>gerCompartirNota(t, gerNombreNota(t), t.noteContent, "#gnStatus");
  $("#gnPdf").onclick=()=>gerExportPDF(t.title, ta.innerHTML);
  $("#gnWord").onclick=()=>gerExportWord(t.title, ta.innerHTML);
}

async function gerCargarNotaDoc(t){
  const cat=gerFindCategoria();
  const existente=cat&&(cat.docs||[]).find(d=>d.nombre===gerNombreNota(t)&&d.mimeType==="text/plain");
  if(existente){
    try{ const doc=await api("kb_get",{id:existente.id}); t.noteId=existente.id; t.noteContent=doc.texto||""; }catch(e){}
  }
  t.noteLoaded=true;
}

function renderGerNote(t){
  const body=$("#gerBody");
  body.style.cssText="padding:0;overflow:hidden;display:flex";
  if(t.loading){ body.innerHTML=`<div class="empty" style="margin:auto">Cargando…</div>`; return; }
  body.innerHTML=`<div class="docview" style="padding:16px 20px">
    <div class="dvbar">
      <input type="text" id="gnTitle" value="${esc(t.title)}" style="font-weight:600;border:1px solid var(--border-strong);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:13.5px">
      <span id="gnnStatus" style="margin-left:auto;color:var(--muted-2);font-size:12px;align-self:center"></span>
      <button class="btn-sm" id="gnnShare" title="Guardar y copiar link público de solo lectura">🔗</button>
      <button class="btn-sm" id="gnnPdf" title="Exportar a PDF">📄 PDF</button>
      <button class="btn-sm" id="gnnWord" title="Exportar a Word">📝 Word</button>
      <button class="btn-sm primary" id="gnnSave">Guardar</button>
    </div>
    <div id="gnnText" contenteditable="true" data-placeholder="Escribí tu nota… (podés pegar imágenes)">${gerContentToHtml(t.content||"")}</div>
  </div>`;
  $("#gnTitle").addEventListener("input", e=>{
    t.title=e.target.value||"Nueva pestaña";
    const lbl=document.querySelector(`.gtab[data-id="${t.id}"] .gttxt`);
    if(lbl) lbl.textContent=t.title;
  });
  const gnnEl=$("#gnnText");
  gerInitRichEditor(gnnEl, ()=>{ t.content=gerHtmlToContent(gnnEl.innerHTML); $("#gnnStatus").textContent="Sin guardar"; });
  $("#gnnSave").onclick=async ()=>{
    t.content=gerHtmlToContent(gnnEl.innerHTML);
    await gerGuardarNotaGenerica(t, gerNombreNotaSuelta(t), t.content, "#gnnStatus");
    toast("Nota guardada.");
  };
  $("#gnnShare").onclick=()=>{
    t.content=gerHtmlToContent(gnnEl.innerHTML);
    gerCompartirNota(t, gerNombreNotaSuelta(t), t.content, "#gnnStatus");
  };
  $("#gnnPdf").onclick=()=>gerExportPDF(t.title, gnnEl.innerHTML);
  $("#gnnWord").onclick=()=>gerExportWord(t.title, gnnEl.innerHTML);
}
function gerNombreNotaSuelta(t){
  return t.noteId?null:(t.title||"Nueva pestaña").trim()+((t.title||"").toLowerCase().endsWith(".txt")?"":".txt");
}

async function gerGuardarNotaGenerica(t, nombreArchivo, content, statusSel){
  if(!requireEditKey()){ const el=$(statusSel); if(el) el.textContent="Necesitás la clave de edición."; return; }
  try{
    if(!t.noteId){
      const file=new File([new Blob([content||""],{type:"text/plain"})], nombreArchivo, {type:"text/plain"});
      const cat=gerFindCategoria();
      await subirDocumento(file, cat?cat.id:"root");
      state.kbCache=await api("kb_list");
      const cat2=gerFindCategoria();
      const found=cat2&&(cat2.docs||[]).find(d=>d.nombre===nombreArchivo);
      if(found) t.noteId=found.id;
    } else {
      await apiPost("kb_save",{id:t.noteId, content:content||""});
    }
    const el=$(statusSel); if(el) el.textContent="Guardado ✓";
  }catch(e){ const el=$(statusSel); if(el) el.textContent="Error al guardar"; }
}

/* ── Compartir (link público de solo lectura) + exportar PDF/Word ──
   El link apunta a nota-publica.html?id=<noteId>, un visor standalone
   sin login que lee el mismo kb_get público (BackendPanel.gs, "Cualquiera"
   con el enlace). Para poder compartir hace falta que la nota esté
   guardada, así que "Compartir" guarda primero. */
function gerBuildShareUrl(noteId){
  return new URL("nota-publica.html?id="+encodeURIComponent(noteId), location.href).href;
}

async function gerCompartirNota(t, nombreArchivo, content, statusSel){
  await gerGuardarNotaGenerica(t, nombreArchivo, content, statusSel);
  if(!t.noteId){ toast("No se pudo guardar la nota para compartir."); return; }
  const url=gerBuildShareUrl(t.noteId);
  try{ await navigator.clipboard.writeText(url); toast("Link copiado — cualquiera con este link puede leer la nota, sin login."); }
  catch(e){ window.prompt("Copiá este link para compartir la nota:", url); }
}

// Saca del HTML lo que es solo de la UI del editor (handle de resize, selección) antes de exportar.
function gerCleanExportHtml(innerHtml){
  const tmp=document.createElement("div");
  tmp.innerHTML=innerHtml||"";
  tmp.querySelectorAll(".ger-img-handle").forEach(h=>h.remove());
  tmp.querySelectorAll(".ger-img-wrap").forEach(w=>w.classList.remove("selected"));
  return tmp.innerHTML;
}

async function gerExportPDF(titulo, innerHtml){
  if(typeof html2pdf==="undefined"){ toast("No se pudo cargar el exportador de PDF."); return; }
  const clean=gerCleanExportHtml(innerHtml);
  const wrap=document.createElement("div");
  wrap.style.cssText="font-family:Georgia,serif;font-size:13px;line-height:1.6;padding:24px;max-width:720px;color:#111;background:#fff";
  wrap.innerHTML=`<h2 style="margin:0 0 16px;font-family:Arial,sans-serif">${esc(titulo||"Nota")}</h2>${clean||'<p style="opacity:.5">(sin contenido)</p>'}`;
  document.body.appendChild(wrap);
  try{
    await html2pdf().set({
      margin:10,
      filename:(titulo||"nota").replace(/[\\/:*?"<>|]/g,"_")+".pdf",
      html2canvas:{scale:2,useCORS:true},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}
    }).from(wrap).save();
  }catch(e){ toast("Error al exportar PDF: "+e.message); }
  finally{ wrap.remove(); }
}

function gerExportWord(titulo, innerHtml){
  if(typeof htmlDocx==="undefined"){ toast("No se pudo cargar el exportador de Word."); return; }
  const clean=gerCleanExportHtml(innerHtml);
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(titulo||"Nota")}</title></head>
    <body><h2>${esc(titulo||"Nota")}</h2>${clean||"<p>(sin contenido)</p>"}</body></html>`;
  try{
    const blob=htmlDocx.asBlob(html);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(titulo||"nota").replace(/[\\/:*?"<>|]/g,"_")+".docx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }catch(e){ toast("Error al exportar Word: "+e.message); }
}

/* ═══════════════════════════ Modal: Recursos Gráficos ═══════════════════════════ */
async function abrirGraphics(){
  state.gxFolderStack=[];
  $("#modal").className="modal";
  $("#modalBg").classList.remove("full");
  $("#modal").innerHTML=`
    <div class="modal-head"><div class="mico">🖼️</div><h2>Recursos Gráficos</h2><button class="x" id="modalClose">&times;</button></div>
    <div class="modal-toolbar"><div class="crumb" id="gxCrumb"></div></div>
    <div class="modal-body" id="gxBody"><div class="empty">Cargando…</div></div>`;
  $("#modalBg").classList.add("open");
  $("#modalClose").onclick=cerrarModalGerencial;
  try{ const tree=await api("gx_tree"); renderGxFolders(tree.folders, tree.nombre); }
  catch(e){ $("#gxBody").innerHTML=`<div class="empty">No se pudo leer Recursos Gráficos.<br>${esc(e.message)}</div>`; }
}
function renderCrumb(nombreRaiz){
  const crumb=$("#gxCrumb");
  const parts=[`<a data-i="-1">${esc(nombreRaiz||"Recursos Gráficos")}</a>`];
  state.gxFolderStack.forEach((f,i)=>parts.push(`<span>›</span><a data-i="${i}">${esc(f.nombre)}</a>`));
  crumb.innerHTML=parts.join(" ");
  crumb.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{
    const i=+a.dataset.i;
    if(i===-1){ state.gxFolderStack=[]; abrirGraphics(); }
    else{ state.gxFolderStack=state.gxFolderStack.slice(0,i+1); abrirGxFolder(state.gxFolderStack[i]); }
  }));
}
function renderGxFolders(folders, nombreRaiz){
  renderCrumb(nombreRaiz);
  const body=$("#gxBody");
  if(!folders.length){ body.innerHTML=`<div class="empty">No hay subcarpetas.</div>`; return; }
  body.innerHTML=`<div class="folder-grid">${folders.map(f=>`
    <div class="foldercard" data-id="${esc(f.id)}" data-nombre="${esc(f.nombre)}">
      <span class="fi">📁</span><div><div class="fn">${esc(f.nombre)}</div><div class="fc">${f.count} imagen${f.count===1?"":"es"}</div></div>
    </div>`).join("")}</div>`;
  $$("#gxBody .foldercard").forEach(c=>c.addEventListener("click",()=>{
    state.gxFolderStack.push({id:c.dataset.id,nombre:c.dataset.nombre});
    abrirGxFolder(state.gxFolderStack[state.gxFolderStack.length-1]);
  }));
}
async function abrirGxFolder(folder){
  renderCrumb();
  const body=$("#gxBody"); body.innerHTML=`<div class="empty">Cargando imágenes…</div>`;
  let data=state.gxCache[folder.id];
  if(!data){ data=await api("gx_images",{id:folder.id}); state.gxCache[folder.id]=data;
    data.images.forEach(img=>state.gxIndex.push({folderId:folder.id, folderNombre:folder.nombre, img})); }
  let html="";
  if(data.folders.length) html+=`<div class="folder-grid" style="margin-bottom:16px">${data.folders.map(f=>`
    <div class="foldercard" data-id="${esc(f.id)}" data-nombre="${esc(f.nombre)}">
      <span class="fi">📁</span><div><div class="fn">${esc(f.nombre)}</div><div class="fc">${f.count} imagen${f.count===1?"":"es"}</div></div>
    </div>`).join("")}</div>`;
  if(data.images.length){
    html+=`<div class="img-grid">${data.images.map((im,i)=>`
      <div class="imgcard" data-i="${i}">
        ${im.thumb?`<img src="data:${im.thumbMime};base64,${im.thumb}" alt="">`:`<span class="noprev">🖼️</span>`}
        <span class="fname">${esc(im.nombre)}</span>
      </div>`).join("")}</div>`;
  } else if(!data.folders.length){
    html+=`<div class="empty">Esta carpeta no tiene imágenes.</div>`;
  }
  body.innerHTML=html;
  $$("#gxBody .foldercard").forEach(c=>c.addEventListener("click",()=>{
    state.gxFolderStack.push({id:c.dataset.id,nombre:c.dataset.nombre});
    abrirGxFolder(state.gxFolderStack[state.gxFolderStack.length-1]);
  }));
  $$("#gxBody .imgcard").forEach(c=>c.addEventListener("click",()=>abrirLightbox(data.images, +c.dataset.i)));
}

/* ═══════════════════════════ Lightbox ═══════════════════════════ */
async function abrirLightbox(items, idx){
  state.lightbox={items, idx};
  $("#lightboxBg").classList.add("open");
  await mostrarLightbox();
}
async function mostrarLightbox(){
  const {items, idx}=state.lightbox; const im=items[idx];
  $("#lbImg").src = im.thumb?`data:${im.thumbMime};base64,${im.thumb}`:"";
  $("#lbImg").alt = im.nombre;
  try{
    const full=await api("gx_full",{id:im.id});
    $("#lbImg").src=`data:${full.mimeType};base64,${full.base64}`;
    state.lightbox.fullData=full;
  }catch(e){ /* se queda con la miniatura si falla */ }
}
$("#lbClose").onclick=()=>$("#lightboxBg").classList.remove("open");
$("#lightboxBg").addEventListener("click", e=>{ if(e.target.id==="lightboxBg") $("#lightboxBg").classList.remove("open"); });
$("#lbPrev").onclick=()=>{ const lb=state.lightbox; lb.idx=(lb.idx-1+lb.items.length)%lb.items.length; mostrarLightbox(); };
$("#lbNext").onclick=()=>{ const lb=state.lightbox; lb.idx=(lb.idx+1)%lb.items.length; mostrarLightbox(); };
$("#lbDownload").onclick=()=>{
  const f=state.lightbox.fullData; if(!f) return toast("Esperá que termine de cargar…");
  const a=document.createElement("a"); a.href=`data:${f.mimeType};base64,${f.base64}`; a.download=f.nombre; a.click();
};
$("#lbCopy").onclick=async ()=>{
  const f=state.lightbox.fullData; if(!f) return toast("Esperá que termine de cargar…");
  try{
    const res=await fetch(`data:${f.mimeType};base64,${f.base64}`); const blob=await res.blob();
    await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]);
    toast("Imagen copiada.");
  }catch(e){ toast("Tu navegador no permite copiar imágenes — usá Descargar."); }
};
document.addEventListener("keydown", e=>{
  if(!$("#lightboxBg").classList.contains("open")) return;
  if(e.key==="Escape") $("#lightboxBg").classList.remove("open");
  if(e.key==="ArrowLeft") $("#lbPrev").click();
  if(e.key==="ArrowRight") $("#lbNext").click();
});
$("#modalBg").addEventListener("click", e=>{ if(e.target.id==="modalBg") cerrarModalGerencial(); });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && $("#modalBg").classList.contains("open")) cerrarModalGerencial();
});

function aplicarTema(t){
  document.documentElement.setAttribute("data-theme", t);
  $("#themeIconMoon").style.display = t==="dark" ? "none" : "";
  $("#themeIconSun").style.display = t==="dark" ? "" : "none";
  $("#btnTheme").title = t==="dark" ? "Modo claro" : "Modo oscuro";
}

$("#btnTheme").addEventListener("click", ()=>{
  const actual=document.documentElement.getAttribute("data-theme");
  const nuevo=actual==="dark" ? "light" : "dark";
  aplicarTema(nuevo);
  localStorage.setItem("panelTheme", nuevo);
});
