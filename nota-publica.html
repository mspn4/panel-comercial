<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nota · M&A Centro de Control</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ════════════════════════════════════════════════════════════════════
     CONFIGURACIÓN — mismo Apps Script público (BackendPanel.gs) que usa
     index.html para kb_get. No hace falta login ni clave: es de solo lectura.
     ════════════════════════════════════════════════════════════════════ -->
<script>
const CONFIG = {
  APPSSCRIPT_URL: "https://script.google.com/macros/s/AKfycby3TXMd0s-HJBjyi_i362KIQq_yD_89-f0brHau1K11kLuyzVC7YjbBnHQJS-JX0DmC/exec",
};
</script>

<style>
:root{
  --ink:#000000; --muted:#615D59; --muted-2:#A39E98;
  --canvas:#FFFFFF; --page:#F6F5F4; --border:#E6E6E6; --border-strong:#C9C4BE;
  --blue:#0075DE; --radius-md:8px; --radius-lg:12px;
  --shadow:0 1px 1px rgba(0,0,0,.02),0 3px 8px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#EDECE9; --muted:#B4AFA8; --muted-2:#716C66;
    --canvas:#171614; --page:#0F0E0D; --border:#2B2926; --border-strong:#3A3733;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.6}
header{display:flex;align-items:center;gap:12px;padding:16px 24px;background:var(--canvas);border-bottom:1px solid var(--border)}
header img{height:26px;width:auto}
header .tt{font-weight:600;font-size:13px;color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:32px 24px 64px}
.card{background:var(--canvas);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 32px;box-shadow:var(--shadow)}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
.fecha{font-size:12.5px;color:var(--muted-2);margin-bottom:22px}
.contenido{font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.contenido .ger-img-wrap{display:inline-block;max-width:100%;margin:6px 8px 6px 0;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;line-height:0}
.contenido .ger-img-wrap img{width:100%;height:100%;object-fit:contain;display:block}
.contenido .ger-img-handle{display:none!important}
.empty{padding:60px 20px;text-align:center;color:var(--muted-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
footer{text-align:center;padding:20px;color:var(--muted-2);font-size:11.5px}
footer a{color:var(--blue);text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
<style>
#panelAuthOverlay{display:none;visibility:visible;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;background:#F6F5F4;font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;padding:20px;box-sizing:border-box}
html.panel-locked body{visibility:hidden}
html.panel-locked #panelAuthOverlay{display:flex;visibility:visible}
#panelAuthOverlay .pa-card{width:100%;max-width:360px;background:#fff;border:1px solid #E6E6E6;border-radius:12px;padding:36px 32px;box-shadow:0 20px 50px rgba(0,0,0,.12);box-sizing:border-box}
#panelAuthOverlay .pa-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
#panelAuthOverlay .pa-ma{font-weight:600;font-size:13px;letter-spacing:.5px;background:#DD5B00;color:#fff;padding:4px 8px;border-radius:5px;flex:none}
#panelAuthOverlay .pa-ttl b{display:block;font-weight:700;font-size:15px;color:#000;letter-spacing:-.2px}
#panelAuthOverlay .pa-ttl span{display:block;font-size:10px;color:#615D59;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
#panelAuthOverlay h2{font-size:16px;font-weight:700;color:#000;margin:0 0 5px}
#panelAuthOverlay p.pa-sub{font-size:12.5px;color:#615D59;margin:0 0 22px;line-height:1.4}
#panelAuthOverlay label{display:block;font-size:11px;font-weight:600;color:#615D59;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
#panelAuthOverlay input{width:100%;box-sizing:border-box;padding:9px 11px;font-size:14px;font-family:inherit;border:1px solid #E6E6E6;border-radius:6px;background:#fff;color:#000;margin-bottom:16px;outline:none}
#panelAuthOverlay input:focus{border-color:#0075DE}
#panelAuthOverlay button{width:100%;padding:10px;font-size:14px;font-weight:600;font-family:inherit;color:#fff;background:#0075DE;border:none;border-radius:6px;cursor:pointer;margin-top:2px}
#panelAuthOverlay button:hover{background:#005BAB}
#panelAuthOverlay .pa-error{font-size:12.5px;color:#D7484B;margin:-8px 0 14px;min-height:16px}
#panelAuthOverlay .pa-card.pa-shake{animation:pa-shake .4s}
@keyframes pa-shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
</style>
<script src="assets/nombres-fijos.js"></script>
</head>
<body>
<div id="panelAuthOverlay">
  <div class="pa-card">
    <div class="pa-brand">
      <span class="pa-ma">M&amp;A</span>
      <div class="pa-ttl"><b>Acceso</b><span>Departamento Comercial</span></div>
    </div>
    <h2>Ingresá tus credenciales</h2>
    <p class="pa-sub">Panel interno de uso exclusivo del equipo.</p>
    <form id="panelAuthForm" autocomplete="off">
      <label for="paUser">Usuario</label>
      <input type="text" id="paUser" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <label for="paPass">Contraseña</label>
      <input type="password" id="paPass" autocomplete="current-password" required>
      <div class="pa-error" id="paError"></div>
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
<script>
(function(){
  if (localStorage.getItem('panelAuthOK') === '1') return;
  document.documentElement.classList.add('panel-locked');
  var PA_HASH = '0967f02e309390459f5a18a0b79676ff308c3ad4604113a1984e413595c86551';
  function paHash(s){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    });
  }
  document.getElementById('panelAuthForm').addEventListener('submit', function(e){
    e.preventDefault();
    var u = document.getElementById('paUser').value.trim();
    var p = document.getElementById('paPass').value;
    paHash(u + ':' + p).then(function(h){
      if (h === PA_HASH) {
        localStorage.setItem('panelAuthOK', '1');
        document.documentElement.classList.remove('panel-locked');
      } else {
        document.getElementById('paError').textContent = 'Usuario o contraseña incorrectos.';
        var card = document.querySelector('#panelAuthOverlay .pa-card');
        card.classList.remove('pa-shake');
        void card.offsetWidth;
        card.classList.add('pa-shake');
        document.getElementById('paPass').value = '';
        document.getElementById('paPass').focus();
      }
    });
  });
})();
</script>

<header>
  <img src="assets/logo.png" alt="M&amp;A">
  <span class="tt">Centro de Control · Nota compartida</span>
</header>

<main>
  <div class="card" id="cont"><div class="empty">Cargando…</div></div>
</main>

<footer>Compartido de solo lectura desde el Centro de Control de M&amp;A Equipamientos Comerciales</footer>

<script>
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function isRich(raw){ return /^\s*<div\s+data-ger-rich="1">/.test(raw||""); }
function contentToHtml(raw){
  if(!isRich(raw)) return esc(raw||"").replace(/\n/g,"<br>");
  const tmp=document.createElement("div"); tmp.innerHTML=raw;
  const wrap=tmp.querySelector('[data-ger-rich]');
  return wrap?wrap.innerHTML:esc(raw).replace(/\n/g,"<br>");
}
function fmtFecha(iso){
  if(!iso) return "";
  const d=new Date(iso); if(isNaN(d)) return "";
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})+" · "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
}

(async function(){
  const id=new URLSearchParams(location.search).get("id");
  const cont=document.getElementById("cont");
  if(!id){
    cont.innerHTML='<div class="empty"><b>Falta el link completo</b>Este link no tiene el identificador de la nota.</div>';
    return;
  }
  try{
    const r=await fetch(CONFIG.APPSSCRIPT_URL+"?action=kb_get&id="+encodeURIComponent(id), {cache:"no-store"});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    const titulo=(d.nombre||"Nota").replace(/ — notas\.txt$/,"").replace(/\.txt$/i,"");
    document.title=titulo+" · M&A";
    cont.innerHTML=`<h1>${esc(titulo)}</h1>
      <div class="fecha">${fmtFecha(d.modificado)}</div>
      <div class="contenido">${d.texto?contentToHtml(d.texto):'<span style="opacity:.5">(sin contenido)</span>'}</div>`;
  }catch(e){
    cont.innerHTML=`<div class="empty"><b>No se pudo cargar la nota</b>${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
