<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#0F1B2D; --blue:#1456A0; --blue-tint:#EAF1F8; --blue-tint-2:#DCE9F6;
  --orange:#F07A1A; --orange-tint:#FCE9D6;
  --page:#F4F6F9; --surface:#FFFFFF; --border:#E2E8F0; --border-strong:#CBD6E2;
  --text:#243447; --muted:#6B7A8D; --muted-2:#94A3B4;
  --ok:#1E9E6A; --ok-tint:#E3F4EC; --err:#D7484B; --err-tint:#FBE7E7;
  --warn:#C77B12; --warn-tint:#FCF1DC;
  --shadow:0 1px 2px rgba(15,27,45,.04),0 8px 24px rgba(15,27,45,.06);
  --shadow-sm:0 1px 2px rgba(15,27,45,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--page);color:var(--text);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* Barra superior */
.topbar{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
  border-bottom:3px solid var(--orange);padding:13px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand .ma{font-weight:700;font-size:20px;letter-spacing:.5px;background:var(--orange);color:var(--navy);padding:2px 9px;border-radius:7px}
.brand .t{font-weight:600;font-size:17px}
.brand .t small{display:block;font-weight:400;font-size:12px;color:#9FB2C9}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.clock .lbl{font-size:11px;color:#9FB2C9;text-transform:uppercase;letter-spacing:.6px}
.clock .val{font-size:14px;font-weight:600}
.clock .val .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.clock.loading .val .dot{background:var(--orange);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn{font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:9px;
  padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn-refresh{background:var(--orange);color:var(--navy)}
.btn-refresh:hover{background:#ff8a2a}.btn-refresh:active{transform:translateY(1px)}
.btn-refresh svg{transition:transform .6s}.btn-refresh.spin svg{transform:rotate(360deg)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.2)}

/* Controles */
.controls{position:sticky;top:63px;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  padding:11px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--page);padding:4px;border-radius:11px}
.tab{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;
  color:var(--muted);padding:7px 15px;border-radius:8px;cursor:pointer;transition:.15s}
.tab.active{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm)}
.weeklabel{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.weeklabel b{color:var(--text);font-weight:600}
.search{position:relative;margin-left:auto}
.search input{font-family:inherit;font-size:14px;width:220px;border:1px solid var(--border-strong);
  border-radius:9px;padding:8px 12px 8px 34px;color:var(--text);background:var(--surface)}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-2)}

/* Día */
.daybar{display:flex;gap:6px;padding:14px 22px 0;flex-wrap:wrap}
.daypill{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;line-height:1}
.daypill .d{color:var(--text)}.daypill .f{font-size:11px;color:var(--muted-2);margin-left:5px}
.daypill:hover{border-color:var(--blue)}
.daypill.active{background:var(--blue);border-color:var(--blue);color:#fff}
.daypill.active .d,.daypill.active .f{color:#fff}
.daypill.today::after{content:"HOY";font-size:9px;background:var(--orange);color:var(--navy);
  padding:1px 5px;border-radius:6px;margin-left:7px;font-weight:700;vertical-align:middle}

main{padding:16px 22px 60px}
.notice{background:var(--warn-tint);border:1px solid #EBCF94;color:#7A551A;border-radius:11px;
  padding:11px 15px;margin-bottom:16px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.notice.err{background:var(--err-tint);border-color:#F0B6B7;color:#8A2C2E}
.notice code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12.5px}

/* Grupos */
.group{margin-bottom:26px}
.group-head{display:flex;align-items:center;gap:11px;margin:0 2px 12px}
.group-title{font-size:15px;font-weight:700;letter-spacing:.2px}
.group-title .badge{font-size:11px;font-weight:600;background:var(--blue-tint-2);color:var(--blue);
  padding:2px 8px;border-radius:7px;margin-left:8px;vertical-align:middle}
.group-meta{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.group-meta .dot{width:8px;height:8px;border-radius:50%}
.group-line{flex:1;height:1px;background:var(--border)}

/* Acordeón por sucursal */
.acc{background:var(--surface);border:1px solid var(--border);border-radius:13px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.acc-head{width:100%;background:none;border:none;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:11px;padding:15px 18px;text-align:left}
.acc-head:hover{background:var(--blue-tint)}
.acc .chev{display:flex;color:var(--muted-2);transition:transform .2s}
.acc.open .chev{transform:rotate(90deg);color:var(--blue)}
.acc-title{font-size:16px;font-weight:700;letter-spacing:.2px}
.acc-head .badge{font-size:11px;font-weight:600;background:var(--blue-tint-2);color:var(--blue);padding:2px 9px;border-radius:7px;white-space:nowrap}
.acc-line{flex:1;height:1px;background:var(--border)}
.acc-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.acc-meta .dot{width:8px;height:8px;border-radius:50%}
.acc-body{padding:4px 18px 18px}

/* Última actualización por persona */
.upd{font-size:11px;color:var(--muted-2);margin-top:3px;display:flex;align-items:center;gap:5px}
.upd .updot{width:7px;height:7px;border-radius:50%;flex:none}

/* Tarjetas */
.board{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(288px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card.gerente{border-color:var(--blue-tint-2);box-shadow:0 0 0 1px var(--blue-tint-2),var(--shadow)}
.card-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;cursor:pointer}
.card-head:hover{background:var(--blue-tint)}
.avatar{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.avatar.g{background:var(--blue)}.avatar.l{background:#7C8AA0}
.card-head .who{flex:1;min-width:0}
.card-head .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-head .zn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rolchip{font-size:10px;font-weight:700;letter-spacing:.4px;padding:1px 6px;border-radius:6px;text-transform:uppercase}
.rolchip.g{background:var(--blue-tint);color:var(--blue)}.rolchip.l{background:#EEF1F5;color:#5C6B7E}
.statedot{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;white-space:nowrap}
.statedot .c{width:8px;height:8px;border-radius:50%}
.statedot.ok{color:var(--ok)}.statedot.ok .c{background:var(--ok)}
.statedot.vacia{color:var(--warn)}.statedot.vacia .c{background:var(--warn)}
.statedot.error{color:var(--err)}.statedot.error .c{background:var(--err)}
.statedot.load{color:var(--muted-2)}.statedot.load .c{background:var(--muted-2);animation:pulse 1s infinite}
.card-body{padding:6px 14px 12px;flex:1}
.slot{display:flex;gap:11px;padding:7px 0;border-bottom:1px dashed var(--border)}
.slot:last-child{border-bottom:none}
.slot .h{font-size:12px;font-weight:600;color:var(--blue);width:44px;flex:none;padding-top:1px}
.slot .h.none{color:var(--muted-2)}
.slot .tk{font-size:13px;color:var(--text)}
.empty{padding:16px 4px;color:var(--muted-2);font-size:13px;text-align:center;font-style:italic}
mark{background:var(--orange-tint);color:#9A4B05;padding:0 2px;border-radius:3px}

/* Panel gestionar agendas */
.drawer-bg{position:fixed;inset:0;background:rgba(15,27,45,.45);z-index:50;display:none}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:340px;max-width:88vw;background:var(--surface);
  z-index:51;box-shadow:-8px 0 30px rgba(15,27,45,.18);transform:translateX(100%);transition:.25s;
  display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer h3{margin:0;padding:18px 20px;border-bottom:1px solid var(--border);font-size:16px;
  display:flex;align-items:center;justify-content:space-between}
.drawer .x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.drawer-body{overflow:auto;padding:8px 14px 20px}
.drawer .suc{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 6px 6px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;cursor:pointer}
.chk:hover{background:var(--blue-tint)}
.chk input{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.chk .cn{font-weight:500}.chk .cr{font-size:11px;color:var(--muted);margin-left:auto}
.drawer-actions{display:flex;gap:8px;padding:6px 16px 0}
.drawer-actions button{flex:1;font-size:12.5px;font-weight:600;border:1px solid var(--border-strong);
  background:var(--surface);border-radius:8px;padding:7px;cursor:pointer;color:var(--blue)}
.drawer-actions button:hover{background:var(--blue-tint)}

/* Modal semana */
.modal-bg{position:fixed;inset:0;background:rgba(15,27,45,.5);z-index:60;display:none;
  align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:min(980px,96vw);max-height:90vh;
  display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,27,45,.35);overflow:hidden}
.modal-head{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-head .avatar{width:40px;height:40px}
.modal-head .mt{flex:1}
.modal-head .mt .nm{font-weight:700;font-size:17px}
.modal-head .mt .zn{font-size:13px;color:var(--muted)}
.modal-head .x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.grid-wrap{overflow:auto;margin:0}
table.week{border-collapse:collapse;width:100%;min-width:740px}
table.week th,table.week td{border:1px solid var(--border);vertical-align:top;text-align:left}
table.week thead th{position:sticky;top:0;background:var(--navy);color:#fff;z-index:2;padding:9px 10px;font-size:12px;font-weight:600}
table.week thead th .dd{font-size:11px;color:#9FB2C9;font-weight:500}
table.week thead th.today{background:var(--blue)}
table.week thead th.hcol{background:#08111d;width:58px;text-align:center}
table.week td.hcell{background:var(--blue-tint);color:var(--blue);font-weight:600;font-size:12px;
  text-align:center;white-space:nowrap;padding:8px 6px;position:sticky;left:0}
table.week td.task{padding:7px 9px;font-size:12.5px;min-width:116px}
table.week td.task.today{background:#FAFCFF}
table.week tr:hover td.task{background:var(--blue-tint)}

/* Covente */
.cv-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.cv-toolbar .hint{font-size:12.5px;color:var(--muted)}
.btn-cv{font-family:inherit;font-size:13.5px;font-weight:600;border:none;border-radius:9px;
  padding:9px 15px;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;align-items:center;gap:7px}
.btn-cv:hover{background:#0E3F7E}
.btn-cv.ghost{background:var(--surface);color:var(--blue);border:1px solid var(--border-strong);padding:7px 13px;font-size:12.5px}
.btn-cv.ghost:hover{background:var(--blue-tint)}
.btn-cv.danger{background:var(--err);padding:7px 13px;font-size:12.5px}
.btn-cv.danger:hover{background:#B93A3D}
.cv-mes{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  margin:14px 2px 8px;display:flex;align-items:center;gap:8px}
.cv-mes .ln{flex:1;height:1px;background:var(--border)}
.cv-row{background:var(--page);border:1px solid var(--border);border-radius:11px;padding:11px 14px;
  margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:13px;transition:.12s}
.cv-row:hover{border-color:var(--blue);background:var(--blue-tint)}
.cv-row .cv-fecha{font-weight:700;font-size:13.5px;color:var(--blue);width:52px;flex:none}
.cv-row .cv-resumen{flex:1;font-size:13px;color:var(--text);min-width:0}
.cv-row .cv-resumen .cv-suc{font-weight:600}
.cv-row .cv-chip{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.cv-detail{padding:18px 20px;overflow:auto}
.cv-field{margin-bottom:14px}
.cv-field .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:3px}
.cv-field .val{font-size:14px;color:var(--text);white-space:pre-wrap}
.cv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.cv-sep{height:1px;background:var(--border);margin:16px 0}
.cv-form{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.cv-form textarea{width:100%;min-height:220px;border:1px solid var(--border-strong);border-radius:10px;
  padding:12px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;resize:vertical}
.cv-form textarea.cv-mini{min-height:46px;font-family:inherit;font-size:13.5px;padding:8px 10px;border-radius:8px}
.cv-form textarea.cv-mini.cv-obs{min-height:90px}
.cv-form label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.cv-form input,.cv-form select{width:100%;border:1px solid var(--border-strong);border-radius:8px;
  padding:8px 10px;font-family:inherit;font-size:13.5px}
.cv-form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cv-form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.cv-form-actions{display:flex;gap:9px;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--border)}
.cv-preview-card{border:1px solid var(--border-strong);border-radius:12px;padding:14px 16px;margin-bottom:16px;background:var(--page)}
.cv-preview-num{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);margin-bottom:2px}
.cv-saved{background:var(--ok-tint);border:1px solid #B7E3CC;color:#1A6B46;border-radius:10px;padding:12px 14px;font-size:13.5px;font-weight:600}
.btn-cv[disabled]{opacity:.45;cursor:not-allowed}
.cvr-wrap{overflow:auto;margin-top:16px;border:1px solid var(--border);border-radius:12px}
table.cvr-tabla{border-collapse:collapse;width:100%;min-width:680px;font-size:12.5px}
table.cvr-tabla th,table.cvr-tabla td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.cvr-tabla thead th{background:var(--page);color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
table.cvr-tabla tfoot td{border-top:2px solid var(--border-strong);border-bottom:none;background:var(--page)}
table.cvr-tabla .cvr-tit{font-weight:600}
table.cvr-tabla .cvr-mon{color:var(--muted);font-size:11.5px}

footer{padding:0 22px 30px;color:var(--muted-2);font-size:12px;text-align:center}
@media (max-width:680px){.search{order:5;margin-left:0;width:100%}.search input{width:100%}}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="brand" style="text-decoration:none;color:inherit" title="Volver al Centro de Control">
    <span class="ma">M&amp;A</span>
    <span class="t">Control de Agendas<small>Departamento Comercial</small></span>
  </a>
  <div class="clock" id="clock">
    <span class="lbl">Última actualización</span>
    <span class="val"><span class="dot"></span><span id="clockVal">—</span></span>
  </div>
  <button class="btn btn-ghost" id="btnManage" title="Mostrar u ocultar agendas">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>

<script>
/* ───────── Estado ───────── */
const state = {
  vista:"sucursal", diaSel:hoyDDMM(), query:"",
  sucursales:[],     // [{sucursal,gerente,id, estado, modificado, error}]
  personas:[],       // [{key,sucursal,gerente,nombre,rol,dates,slots,count,modificado,visible}]
  oculta:{},         // key -> true si está oculta
  expanded:{},       // sucursal -> true si está desplegada
  cvCache:null,      // lista de informes Covente (kb_list filtrado a la categoría)
  cvRegistros:null,  // registros ya leídos (kb_get de cada uno) — evita releer todo al abrir/cerrar un acordeón
  cvEditKey:CONFIG.EDIT_KEY,
  cvExpanded:{},     // sucursal -> true si está desplegada (vista Covente)
};
let timer=null;

/* ───────── Utilidades ───────── */
const $=s=>document.querySelector(s);
const norm=s=>(s||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const iniciales=n=>{const p=(n||"?").trim().split(/\s+/);return (((p[0]||"")[0]||"")+((p[1]||"")[0]||"")||"?").toUpperCase();};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hoyDDMM(){const d=new Date();return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");}
function ddmmDe(t){const m=(t||"").match(/(\d{1,2})[\/\-.](\d{1,2})/);return m?m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0"):"";}
/* Semana real de calendario (lunes a domingo de hoy), independiente de lo que
   diga cualquier agenda en Drive — así el selector de fecha nunca depende de
   si un gerente en particular se olvidó de actualizar su hoja. */
const DIAS_SEMANA=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
function semanaRealActual(){
  const hoy=new Date(); const dow=hoy.getDay(); const off=dow===0?-6:1-dow;
  const lunes=new Date(hoy); lunes.setDate(hoy.getDate()+off);
  const hoyStr=hoyDDMM();
  return DIAS_SEMANA.map((dia,i)=>{
    const d=new Date(lunes); d.setDate(lunes.getDate()+i);
    const ddmm=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
    return {dia, ddmm, esHoy:ddmm===hoyStr};
  });
}
function haceCuanto(iso){
  if(!iso) return "";
  const d=new Date(iso), seg=(new Date()-d)/1000;
  if(isNaN(seg)) return "";
  if(seg<90) return "recién";
  const min=seg/60; if(min<60) return "hace "+Math.round(min)+" min";
  const hs=min/60; if(hs<24) return "hace "+Math.round(hs)+" h";
  const dias=hs/24; if(dias<30){const n=Math.round(dias);return "hace "+n+(n===1?" día":" días");}
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"});
}
function frescura(iso){
  if(!iso) return "var(--muted-2)";
  const dias=(new Date()-new Date(iso))/86400000;
  if(dias<2) return "var(--ok)"; if(dias<7) return "var(--warn)"; return "var(--err)";
}
function fmtActualizacion(iso){ // "act. 20/06 · hace 5 días"
  if(!iso) return "";
  const d=new Date(iso); if(isNaN(d)) return "";
  const f=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
  return "act. "+f+" · "+haceCuanto(iso);
}

/* ───────── Parseo de la grilla ─────────
   Se ancla en la FILA DE FECHAS (la que tiene más celdas tipo dd/mm), así
   funciona con o sin la palabra "Horario" y con cualquier corrimiento de
   columnas. La columna de horario se detecta por las celdas tipo HH:MM. */
const RE_FECHA=/^\s*\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?\s*$/;
const RE_HORA=/^\s*\d{1,2}[:.]\d{2}/;
function parseAgenda(rows){
  if(!rows||!rows.length) return null;
  // 1) fila de fechas = la de mayor cantidad de celdas tipo fecha (mín. 3)
  let a=-1, best=0, dateCols=[];
  for(let r=0;r<rows.length;r++){
    const cols=[];
    for(let c=0;c<rows[r].length;c++){ if(RE_FECHA.test(rows[r][c]||"")) cols.push(c); }
    if(cols.length>best){ best=cols.length; a=r; dateCols=cols; }
  }
  if(a<0||best<3) return null; // no parece una agenda → se ignora
  dateCols=dateCols.slice(0,8); // hasta 8 días
  const dayRow=rows[a+1]||[];
  // 2) columna de horario: la columna (a la izquierda de las fechas) con más horas
  const firstDate=dateCols[0];
  let timeCol=firstDate-1, bestT=-1;
  for(let c=0;c<firstDate;c++){
    let cnt=0;
    for(let r=a+2;r<rows.length;r++){ if(RE_HORA.test(rows[r][c]||"")) cnt++; }
    if(cnt>bestT){ bestT=cnt; timeCol=c; }
  }
  // 3) etiqueta de semana (texto a la derecha de una celda que diga "semana")
  let semana="";
  for(let r=0;r<a;r++){
    const i=rows[r].findIndex(c=>norm(c).includes("semana"));
    if(i>=0){ for(let k=i+1;k<rows[r].length;k++){ if((rows[r][k]||"").trim()){semana=rows[r][k].trim();break;} } break; }
  }
  // 4) fechas + días
  const dates=dateCols.map(c=>({fecha:(rows[a][c]||"").trim(),ddmm:ddmmDe(rows[a][c]),dia:(dayRow[c]||"").trim()}));
  // 5) renglones de horario/tareas
  const slots=[]; let count=0;
  for(let r=a+2;r<rows.length;r++){
    const hora=timeCol>=0?(rows[r][timeCol]||"").trim():"";
    const tareas=dateCols.map(c=>(rows[r][c]||"").trim());
    if(!hora&&!tareas.some(t=>t)) continue;
    tareas.forEach(t=>{if(t)count++;});
    slots.push({hora,tareas});
  }
  if(!dates.length) return null;
  return {dates,slots,count,semana};
}

/* ───────── Lectura ───────── */
async function leerSucursal(s){
  const url=CONFIG.APPSSCRIPT_URL+(CONFIG.APPSSCRIPT_URL.includes("?")?"&":"?")+"id="+encodeURIComponent(s.id);
  const r=await fetch(url,{cache:"no-store",redirect:"follow"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const data=await r.json();
  if(data.error) throw new Error(data.error);
  return data; // {archivo, modificado, hojas:[{nombre,rows}]}
}

async function cargarTodo(manual){
  if(!CONFIG.APPSSCRIPT_URL){
    setLoading(false);
    $("#notice").innerHTML=`<div class="notice err">⚠️ <div><b>Falta conectar el lector.</b>
      Pegá la URL del Apps Script (la que termina en <code>/exec</code>) en
      <code>APPSSCRIPT_URL</code>, arriba del archivo.</div></div>`;
    return;
  }
  setLoading(true,manual);
  state.sucursales=CONFIG.SUCURSALES.map(s=>({...s,estado:"load",modificado:null,error:null}));
  let personas=[], fallaron=[];

  await Promise.all(state.sucursales.map(async s=>{
    try{
      const data=await leerSucursal(s);
      s.estado="ok"; s.modificado=data.modificado;
      data.hojas.forEach(h=>{
        const p=parseAgenda(h.rows);
        if(!p) return;
        const apellidos=[].concat(s.gerente);
        const rol = apellidos.some(g=>norm(h.nombre).includes(norm(g))) ? "gerente" : "lider";
        const key=s.sucursal+"|"+h.nombre;
        personas.push({key,sucursal:s.sucursal,gerente:s.gerente,nombre:h.nombre,rol,
          dates:p.dates,slots:p.slots,count:p.count,semana:p.semana,modificado:data.modificado,
          estado:p.count>0?"ok":"vacia", visible:!state.oculta[key]});
      });
    }catch(e){ s.estado="error"; s.error=e.message; fallaron.push(s.sucursal); }
  }));

  personas.sort((a,b)=> a.sucursal.localeCompare(b.sucursal) ||
    ((a.rol==="gerente"?0:1)-(b.rol==="gerente"?0:1)) || a.nombre.localeCompare(b.nombre));
  state.personas=personas;

  pintarNotice(personas.length>0,fallaron);
  marcarReloj(); setLoading(false); render(); renderDrawer();
}

/* ───────── UI helpers ───────── */
function setLoading(on,manual){
  $("#clock").classList.toggle("loading",on);
  if(on) $("#clockVal").textContent="Actualizando…";
  if(manual) $("#btnRefresh").classList.add("spin");
  if(!on) setTimeout(()=>$("#btnRefresh").classList.remove("spin"),650);
}
function marcarReloj(){$("#clockVal").textContent=new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}
function pintarNotice(ok,fallaron){
  const el=$("#notice"); el.innerHTML="";
  if(!ok){
    el.innerHTML=`<div class="notice err">⚠️ <div><b>No se pudo leer ninguna agenda.</b>
      Verificá que la URL del Apps Script esté bien y que esté implementado como
      “Cualquiera con el enlace”. ${fallaron.length?"Sucursales con error: "+esc(fallaron.join(", ")):""}</div></div>`;
    return;
  }
  const partes=[];
  if(fallaron.length) partes.push(`No cargó: <b>${esc(fallaron.join(", "))}</b>.`);
  if(partes.length) el.innerHTML=`<div class="notice">ℹ️ <div>${partes.join("<br>")}</div></div>`;
}
function pintarWeekLabel(){
  const s=semanaRealActual();
  $("#weekLabel").innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg> Semana <b>${esc(s[0].ddmm)} al ${esc(s[6].ddmm)}</b>`;
}
function highlight(t){const x=esc(t);if(!state.query)return x;
  const re=new RegExp("("+state.query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");return x.replace(re,"<mark>$1</mark>");}

function pintarDayBar(){
  const semana=semanaRealActual();
  $("#dayBar").innerHTML=semana.map(d=>`<button class="daypill ${d.ddmm===state.diaSel?"active":""} ${d.esHoy?"today":""}" data-day="${esc(d.ddmm)}">
    <span class="d">${esc(d.dia)}</span><span class="f">${esc(d.ddmm)}</span></button>`).join("");
}

/* ───────── Tarjeta ───────── */
function tarjeta(p){
  const idx=p.dates.findIndex(d=>d.ddmm===state.diaSel);
  let items = idx>=0 ? (p.slots||[]).map(s=>({hora:s.hora,tk:s.tareas[idx]||""})).filter(s=>s.tk) : [];
  if(state.query) items=items.filter(s=>norm(s.tk).includes(norm(state.query)));
  let cuerpo;
  if(idx<0) cuerpo=`<div class="empty">Agenda desactualizada — no tiene cargado este día.</div>`;
  else if(!items.length) cuerpo=`<div class="empty">${state.query?"Sin coincidencias":"Sin tareas para este día"}</div>`;
  else cuerpo=items.map(s=>`<div class="slot"><div class="h ${s.hora?"":"none"}">${esc(s.hora||"·")}</div><div class="tk">${highlight(s.tk)}</div></div>`).join("");
  const estTxt={ok:`${p.count} tareas`,vacia:"Sin tareas",error:"No cargó"}[p.estado]||"";
  return `<div class="card ${p.rol}">
    <div class="card-head" data-modal="${esc(p.key)}">
      <div class="avatar ${p.rol==="gerente"?"g":"l"}">${esc(iniciales(p.nombre))}</div>
      <div class="who">
        <div class="nm">${esc(p.nombre)}</div>
        <div class="zn"><span class="rolchip ${p.rol==="gerente"?"g":"l"}">${p.rol==="gerente"?"Gerente":"Líder"}</span> ${esc(p.sucursal)}</div>
        ${p.modificado?`<div class="upd"><span class="updot" style="background:${frescura(p.modificado)}"></span>${esc(fmtActualizacion(p.modificado))}</div>`:""}
      </div>
      <div class="statedot ${p.estado}"><span class="c"></span>${estTxt}</div>
    </div>
    <div class="card-body">${cuerpo}</div></div>`;
}

function cardsQueAplican(){
  let arr=state.personas.filter(p=>p.visible);
  if(state.vista==="gerente") arr=arr.filter(p=>p.rol==="gerente");
  if(state.vista==="lider")   arr=arr.filter(p=>p.rol==="lider");
  if(state.query){
    arr=arr.filter(p=>{
      const idx=p.dates.findIndex(d=>d.ddmm===state.diaSel);
      if(idx<0) return false;
      return (p.slots||[]).some(s=>{const t=s.tareas[idx];return t&&norm(t).includes(norm(state.query));});
    });
  }
  return arr;
}

function render(){
  if(state.vista==="covente"){ $("#weekLabel").innerHTML=""; $("#dayBar").innerHTML=""; renderCoventeView(); return; }
  pintarWeekLabel(); pintarDayBar();
  const cont=$("#view"); const arr=cardsQueAplican();
  if(!state.personas.length){ cont.innerHTML=""; return; }
  if(!arr.length){ cont.innerHTML=`<div class="empty" style="padding:50px">Nada para mostrar con los filtros actuales.</div>`; return; }

  if(state.vista==="gerente"){ cont.innerHTML=`<div class="board">${arr.map(tarjeta).join("")}</div>`; return; }

  // Agrupado por sucursal en acordeón (vistas "sucursal" y "lider")
  const grupos={};
  arr.forEach(p=>{(grupos[p.sucursal]=grupos[p.sucursal]||[]).push(p);});
  const orden=state.sucursales.map(s=>s.sucursal).filter(s=>grupos[s]);
  cont.innerHTML=orden.map(suc=>{
    const ps=grupos[suc];
    const sObj=state.sucursales.find(x=>x.sucursal===suc)||{};
    const mod=sObj.modificado;
    const nG=ps.filter(p=>p.rol==="gerente").length, nL=ps.filter(p=>p.rol==="lider").length;
    const resumen=[nG?nG+" gerente":"", nL?nL+(nL===1?" líder":" líderes"):""].filter(Boolean).join(" · ");
    const meta=mod?`<span class="dot" style="background:${frescura(mod)}"></span>actualizado ${esc(haceCuanto(mod))}`:"";
    const open=state.query?true:!!state.expanded[suc];
    const body=open?`<div class="acc-body"><div class="board">${ps.map(tarjeta).join("")}</div></div>`:"";
    return `<div class="acc ${open?"open":""}">
      <button class="acc-head" data-suc="${esc(suc)}">
        <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
        <span class="acc-title">${esc(suc)}</span>
        <span class="badge">${esc(resumen)}</span>
        <span class="acc-line"></span>
        <span class="acc-meta">${meta}</span>
      </button>${body}</div>`;
  }).join("");
}

/* ───────── Modal semana ───────── */
function abrirModal(key){
  const p=state.personas.find(x=>x.key===key); if(!p) return;
  const hoy=hoyDDMM();
  let grid;
  if(!p.dates.length) grid=`<div class="empty" style="padding:40px">Sin datos.</div>`;
  else{
    const head=`<tr><th class="hcol">Hora</th>${p.dates.map(d=>`<th class="${d.ddmm===hoy?"today":""}">${esc(d.dia||"")}<div class="dd">${esc(d.ddmm||d.fecha)}</div></th>`).join("")}</tr>`;
    const body=p.slots.map(s=>`<tr><td class="hcell">${esc(s.hora||"·")}</td>${s.tareas.map((t,i)=>`<td class="task ${p.dates[i]&&p.dates[i].ddmm===hoy?"today":""}">${highlight(t)}</td>`).join("")}</tr>`).join("");
    grid=`<div class="grid-wrap"><table class="week"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }
  $("#modal").innerHTML=`
    <div class="modal-head">
      <div class="avatar ${p.rol==="gerente"?"g":"l"}">${esc(iniciales(p.nombre))}</div>
      <div class="mt"><div class="nm">${esc(p.nombre)}</div>
        <div class="zn"><span class="rolchip ${p.rol==="gerente"?"g":"l"}">${p.rol==="gerente"?"Gerente":"Líder"}</span> ${esc(p.sucursal)}${p.modificado?" · "+esc(fmtActualizacion(p.modificado)):""}</div></div>
      <button class="x" id="modalClose">&times;</button>
    </div>${grid}`;
  $("#modalBg").classList.add("open");
  $("#modalClose").onclick=()=>$("#modalBg").classList.remove("open");
}

/* ───────── Panel gestionar ───────── */
function renderDrawer(){
  const grupos={};
  state.personas.forEach(p=>{(grupos[p.sucursal]=grupos[p.sucursal]||[]).push(p);});
  $("#drawerBody").innerHTML=Object.keys(grupos).sort().map(suc=>`
    <div class="suc">${esc(suc)}</div>
    ${grupos[suc].map(p=>`<label class="chk">
      <input type="checkbox" data-key="${esc(p.key)}" ${p.visible?"checked":""}>
      <span class="cn">${esc(p.nombre)}</span>
      <span class="cr">${p.rol==="gerente"?"Gerente":"Líder"}</span></label>`).join("")}
  `).join("")||`<div class="empty" style="padding:30px">Todavía no hay agendas cargadas.</div>`;
}
function setVisible(key,vis){
  const p=state.personas.find(x=>x.key===key); if(p) p.visible=vis;
  if(vis) delete state.oculta[key]; else state.oculta[key]=true;
}

/* ═══════════════════════════ Covente — salidas a campo ═══════════════════════════ */
const CV_CAT="Covente";
const CV_MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
async function bkApi(action,params){
  const url=CONFIG.BACKEND_URL+"?action="+action+"&"+new URLSearchParams(params||{}).toString();
  const r=await fetch(url,{cache:"no-store"}); const d=await r.json();
  if(d.error) throw new Error(d.error); return d;
}
async function bkApiPost(action,payload){
  const r=await fetch(CONFIG.BACKEND_URL,{method:"POST",body:JSON.stringify({action,key:state.cvEditKey,...payload})});
  const d=await r.json(); if(d.error) throw new Error(d.error); return d;
}
function requireCvKey(){ return true; }
function cvFindCategoria(){
  const cats=(state.cvCache&&state.cvCache.categorias)||[];
  return cats.find(c=>norm(c.nombre)===norm(CV_CAT));
}
function cvMesLabel(ym){
  const[y,m]=ym.split("-"); const n=CV_MESES[+m-1]||"";
  return n.charAt(0).toUpperCase()+n.slice(1)+" "+y;
}
function cvGerenteLabel(g){ return [].concat(g||"").join(" / "); }
function cvMatchSucursal(gerenteTexto){
  const g=norm(gerenteTexto||"");
  return CONFIG.SUCURSALES.find(s=>[].concat(s.gerente).some(ape=>g.includes(norm(ape))));
}

/* Etiquetas reconocidas: con o sin ":", con o sin plural/tilde. Cada una captura
   lo que quede en la misma línea (puede ser vacío si el valor arranca en el renglón siguiente). */
const CV_LABELS=[
  {campo:"sucursal",           re:/^sucursal\s*:?\s*(.*)$/i},
  {campo:"gerente",            re:/^gerente\s*:?\s*(.*)$/i},
  {campo:"acompanante",        re:/^vendedor[^:\n]*?acompa[ñn]ado\s*:?\s*(.*)$/i},
  {campo:"zona",               re:/^zona\s+trabajada\s*:?\s*(.*)$/i},
  {campo:"visitas",            re:/^cantidad\s+de\s+visitas\s*:?\s*(.*)$/i},
  {campo:"nuevosNegocios",     re:/^cantidad\s+de\s+nuevos\s+negocios\s*:?\s*(.*)$/i},
  // "ventas personales" tiene que chequearse ANTES que "ventas" a secas, si no
  // cae en el patrón genérico (que no exige límite de palabra después de "ventas").
  {campo:"personalesCantidad", re:/^cantidad\s+de\s+ventas\s+personales(?:\s+realizadas)?\s*:?\s*(.*)$/i},
  {campo:"personalesValor",    re:/^valor\s+total\s+de\s+(?:las\s+)?ventas\s+personales(?:\s+realizadas)?\s*:?\s*(.*)$/i},
  {campo:"ventasCantidad",     re:/^cantidad\s+de\s+ventas\s+realizadas\s*:?\s*(.*)$/i},
  {campo:"ventasValor",        re:/^valor\s+total\s+de\s+(?:las\s+)?ventas\s*:?\s*(.*)$/i},
  {campo:"datosCantidad",      re:/^cantidad\s+de\s+datos\s+recopilados\s*:?\s*(.*)$/i},
  {campo:"datosValor",         re:/^valor\s+total\s+de\s+datos\s*:?\s*(.*)$/i},
  // Estas dos se repiten en las 3 secciones (personales/ventas/datos) con el
  // mismo texto — a cuál campo van depende de la "sección" activa al momento.
  {campo:"detalleProductos",   re:/^detalle\s+de\s+productos?\s*:?\s*(.*)$/i},
  {campo:"condicionVenta",     re:/^condici[oó]n\s+de\s+venta\s*:?\s*(.*)$/i},
  {campo:"observaciones",      re:/^observaciones\s*:?\s*(.*)$/i},
];
/* A qué campo del registro van "Detalle de productos" / "Condición de venta"
   según la sección en la que aparecen (null = esa sección no tiene ese dato). */
const CV_SECCION_DESTINO={
  personales:{detalleProductos:"personalesDetalle", condicionVenta:"personalesCondicion"},
  ventas:    {detalleProductos:"ventasDetalle",      condicionVenta:"condicionVenta"},
  datos:     {detalleProductos:"datosDetalle",       condicionVenta:null},
};

/* Parseo del informe pegado desde WhatsApp. Cada etiqueta puede venir con o sin
   ":", y su valor puede seguir en los renglones siguientes (listas de productos,
   observaciones largas) — esos renglones se acumulan hasta la próxima etiqueta
   reconocida. Usa la "sección" (personales/ventas/datos) para no confundir el
   "Detalle de productos" y la "Condición de venta", que aparecen repetidos. */
function parseCovente(texto){
  const rawLines=(texto||"").split(/\r?\n/);
  let fecha="";
  const mF=(texto||"").match(/informe\s+(\d{1,2})[\/\-.](\d{1,2})/i);
  if(mF) fecha=new Date().getFullYear()+"-"+mF[2].padStart(2,"0")+"-"+mF[1].padStart(2,"0");
  const c={sucursal:"",gerente:"",acompanante:"",zona:"",visitas:"",nuevosNegocios:"",
    personalesCantidad:"",personalesValor:"",personalesDetalle:"",personalesCondicion:"",
    ventasCantidad:"",ventasValor:"",ventasDetalle:"",condicionVenta:"",
    datosCantidad:"",datosValor:"",datosDetalle:"",observaciones:""};
  let seccion="personales", activo=null;
  rawLines.forEach(raw=>{
    const linea=raw.replace(/^[☑✓✔️\s]+/,"").trim();
    if(!linea) return; // línea vacía: no corta el campo que se está acumulando
    let match=null;
    for(const L of CV_LABELS){ const m=linea.match(L.re); if(m){ match={campo:L.campo,valor:(m[1]||"").trim()}; break; } }
    if(match){
      if(match.campo==="personalesCantidad") seccion="personales";
      if(match.campo==="ventasCantidad") seccion="ventas";
      if(match.campo==="datosCantidad") seccion="datos";
      let destino=match.campo;
      if(match.campo==="detalleProductos"||match.campo==="condicionVenta"){
        destino=(CV_SECCION_DESTINO[seccion]||{})[match.campo];
      }
      if(destino){ c[destino]=match.valor; activo=destino; } else activo=null;
    } else if(activo){
      c[activo]=(c[activo]?c[activo]+"\n":"")+linea;
    }
  });
  Object.keys(c).forEach(k=>c[k]=(c[k]||"").trim());
  return {fecha, campos:c, textoOriginal:texto};
}

async function cargarCovente(){
  if(!state.cvCache){ try{ state.cvCache=await bkApi("kb_list"); }catch(e){ state.cvCache={categorias:[]}; } }
}

/* Trae y cachea el contenido de cada salida. Una vez cargado no se vuelve a pedir
   al backend (abrir/cerrar acordeones no debe releer todo) — solo se invalida
   explícitamente después de guardar/borrar una salida. */
async function cargarCoventeRegistros(forzar){
  if(state.cvRegistros && !forzar) return state.cvRegistros;
  await cargarCovente();
  const cat=cvFindCategoria();
  const docs=(cat&&cat.docs||[]).filter(d=>d.mimeType==="text/plain");
  const registros=(await Promise.all(docs.map(async d=>{
    try{ const doc=await bkApi("kb_get",{id:d.id}); const r=JSON.parse(doc.texto||"{}"); r._id=d.id; return r; }
    catch(e){ return null; } // archivo corrupto o no-covente, se ignora
  }))).filter(Boolean);
  state.cvRegistros=registros;
  return registros;
}

function cvResumen(campos){
  const partes=[];
  if(campos.visitas) partes.push(campos.visitas+" visitas");
  if(campos.personalesCantidad) partes.push(campos.personalesCantidad+" venta personal"+(campos.personalesValor?" ("+campos.personalesValor+")":""));
  if(campos.ventasCantidad) partes.push(campos.ventasCantidad+" ventas"+(campos.ventasValor?" ("+campos.ventasValor+")":""));
  if(campos.datosCantidad) partes.push(campos.datosCantidad+" datos");
  return partes.join(" · ")||"Sin resumen";
}

  const toolbar=`<div class="cv-toolbar">
    <button class="btn-cv" id="cvNuevo">+ Nueva salida</button>

    let body="";
    if(open){
      const porMes={};
      regs.forEach(r=>{ const ym=(r.fecha||"").slice(0,7)||"sin-fecha"; (porMes[ym]=porMes[ym]||[]).push(r); });

          <div class="cv-row" data-cvid="${esc(r._id)}">
            <span class="cv-fecha">${r.fecha?esc(r.fecha.slice(8,10)+"/"+r.fecha.slice(5,7)):"—"}</span>
            <span class="cv-resumen"><span class="cv-suc">${esc(r.campos.acompanante||r.campos.gerente||"")}</span> — ${esc(cvResumen(r.campos))}</span>
            <span class="cv-chip">${esc(r.campos.zona||"")}</span>
          </div>`).join("")}
      `).join("")}</div>`;
    }
    return `<div class="acc ${open?"open":""}">
      <button class="acc-head" data-cvsuc="${esc(key)}">
        <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>

  wireCoventeToolbar();

/* Divide un texto con uno o varios informes pegados juntos, usando el
   encabezado "Método COVENTE" como separador de cada salida. */
function splitCoventeBloques(texto){
  const idxs=[]; const re=/m[eé]todo\s+covente/gi; let m;
  while((m=re.exec(texto))) idxs.push(m.index);
  if(idxs.length<=1) return [texto.trim()];
  return idxs.map((start,i)=>texto.slice(start, i+1<idxs.length?idxs[i+1]:texto.length).trim());
}

async function guardarCovente(textoOriginal, editId, container){
  if(!requireCvKey()) return;
  const f=name=>container.querySelector(`[data-f="${name}"]`).value.trim();
  const sucSel=f("sucursal");
  const sObj=CONFIG.SUCURSALES.find(s=>s.sucursal===sucSel);
  const campos={
    sucursal: sucSel, gerente: sObj?cvGerenteLabel(sObj.gerente):"",
    acompanante:f("acompanante"), zona:f("zona"),
    visitas:f("visitas"), nuevosNegocios:f("nuevosNegocios"),
    personalesCantidad:f("personalesCantidad"), personalesValor:f("personalesValor"),
    personalesDetalle:f("personalesDetalle"), personalesCondicion:f("personalesCondicion"),
    ventasCantidad:f("ventasCantidad"), ventasValor:f("ventasValor"),
    ventasDetalle:f("ventasDetalle"), condicionVenta:f("condicionVenta"),
    datosCantidad:f("datosCantidad"), datosValor:f("datosValor"),
    datosDetalle:f("datosDetalle"), observaciones:f("observaciones"),
  };
  const fecha=f("fecha");
  if(!sucSel){ toastErr("Elegí a qué sucursal/gerente corresponde la salida."); return; }
  if(!fecha){ toastErr("Elegí la fecha de la salida."); return; }
  const registro={fecha, sucursalKey:sucSel, campos, textoOriginal};
  try{
    if(editId){
      await bkApiPost("kb_save",{id:editId, content:JSON.stringify(registro)});
    } else {
      let cat=cvFindCategoria();
      if(!cat){ await bkApiPost("kb_create_category",{nombre:CV_CAT}); state.cvCache=await bkApi("kb_list"); cat=cvFindCategoria(); }
      const nombre=`Covente - ${sucSel} - ${fecha} - ${Date.now()}.json`;
      const blob=new Blob([JSON.stringify(registro)],{type:"text/plain"});
      const file=new File([blob], nombre, {type:"text/plain"});
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      await bkApiPost("kb_upload",{filename:nombre, mimeType:"text/plain", base64:b64, categoryId:cat.id});
    }
    state.cvCache=await bkApi("kb_list"); state.cvRegistros=null;
    state.cvExpanded[sucSel]=true;
    renderCoventeView(); // refresca el acordeón de fondo aunque el modal siga abierto
    if(editId){ $("#modalBg").classList.remove("open"); return; }
    const card=container.closest(".cv-preview-card")||container;
    card.innerHTML=`<div class="cv-saved">✓ Guardada — ${esc(sucSel)} · ${esc(fecha.split("-").reverse().join("/"))}</div>`;
  }catch(e){ toastErr("No se pudo guardar: "+e.message); }
}

/* ═══════════════════════════ Resumen de salidas (Covente) ═══════════════════════════ */
function cvIsoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function cvNum(s){ const n=parseInt(String(s||"").replace(/[^\d]/g,""),10); return isNaN(n)?0:n; }
function cvFmtMoneda(n){ return "$"+n.toLocaleString("es-AR"); }
function cvRangoSemana(){
  const hoy=new Date(); const dow=hoy.getDay(); const off=dow===0?-6:1-dow;
  const lunes=new Date(hoy); lunes.setDate(hoy.getDate()+off);
  const domingo=new Date(lunes); domingo.setDate(lunes.getDate()+6);
  return {desde:cvIsoDate(lunes), hasta:cvIsoDate(domingo)};
}
function cvRangoMes(){
  const hoy=new Date();
  const desde=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const hasta=new Date(hoy.getFullYear(),hoy.getMonth()+1,0);
  return {desde:cvIsoDate(desde), hasta:cvIsoDate(hasta)};
}

  $("#modalBg").classList.add("open");
  $("#modalClose").onclick=()=>$("#modalBg").classList.remove("open");
  const selRango=$("#cvrRango"), inDesde=$("#cvrDesde"), inHasta=$("#cvrHasta");
  function aplicarPreset(){
    if(selRango.value==="semana"){ const r=cvRangoSemana(); inDesde.value=r.desde; inHasta.value=r.hasta; }
    if(selRango.value==="mes"){ const r=cvRangoMes(); inDesde.value=r.desde; inHasta.value=r.hasta; }
    inDesde.disabled=inHasta.disabled=selRango.value!=="custom";
    renderCoventeResumenTabla(inDesde.value, inHasta.value);
  }
  selRango.addEventListener("change", aplicarPreset);
  inDesde.addEventListener("change", ()=>renderCoventeResumenTabla(inDesde.value, inHasta.value));
  inHasta.addEventListener("change", ()=>renderCoventeResumenTabla(inDesde.value, inHasta.value));
  aplicarPreset();
}

function renderCoventeResumenTabla(desde, hasta){
  const el=$("#cvrTabla"); if(!el) return;
  if(!desde||!hasta){ el.innerHTML=`<div class="empty">Elegí un rango de fechas.</div>`; return; }
  const registros=(state.cvRegistros||[]).filter(r=>r.fecha && r.fecha>=desde && r.fecha<=hasta);
  if(!registros.length){ el.innerHTML=`<div class="empty" style="padding:30px">No hay salidas cargadas en ese rango.</div>`; return; }

  const porSucursal={};
  registros.forEach(r=>{ const key=r.sucursalKey||"otros"; (porSucursal[key]=porSucursal[key]||[]).push(r); });
  const ordenKeys=[...CONFIG.SUCURSALES.map(s=>s.sucursal), "otros"].filter(k=>porSucursal[k]);

  const filas=ordenKeys.map(key=>{
    const regs=porSucursal[key];
    const sObj=CONFIG.SUCURSALES.find(s=>s.sucursal===key);
    const titulo=sObj?`${sObj.sucursal} — ${cvGerenteLabel(sObj.gerente)}`:"Sin identificar";
    const t={visitas:0,nuevosNegocios:0,persCant:0,persValor:0,ventCant:0,ventValor:0,datCant:0,datValor:0};
    regs.forEach(r=>{
      const c=r.campos||{};
      t.visitas+=cvNum(c.visitas); t.nuevosNegocios+=cvNum(c.nuevosNegocios);
      t.persCant+=cvNum(c.personalesCantidad); t.persValor+=cvNum(c.personalesValor);
      t.ventCant+=cvNum(c.ventasCantidad); t.ventValor+=cvNum(c.ventasValor);
      t.datCant+=cvNum(c.datosCantidad); t.datValor+=cvNum(c.datosValor);
    });
    return {titulo, salidas:regs.length, ...t};
  });
  const total=filas.reduce((a,f)=>({
    salidas:a.salidas+f.salidas, visitas:a.visitas+f.visitas, nuevosNegocios:a.nuevosNegocios+f.nuevosNegocios,
    persCant:a.persCant+f.persCant, persValor:a.persValor+f.persValor,
    ventCant:a.ventCant+f.ventCant, ventValor:a.ventValor+f.ventValor,
    datCant:a.datCant+f.datCant, datValor:a.datValor+f.datValor,
  }), {salidas:0,visitas:0,nuevosNegocios:0,persCant:0,persValor:0,ventCant:0,ventValor:0,datCant:0,datValor:0});

  const fila=f=>`<tr>
    <td class="cvr-tit">${esc(f.titulo)}</td>
    <td>${f.salidas}</td><td>${f.visitas}</td><td>${f.nuevosNegocios}</td>
    <td>${f.persCant}${f.persValor?` <span class="cvr-mon">(${esc(cvFmtMoneda(f.persValor))})</span>`:""}</td>
    <td>${f.ventCant}${f.ventValor?` <span class="cvr-mon">(${esc(cvFmtMoneda(f.ventValor))})</span>`:""}</td>
    <td>${f.datCant}${f.datValor?` <span class="cvr-mon">(${esc(cvFmtMoneda(f.datValor))})</span>`:""}</td>
  </tr>`;

  el.innerHTML=`<div class="cvr-wrap"><table class="cvr-tabla">
    <thead><tr><th>Gerente / Sucursal</th><th>Salidas</th><th>Visitas</th><th>Neg. nuevos</th><th>Vtas. personales</th><th>Vtas. equipo</th><th>Datos</th></tr></thead>
    <tbody>${filas.map(fila).join("")}</tbody>
    <tfoot>${fila({...total,titulo:"Total"}).replace('class="cvr-tit"','class="cvr-tit" style="font-weight:700"')}</tfoot>
  </table></div>`;
}

/* ───────── Eventos ───────── */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); state.vista=t.dataset.view; render();
}));
$("#dayBar").addEventListener("click",e=>{const b=e.target.closest(".daypill");if(!b)return;state.diaSel=b.dataset.day;render();});
function toggleSuc(suc){ state.expanded[suc]=!state.expanded[suc]; render(); }
function toggleCvSuc(suc){ state.cvExpanded[suc]=!state.cvExpanded[suc]; renderCoventeView(); }
$("#view").addEventListener("click",e=>{
  const h=e.target.closest(".acc-head");
  if(h && h.dataset.cvsuc!==undefined){ toggleCvSuc(h.dataset.cvsuc); return; }
  if(h){ toggleSuc(h.dataset.suc); return; }
  const cv=e.target.closest("[data-cvid]"); if(cv){ abrirCoventeDetalle(cv.dataset.cvid); return; }
  const c=e.target.closest("[data-modal]"); if(c) abrirModal(c.dataset.modal);
});
let tB=null;
$("#search").addEventListener("input",e=>{clearTimeout(tB);tB=setTimeout(()=>{state.query=e.target.value.trim();render();},180);});
$("#btnRefresh").addEventListener("click",()=>cargarTodo(true));
$("#btnManage").addEventListener("click",()=>{$("#drawerBg").classList.add("open");$("#drawer").classList.add("open");});
function cerrarDrawer(){$("#drawerBg").classList.remove("open");$("#drawer").classList.remove("open");}
$("#drawerClose").addEventListener("click",cerrarDrawer);
$("#drawerBg").addEventListener("click",cerrarDrawer);
$("#drawerBody").addEventListener("change",e=>{const i=e.target.closest("input[data-key]");if(!i)return;setVisible(i.dataset.key,i.checked);render();});
$("#selAll").addEventListener("click",()=>{state.personas.forEach(p=>setVisible(p.key,true));renderDrawer();render();});
$("#selNone").addEventListener("click",()=>{state.personas.forEach(p=>setVisible(p.key,false));renderDrawer();render();});
$("#modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")$("#modalBg").classList.remove("open");});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#modalBg").classList.remove("open");cerrarDrawer();}});

/* ───────── Inicio ───────── */
$("#refMin").textContent=CONFIG.REFRESCO_MINUTOS;
cargarTodo(false);
if(timer)clearInterval(timer);
timer=setInterval(()=>cargarTodo(false),CONFIG.REFRESCO_MINUTOS*60*1000);
</script>
