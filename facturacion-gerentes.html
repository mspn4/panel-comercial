<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/logo.png">
<title>Facturación · Gerentes</title>
<style>
:root{
  --bg:#F7F8FA; --card:#FFFFFF; --line:#E7EAEF;
  --ink:#151A24; --ink2:#5B6474;
  --brand:#2F6BE4; --brand-dk:#1E2B7A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); display:flex; flex-direction:column;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.topbar{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:12px 26px; background:#fff; border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; flex:none}
.logo{
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg,var(--brand-dk),var(--brand));
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:12.5px; letter-spacing:-.02em;
}
h1{font-size:16.5px; font-weight:700; letter-spacing:-.02em; color:var(--ink)}
.tabs{display:flex; gap:8px; margin-left:8px; flex-wrap:wrap}
.tab{
  text-decoration:none; font-size:13px; font-weight:600; color:var(--ink2);
  background:#fff; border:1px solid var(--line); border-radius:999px;
  padding:8px 16px; transition:background .12s,color .12s,border-color .12s;
}
.tab:hover{background:#F5F7FA; color:var(--ink)}
.tab.on{background:var(--brand); border-color:var(--brand); color:#fff}
.hint{margin-left:auto; font-size:11.5px; color:var(--ink2); white-space:nowrap}
#contentFrame{flex:1; width:100%; border:none; display:block; background:#fff}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html" title="Volver al Centro de Control">
    <div class="logo">M&amp;A</div>
    <h1>Facturación · Gerentes</h1>
  </a>
  <div class="tabs">
    <a class="tab on" data-tab="comp" href="comparativa-gerentes.html">Comparativa Intermensual</a>
    <a class="tab" data-tab="proy" href="proyeccion-gerentes-dashboard.html">Proyección de Facturación</a>
  </div>
  <div class="hint">Click derecho (o Ctrl/Cmd+click) en una pestaña para abrirla en ventana aparte</div>
</div>

<iframe id="contentFrame" src="comparativa-gerentes.html" title="Facturación · Gerentes"></iframe>

<script>
(function(){
  var frame = document.getElementById('contentFrame');
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(e){
      if(e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      tabs.forEach(function(t){ t.classList.remove('on'); });
      tab.classList.add('on');
      frame.src = tab.getAttribute('href');
    });
  });
})();
</script>
</body>
</html>
